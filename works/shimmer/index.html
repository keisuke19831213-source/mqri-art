<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="SHIMMER 薄膜のきらめきとグリント — 薄膜干渉と手続き的グリントで、油膜や玉虫の翅のような構造色が流れる。MQRI ART。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHIMMER">
<meta name="theme-color" content="#030308">
<link rel="manifest" href="manifest.webmanifest">
<title>SHIMMER — Thin-Film Iridescence &amp; Glints</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030308; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: max(4vmin, env(safe-area-inset-top)) max(5vmin, env(safe-area-inset-right)) max(4vmin, env(safe-area-inset-bottom)) max(5vmin, env(safe-area-inset-left));
    font-family: "Avenir Next", "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
    color: rgba(235, 238, 255, 0.92);
    transition: opacity 2.4s ease;
  }
  #overlay.hidden { opacity: 0; }

  .title {
    font-size: clamp(22px, 4.2vmin, 44px);
    font-weight: 200;
    letter-spacing: 1.5em;
    text-indent: 1.5em;
    text-align: center;
    margin-top: 1vmin;
    text-shadow: 0 0 30px rgba(140, 180, 255, 0.35);
  }
  .subtitle {
    text-align: center;
    font-size: clamp(9px, 1.3vmin, 13px);
    font-weight: 300;
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    color: rgba(190, 200, 235, 0.55);
    margin-top: 1.2vmin;
  }
  .hint {
    text-align: center;
    font-size: clamp(8px, 1.15vmin, 12px);
    font-weight: 300;
    letter-spacing: 0.3em;
    color: rgba(170, 180, 215, 0.45);
  }
  .hint span { margin: 0 1.2em; white-space: nowrap; }

  /* touch-action:none が無いと、指の操作をブラウザのスクロールに奪われる */
  #c{touch-action:none}
  html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  /* 操作案内は入力デバイスで出し分ける（指にキーボードもホイールも無い）。
     メディアクエリは初期推定、実際に触られたら html.is-touch が優先する */
  .touch-only{display:none}
  @media (pointer:coarse){.pointer-only{display:none}.touch-only{display:inline}}
  html.is-touch .pointer-only{display:none}
  html.is-touch .touch-only{display:inline}
</style>
<script>addEventListener('touchstart',()=>document.documentElement.classList.add('is-touch'),{once:true,passive:true});</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="overlay">
  <div>
    <div class="title">SHIMMER</div>
    <div class="subtitle">THIN-FILM INTERFERENCE &nbsp;·&nbsp; PROCEDURAL GLINTS</div>
  </div>
  <div class="hint">
    <span class="pointer-only"><span>MOVE — light</span><span>CLICK — burst</span><span>SPACE — pause</span><span>S — save</span><span>F — fullscreen</span></span><span class="touch-only"><span>なぞる — light</span><span>タップ — burst</span><span>長押し — pause</span></span>
  </div>
</div>

<script>
'use strict';

// ============================================================
//  SHIMMER
//  Pass 1 : HDR scene — domain-warped silk field, thin-film
//           spectral interference, multi-scale hashed glints
//  Pass 2 : mip-pyramid bloom, anamorphic streak, chromatic
//           aberration, ACES tonemap, grain & dither
// ============================================================

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
if (!gl) { document.body.innerHTML = '<p style="color:#889;font:14px sans-serif;padding:2em">WebGL2 が利用できない環境です。</p>'; throw new Error('no webgl2'); }

const hasFloat = !!gl.getExtension('EXT_color_buffer_float');

// ---------------------------------------------- shaders

const VERT = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const SCENE_FRAG = `#version 300 es
precision highp float;
out vec4 O;

uniform vec2  R;          // render resolution
uniform float T;          // time (sec)
uniform vec2  M;          // light position, aspect-corrected uv
uniform float uMouseAmt;  // 0..1 how recently the pointer moved
uniform vec3  uBursts[10];// xy: pos, z: birth time (-1e3 = unused)

#define PI  3.14159265359
#define TAU 6.28318530718

// ---- hash / noise -------------------------------------------------
float hash1(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}
vec2 hash2(vec2 p) {
  float h = hash1(p);
  return vec2(h, hash1(p + h + 17.17));
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash1(i);
  float b = hash1(i + vec2(1, 0));
  float c = hash1(i + vec2(0, 1));
  float d = hash1(i + vec2(1, 1));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
const mat2 ROT = mat2(0.80, 0.60, -0.60, 0.80);
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) {
    s += a * vnoise(p);
    p = ROT * p * 2.02;
    a *= 0.5;
  }
  return s;
}

// ---- domain-warped silk field (Inigo Quilez style) ----------------
float field(vec2 p, float t, out vec2 q, out vec2 r) {
  q = vec2(fbm(p + vec2(0.0, 0.0) + 0.05 * t),
           fbm(p + vec2(5.2, 1.3) - 0.04 * t));
  r = vec2(fbm(p + 3.2 * q + vec2(1.7, 9.2) + 0.10 * t),
           fbm(p + 3.2 * q + vec2(8.3, 2.8) - 0.08 * t));
  return fbm(p + 3.0 * r);
}

// ---- thin-film interference (Airy approximation, per-RGB λ) -------
// phase = 4π·n·d·cosθ / λ  — Belcour/Barla-inspired RGB shortcut
vec3 thinFilm(float cosT, float thicknessNm, float phase0) {
  vec3 lambda = vec3(650.0, 540.0, 460.0);
  vec3 phi = 4.0 * PI * 1.38 * thicknessNm * cosT / lambda + phase0;
  vec3 f = max(0.5 + 0.5 * cos(phi), 0.0);
  return pow(f, vec3(1.6));      // deepen the fringes
}

// ---- spectral palette for glint tint ------------------------------
vec3 pal(float t) {
  return 0.5 + 0.5 * cos(TAU * (t + vec3(0.0, 0.33, 0.67)));
}

// ---- one layer of hashed glints -----------------------------------
// Chermain-style: sparse discrete facets, view/flow dependent twinkle
float glintLayer(vec2 uv, float scale, float seed, vec2 flow, float density, float t, out float tint) {
  vec2 g = uv * scale + flow * 0.6;
  vec2 cell = floor(g);
  vec2 f = fract(g);
  float acc = 0.0;
  tint = 0.0;
  // 3x3 neighborhood so sparkles can straddle cell borders
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec2 c = cell + vec2(x, y);
    vec2 rnd = hash2(c + seed);
    if (rnd.x > density) continue;
    vec2 pos = vec2(x, y) + hash2(c + seed + 7.7) - f;
    float distPx = length(pos) * (R.y / scale);          // pixel-space radius
    float mask = smoothstep(2.2, 0.0, distPx);
    // twinkle: temporal phase + flow-field phase → shimmering flicker
    float ph = t * (1.5 + 5.0 * rnd.y) + rnd.x * TAU + (flow.x + flow.y) * 18.0;
    float tw = pow(max(sin(ph), 0.0), 24.0);
    float amp = 1.0 + 24.0 * pow(rnd.y, 6.0);            // rare very bright ones
    float v = mask * tw * amp;
    if (v > acc) { acc = v; tint = fract(rnd.x * 13.7 + rnd.y * 3.1); }
  }
  return acc;
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = (frag - 0.5 * R) / R.y;                      // aspect-corrected
  float t = T;

  // ---- burst rings (click interaction) ----
  float burstWarp = 0.0, burstGlow = 0.0;
  for (int i = 0; i < 10; i++) {
    float birth = uBursts[i].z;
    float age = t - birth;
    if (age < 0.0 || age > 5.0) continue;
    float d = length(uv - uBursts[i].xy);
    float radius = age * 0.55;
    float dd = (d - radius) * 9.0;               // pow(neg, 2.0) is NaN in GLSL — square manually
    float ring = exp(-dd * dd) * exp(-age * 1.1);
    burstWarp += ring;
    burstGlow += ring;
  }

  // ---- silk field ----
  vec2 p = uv * 1.7;
  p += burstWarp * 0.35 * (uv / max(length(uv), 1e-3));
  vec2 q, r;
  float h = field(p, t, q, r);

  // ---- normal from screen derivatives ----
  vec2 grad = vec2(dFdx(h), dFdy(h)) * R.y;   // slope per unit uv
  vec3 n = normalize(vec3(-grad * 0.55, 1.0));

  // ---- lighting ----
  vec2 autoLp = 0.32 * vec2(cos(t * 0.13), sin(t * 0.09));
  vec2 lp = mix(autoLp, M, uMouseAmt);
  vec3 L = normalize(vec3(lp - uv, 0.85));
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 H = normalize(L + V);
  float diff = max(dot(n, L), 0.0) * 0.5 + 0.5;          // wrap
  float spec = pow(max(dot(n, H), 0.0), 48.0);
  float cosT = clamp(dot(n, V), 0.0, 1.0);
  float fres = 0.06 + 0.94 * pow(1.0 - cosT, 5.0);

  // ---- thin-film iridescence ----
  float thickness = (140.0 + 470.0 * h) * (1.0 + 0.10 * sin(t * 0.07));
  vec3 film = thinFilm(cosT, thickness, q.x * 2.5);

  // ---- base composition ----
  vec3 deep = mix(vec3(0.005, 0.007, 0.018), vec3(0.014, 0.011, 0.036), fbm(uv * 1.2 + r));
  vec3 col = deep;
  float lightFall = exp(-2.1 * length(uv - lp));
  float sheenMask = smoothstep(0.30, 0.85, h);            // iridescence lives on the ridges
  col += vec3(0.09, 0.11, 0.19) * lightFall * lightFall * 0.55;   // atmospheric glow around the light
  col += film * (0.11 * diff + 3.2 * spec) * (0.12 + 0.88 * lightFall) * (0.35 + 0.65 * fres) * sheenMask;
  col += film * fres * 0.05 * h * lightFall;              // grazing sheen
  col += film * burstGlow * 0.9;                          // burst iridescent flash

  // ---- glints: three scales, concentrated on lit ridges ----
  float ridge = smoothstep(0.38, 0.72, h) * (0.25 + 0.75 * lightFall) + burstGlow * 1.5;
  float tint1, tint2, tint3;
  float g1 = glintLayer(uv, 150.0, 0.0, r, 0.16, t, tint1);
  float g2 = glintLayer(uv, 78.0, 31.7, q, 0.13, t, tint2);
  float g3 = glintLayer(uv, 38.0, 77.3, r, 0.10, t * 0.8, tint3);
  vec3 glintCol =
      g1 * mix(vec3(1.0), pal(tint1 + h * 0.4), 0.55) * 6.0 +
      g2 * mix(vec3(1.0), pal(tint2 + h * 0.4), 0.65) * 9.0 +
      g3 * mix(vec3(1.0), pal(tint3 + h * 0.4), 0.75) * 12.0;
  col += glintCol * ridge;

  O = vec4(clamp(col, 0.0, 64.0), 1.0);   // keep HDR bounded, no NaN into the mip chain
}`;

const POST_FRAG = `#version 300 es
precision highp float;
out vec4 O;
uniform sampler2D S;
uniform vec2  R;      // output resolution
uniform float T;

// ACES filmic tonemap (Narkowicz approximation)
vec3 aces(vec3 x) {
  return clamp(x * (2.51 * x + 0.03) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float hash1(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

void main() {
  vec2 uv = gl_FragCoord.xy / R;
  vec2 cuv = uv - 0.5;
  float d2 = dot(cuv, cuv);

  // chromatic aberration — radial, wavelength-ordered
  float ca = 0.0035 * d2 * 4.0;
  vec3 base;
  base.r = textureLod(S, 0.5 + cuv * (1.0 + ca), 0.0).r;
  base.g = textureLod(S, uv, 0.0).g;
  base.b = textureLod(S, 0.5 + cuv * (1.0 - ca), 0.0).b;

  // mip-pyramid bloom
  vec3 bloom =
      textureLod(S, uv, 2.0).rgb * 0.30 +
      textureLod(S, uv, 3.0).rgb * 0.28 +
      textureLod(S, uv, 4.0).rgb * 0.24 +
      textureLod(S, uv, 5.0).rgb * 0.20 +
      textureLod(S, uv, 6.0).rgb * 0.16;

  // anamorphic streak — horizontal, cool-tinted
  vec3 streak = vec3(0.0);
  for (int i = 1; i <= 5; i++) {
    float o = float(i) * float(i) * 0.006;
    streak += textureLod(S, uv + vec2(o, 0.0), 3.5).rgb;
    streak += textureLod(S, uv - vec2(o, 0.0), 3.5).rgb;
  }
  streak *= 0.020 * vec3(0.65, 0.78, 1.0);

  vec3 col = base + bloom * 0.55 + streak;

  // exposure & tonemap
  col = aces(col * 1.15);
  col = pow(col, vec3(1.0 / 2.2));

  // vignette
  col *= 1.0 - 0.42 * smoothstep(0.15, 0.85, d2 * 2.4);

  // film grain + dither (kills banding in the deep blues)
  float gr = hash1(gl_FragCoord.xy + fract(T) * 61.7);
  col += (gr - 0.5) * 0.022;

  O = vec4(col, 1.0);
}`;

// ---------------------------------------------- GL helpers

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s) + '\n--- source ---\n' + src);
  }
  return s;
}
function program(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

const sceneProg = program(SCENE_FRAG);
const postProg  = program(POST_FRAG);
const U = (p, n) => gl.getUniformLocation(p, n);
const su = { R: U(sceneProg, 'R'), T: U(sceneProg, 'T'), M: U(sceneProg, 'M'),
             mouseAmt: U(sceneProg, 'uMouseAmt'),
             bursts: U(sceneProg, 'uBursts') || U(sceneProg, 'uBursts[0]') };
const pu = { R: U(postProg, 'R'), T: U(postProg, 'T'), S: U(postProg, 'S') };

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

// ---------------------------------------------- HDR framebuffer (mipmapped)

let fbo = null, fboTex = null, fboW = 0, fboH = 0;
function makeFBO(w, h) {
  if (fboTex) { gl.deleteTexture(fboTex); gl.deleteFramebuffer(fbo); }
  fboTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  const levels = Math.floor(Math.log2(Math.max(w, h))) + 1;
  gl.texStorage2D(gl.TEXTURE_2D, levels, hasFloat ? gl.RGBA16F : gl.RGBA8, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  fboW = w; fboH = h;
}

// ---------------------------------------------- state

let renderScale = 1.0;                 // adaptive
let dpr = Math.min(window.devicePixelRatio || 1, 2);
let paused = false;
let timeAcc = 0, lastNow = performance.now();

const mouse = { x: 0, y: 0, amt: 0, lastMove: -1e3 };
const bursts = new Float32Array(30).fill(-1e3);   // 10 × (x, y, t0)
let burstIdx = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.floor(innerWidth * dpr * renderScale));
  const h = Math.max(2, Math.floor(innerHeight * dpr * renderScale));
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  makeFBO(w, h);
}
addEventListener('resize', resize);
resize();

// aspect-corrected uv from client coords
function toUV(cx, cy) {
  const x = (cx * dpr - 0.5 * canvas.width) / canvas.height;
  const y = (0.5 * canvas.height - cy * dpr) / canvas.height;
  return [x, y];
}

addEventListener('pointermove', e => {
  [mouse.x, mouse.y] = toUV(e.clientX, e.clientY);
  mouse.lastMove = timeAcc;
  wakeOverlay();
});
// ── タッチ: 長押し = 一時停止（指にキーボードは無い）──
// なぞって光を動かす・タップでバースト、は pointer 系がそのまま拾う（#c の touch-action:none が前提）。
{
  let holdTimer=null, moved=false;
  const clearHold=()=>{ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } };
  canvas.addEventListener('touchstart', e => {
    document.documentElement.classList.add('is-touch');
    if (e.touches.length === 1) {
      moved = false; clearHold();
      holdTimer = setTimeout(() => { if (!moved) { paused = !paused; wakeOverlay(); } }, 600);
    } else clearHold();
  }, { passive: true });
  canvas.addEventListener('touchmove', () => { moved = true; clearHold(); }, { passive: true });
  canvas.addEventListener('touchend', clearHold, { passive: true });
  canvas.addEventListener('touchcancel', clearHold, { passive: true });
}

addEventListener('pointerdown', e => {
  const [x, y] = toUV(e.clientX, e.clientY);
  bursts[burstIdx * 3] = x;
  bursts[burstIdx * 3 + 1] = y;
  bursts[burstIdx * 3 + 2] = timeAcc;
  burstIdx = (burstIdx + 1) % 10;
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  if (e.key === 'f' || e.key === 'F') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
  if (e.key === 's' || e.key === 'S') {
    const a = document.createElement('a');
    a.download = 'shimmer.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }
  wakeOverlay();
});

// ---- overlay auto-fade ----
const overlay = document.getElementById('overlay');
let overlayTimer = null;
function wakeOverlay() {
  overlay.classList.remove('hidden');
  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(() => overlay.classList.add('hidden'), 5000);
}
wakeOverlay();

// ---------------------------------------------- render loop

let emaDt = 16.7, adaptTick = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now - lastNow, 100);
  lastNow = now;
  if (!paused) timeAcc += dt / 1000;

  // adaptive resolution: keep ~60fps on weaker GPUs
  emaDt = emaDt * 0.95 + dt * 0.05;
  if (++adaptTick >= 90) {
    adaptTick = 0;
    if (emaDt > 22 && renderScale > 0.55) { renderScale = Math.max(0.55, renderScale - 0.15); resize(); }
    else if (emaDt < 14 && renderScale < 1.0) { renderScale = Math.min(1.0, renderScale + 0.1); resize(); }
  }

  mouse.amt = Math.max(0, Math.min(1, 1.5 - (timeAcc - mouse.lastMove) * 0.25));

  // ---- pass 1: HDR scene → mipmapped FBO ----
  gl.bindTexture(gl.TEXTURE_2D, null);   // avoid render feedback loop
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, fboW, fboH);
  gl.useProgram(sceneProg);
  gl.uniform2f(su.R, fboW, fboH);
  gl.uniform1f(su.T, timeAcc);
  gl.uniform2f(su.M, mouse.x, mouse.y);
  gl.uniform1f(su.mouseAmt, mouse.amt);
  gl.uniform3fv(su.bursts, bursts);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.generateMipmap(gl.TEXTURE_2D);

  // ---- pass 2: composite → screen ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(postProg);
  gl.uniform2f(pu.R, canvas.width, canvas.height);
  gl.uniform1f(pu.T, timeAcc);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.uniform1i(pu.S, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
