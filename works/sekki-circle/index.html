<script>

 {n:"立夏",k:"りっか",    m:5, d:5, desc:"夏の光が立ちはじめる",      pal:["#274a3d","#5eae8c","#f1f7d0"], ph:[0,0,.15,.5,0,0]},
 {n:"小満",k:"しょうまん",m:5, d:21,desc:"いのちが満ちてゆく",        pal:["#2c5145","#7fbd82","#f7e39a"], ph:[0,0,0,.6,0,0]},
 {n:"芒種",k:"ぼうしゅ",  m:6, d:5, desc:"穂の種を蒔くころ",          pal:["#2f4a56","#6d9aa0","#c3d3ac"], ph:[0,.7,0,.1,.15,0]},
 {n:"夏至",k:"げし",      m:6, d:21,desc:"いちばん長い昼",            pal:["#1c3b63","#4b8fbf","#f6de79"], ph:[0,.5,0,.1,.4,0]},
 {n:"小暑",k:"しょうしょ",m:7, d:7, desc:"梅雨明けの風が熱を運ぶ",    pal:["#14304f","#3f7d9b","#ffd97a"], ph:[0,.1,0,.2,.8,0]},

 {n:"秋分",k:"しゅうぶん",m:9, d:23,desc:"昼と夜がふたたび並ぶ",      pal:["#2e2a4d","#6f66ac","#f0e9a6"], ph:[0,0,0,.3,0,.5]},
 {n:"寒露",k:"かんろ",    m:10,d:8, desc:"露が冷たさを帯びる",        pal:["#33293f","#8b6ba8","#d8a253"], ph:[0,.15,0,.2,0,.7]},
 {n:"霜降",k:"そうこう",  m:10,d:23,desc:"初霜が野を染める",          pal:["#302336","#9d5b45","#f0a04b"], ph:[0,0,0,.15,0,1]},
 {n:"立冬",k:"りっとう",  m:11,d:7, desc:"冬の入り口に立つ",          pal:["#26262e","#6f7480","#d3cfc3"], ph:[.25,0,0,.1,0,.6]},
 {n:"小雪",k:"しょうせつ",m:11,d:22,desc:"わずかな雪が舞いはじめる",  pal:["#2a333a","#7d8f96","#e6e8e6"], ph:[.6,0,0,.1,0,.25]},
 {n:"大雪",k:"たいせつ",  m:12,d:7, desc:"雪が本降りとなる",          pal:["#232a3a","#66788f","#edf4fb"], ph:[1,0,0,0,0,0]},
 {n:"冬至",k:"とうじ",    m:12,d:22,desc:"いちばん長い夜、柚子湯",    pal:["#14204a","#4a5d8a","#f7c873"], ph:[.8,0,0,.2,0,0]},
 {n:"小寒",k:"しょうかん",m:1, d:5, desc:"寒の入り、冷気が澄む",      pal:["#171a3e","#5a6b9e","#dff1f5"], ph:[.7,0,0,.15,0,0]},
 {n:"大寒",k:"だいかん",  m:1, d:20,desc:"寒さの極み、春への折返し",  pal:["#1a2340","#4d6e8f","#d5ecf2"], ph:[.9,0,0,.1,0,0]},
];

/* 七十二候 — 各節気に初候・次候・末候 */
const KO = [
 ["東風解凍","黄鶯睍睆","魚上氷"],["土脉潤起","霞始靆","草木萌動"],["蟄虫啓戸","桃始笑","菜虫化蝶"],
 ["雀始巣","桜始開","雷乃発声"],["玄鳥至","鴻雁北","虹始見"],["葭始生","霜止出苗","牡丹華"],
 ["蛙始鳴","蚯蚓出","竹笋生"],["蚕起食桑","紅花栄","麦秋至"],["螳螂生","腐草為蛍","梅子黄"],
 ["乃東枯","菖蒲華","半夏生"],["温風至","蓮始開","鷹乃学習"],["桐始結花","土潤溽暑","大雨時行"],
 ["涼風至","寒蝉鳴","蒙霧升降"],["綿柎開","天地始粛","禾乃登"],["草露白","鶺鴒鳴","玄鳥去"],
 ["雷乃収声","蟄虫坏戸","水始涸"],["鴻雁来","菊花開","蟋蟀在戸"],["霜始降","霎時施","楓蔦黄"],
 ["山茶始開","地始凍","金盞香"],["虹蔵不見","朔風払葉","橘始黄"],["閉塞成冬","熊蟄穴","鱖魚群"],
 ["乃東生","麋角解","雪下出麦"],["芹乃栄","水泉動","雉始雊"],["款冬華","水沢腹堅","鶏始乳"],
];
const KO_LABEL = ["初候","次候","末候"];
const SEASON = ["春","夏","秋","冬"];

/* ============================================================
   暦計算 — 年周位置 pos∈[0,1) 立春=0
============================================================ */
function doy(m,d){ return Math.floor((Date.UTC(2026,m-1,d)-Date.UTC(2026,0,1))/864e5); }
const STARTS = SEKKI.map(s=>doy(s.m,s.d));
const BASE = STARTS[0]; // 立春
const relStarts = STARTS.map(v=>(v-BASE+365)%365);

function dateToPos(date){
  const y = date.getFullYear();
  const dd = Math.floor((Date.UTC(y,date.getMonth(),date.getDate())-Date.UTC(y,0,1))/864e5);
  const r = (dd-BASE+365)%365;
  for(let i=23;i>=0;i--){
    const a = relStarts[i], b = (i===23)?365:relStarts[i+1];
    if(r>=a){ return (i+(r-a)/(b-a))/24; }
  }
  return 0;
}
function posToDateStr(idx){
  const s = SEKKI[idx], e = SEKKI[(idx+1)%24];
  return `${s.m}月${s.d}日 – ${e.m}月${e.d-1}日ごろ`;
}

/* ============================================================
   色ユーティリティ
============================================================ */
function hex2rgb(h){
  return [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
}
const PALS = SEKKI.map(s=>s.pal.map(hex2rgb));
function lerp(a,b,t){ return a+(b-a)*t; }
function lerp3(a,b,t){ return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]; }
function smooth(t){ return t*t*(3-2*t); }

/* ============================================================
   WebGL2 — 大気シェーダー
============================================================ */
const glCanvas = document.getElementById("gl");
const gl = glCanvas.getContext("webgl2",{antialias:false,alpha:false});

const VERT = `#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position = vec4(aPos,0.,1.); }`;

const FRAG = `#version 300 es
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec3  uColA, uColB, uColC;
uniform float uPh[6];      // 雪 雨 花弁 光塵 蛍 落葉
uniform float uSunH;       // 太陽高度 -0.1..0.35
uniform float uSunWarm;    // 低いほど暖色
out vec4 fragColor;

float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2  hash22(vec2 p){ float n=hash21(p); return vec2(n,hash21(p+n+7.31)); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){
  float v=0., a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; }
  return v;
}

/* --- 粒子場：セルハッシュ方式（1レイヤ） --- */
float snowL(vec2 uv,float t,float sc,float sp){
  vec2 p=uv*sc; p.y+=t*sp; p.x+=sin(t*.22+sc)*.35;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  vec2 off=(rn-.5)*.72;
  off.x+=.18*sin(t*(1.+rn.x)+rn.y*6.28);
  float d=length(gv-off);
  return smoothstep(.055+.045*rn.x,.0,d)*(.35+.65*rn.y);
}
float rainL(vec2 uv,float t,float sc,float sp){
  vec2 p=uv; p.x+=p.y*.12;
  p*=vec2(sc*1.6, sc*.28); p.y+=t*sp;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  if(rn.x>.55) return 0.;
  float w=smoothstep(.05,.0,abs(gv.x-(rn.y-.5)*.6));
  float l=smoothstep(.5,.1,abs(gv.y));
  return w*l*.5;
}
float petalL(vec2 uv,float t,float sc,float sp){
  vec2 p=uv*sc; p.y+=t*sp; p.x+=t*sp*.45+sin(t*.3)*.4;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  if(rn.x>.6) return 0.;
  vec2 off=(rn-.5)*.6;
  off.y+=.12*sin(t*1.4+rn.x*6.28);
  vec2 q=rot(t*(rn.x-.5)*4.+rn.y*6.28)*(gv-off);
  q.x*=1.9;
  float d=length(q);
  float flick=.65+.35*sin(t*(2.+rn.x*2.)+rn.y*9.);
  return smoothstep(.10,.02,d)*flick;
}
float moteL(vec2 uv,float t,float sc,float sp){
  vec2 p=uv*sc; p.y-=t*sp;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  if(rn.x>.45) return 0.;
  vec2 off=(rn-.5)*.7; off+= .1*vec2(sin(t+rn.y*9.),cos(t*.8+rn.x*7.));
  float d=length(gv-off);
  float tw=.5+.5*sin(t*(1.5+rn.y*2.)+rn.x*6.28);
  return smoothstep(.035,.0,d)*tw;
}
float fireflyL(vec2 uv,float t,float sc){
  vec2 p=uv*sc;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  if(rn.x>.18) return 0.;
  vec2 off=.62*vec2(sin(t*.4+rn.y*6.28), cos(t*.31+rn.x*6.28))*(.4+.6*rn.y);
  float d=length(gv-off);
  float pulse=pow(.5+.5*sin(t*(.9+rn.y)+rn.x*20.), 6.);
  return (.003/(d*d+.0015))*pulse;
}
float leafL(vec2 uv,float t,float sc,float sp,out float hue){
  vec2 p=uv*sc; p.y+=t*sp; p.x+=sin(t*.45+p.y*.8)*.5;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  hue=rn.y;
  if(rn.x>.5) return 0.;
  vec2 off=(rn-.5)*.6;
  vec2 q=rot(t*(rn.y-.5)*5.+rn.x*6.28)*(gv-off);
  q.x*=1.6; q.y*=.9;
  float sway=.7+.3*sin(t*3.+rn.x*12.);
  return smoothstep(.12,.03,length(q))*sway;
}

void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;      // y上向き・アスペクト補正
  float t=uTime;

  /* --- ドメインワープFBMの大気 --- */
  vec2 p=uv*2.1;
  vec2 q=vec2(fbm(p+t*.018), fbm(p+vec2(5.2,1.3)-t*.014));
  vec2 r=vec2(fbm(p+2.6*q+vec2(1.7,9.2)+t*.021), fbm(p+2.6*q+vec2(8.3,2.8)-t*.017));
  float f=fbm(p+2.2*r);

  vec3 col=mix(uColA, uColB, clamp(f*f*2.3,0.,1.));
  col=mix(col, uColC, clamp(length(q)*.75,0.,1.)*.42);
  col=mix(col, uColB*1.25, clamp(r.y*r.y,0.,1.)*.30);
  col*=mix(.62,1.12, smoothstep(-.75,.85,uv.y+f*.35));

  /* --- 太陽の暈 --- */
  vec2 sun=vec2(0., uSunH);
  float sd=length(uv-sun);
  vec3 sunCol=mix(vec3(1.,.62,.34), vec3(1.,.94,.78), 1.-uSunWarm);
  col+=sunCol*exp(-sd*3.4)*.34;
  col+=sunCol*exp(-sd*13.)*.22;

  /* --- 季節の粒子 --- */
  if(uPh[0]>.004){ // 雪
    float s=snowL(uv,t,7.,.16)+snowL(uv+3.7,t,12.,.26)*.7+snowL(uv+9.1,t,20.,.42)*.45;
    col+=s*uPh[0]*vec3(.92,.96,1.05)*.9;
  }
  if(uPh[1]>.004){ // 雨
    float rr=rainL(uv,t,9.,3.2)+rainL(uv+5.3,t,15.,4.4)*.6;
    col+=rr*uPh[1]*vec3(.68,.78,.92)*.5;
  }
  if(uPh[2]>.004){ // 花弁
    float pe=petalL(uv,t,6.,.20)+petalL(uv+2.9,t,10.,.32)*.7;
    col+=pe*uPh[2]*vec3(1.,.80,.85)*.95;
  }
  if(uPh[3]>.004){ // 光塵
    float mo=moteL(uv,t,9.,.05)+moteL(uv+7.7,t,16.,.09)*.7;
    col+=mo*uPh[3]*vec3(1.,.92,.72)*.85;
  }
  if(uPh[4]>.004){ // 蛍
    float mask=smoothstep(.45,-.35,uv.y);
    float ff=fireflyL(uv,t,5.)+fireflyL(uv+4.2,t,8.)*.6;
    col+=clamp(ff,0.,2.)*uPh[4]*mask*vec3(.78,.95,.42);
  }
  if(uPh[5]>.004){ // 落葉
    float h1,h2;
    float l1=leafL(uv,t,5.5,.22,h1), l2=leafL(uv+6.3,t,9.,.34,h2)*.7;
    vec3 lc1=mix(mix(vec3(.85,.45,.18),vec3(.62,.16,.10),h1), vec3(.9,.75,.25), step(.75,h1));
    vec3 lc2=mix(mix(vec3(.85,.45,.18),vec3(.62,.16,.10),h2), vec3(.9,.75,.25), step(.75,h2));
    col+=(l1*lc1+l2*lc2)*uPh[5]*.9;
  }

  /* --- 仕上げ --- */
  col*=1.-.42*pow(length(uv*vec2(.82,1.05)),2.3);            // ビネット
  col+= (hash21(frag+fract(t)*61.7)-.5)*.032;                 // 粒状感
  col=col/(1.+col*.12);                                        // トーンマップ
  col=pow(max(col,0.), vec3(.96));
  fragColor=vec4(col,1.);
}`;

function compile(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const U={};
["uRes","uTime","uColA","uColB","uColC","uSunH","uSunWarm"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
U.uPh=gl.getUniformLocation(prog,"uPh[0]");

/* ============================================================
   リングキャンバス（2D）
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  glCanvas.width=W*DPR; glCanvas.height=H*DPR;
  ringCanvas.width=W*DPR; ringCanvas.height=H*DPR;
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   状態
============================================================ */
const TAU=Math.PI*2;
let pos=dateToPos(new Date());      // 年周位置（現在描画中）
let targetPos=null;                 // トゥイーン先
const todayPos=dateToPos(new Date());
let autoplay=true;
let lastInteract=-1e9;
const YEAR_SEC=240;                 // 自動再生：一年 240秒
let displayIdx=-1, displayChangeT=0;

/* ============================================================
   入力
============================================================ */
function cx(){ return W/2; } function cy(){ return H/2; }
function angleOf(e){
  const x=(e.clientX??e.touches?.[0]?.clientX)-cx();
  const y=(e.clientY??e.touches?.[0]?.clientY)-cy();
  return Math.atan2(y,x);
}
let dragging=false, dragA=0, dragMoved=0;
ringCanvas.addEventListener("pointerdown",e=>{
  dragging=true; dragMoved=0; dragA=angleOf(e); targetPos=null;
  lastInteract=performance.now(); ringCanvas.classList.add("dragging");
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleOf(e);
  let da=a-dragA;
  if(da>Math.PI) da-=TAU; if(da<-Math.PI) da+=TAU;
  dragA=a; dragMoved+=Math.abs(da);
  pos=(pos-da/TAU%1+2)%1;
  lastInteract=performance.now();
});
ringCanvas.addEventListener("pointerup",e=>{
  dragging=false; ringCanvas.classList.remove("dragging");
  lastInteract=performance.now();
  if(dragMoved<.02){ // クリック：節気へジャンプ
    const x=e.clientX-cx(), y=e.clientY-cy();
    const rr=Math.hypot(x,y), Rout=Math.min(W,H)*.42, Rin=Math.min(W,H)*.24;
    if(rr>Rin&&rr<Rout){
      const screenA=Math.atan2(y,x);
      const local=((screenA+Math.PI/2+pos*TAU)/TAU%1+1)%1;
      const idx=Math.floor(local*24);
      targetPos=(idx+.5)/24;
    }
  }
  hideHint();
});
window.addEventListener("wheel",e=>{
  pos=((pos+e.deltaY*18e-5)%1+1)%1;
  targetPos=null; lastInteract=performance.now(); hideHint();
},{passive:true});
/* ── タッチ: ピンチ = 時をめぐる（ホイールの代わり）/ タップ = 停止（空白の代わり）──
   1本指でまわすのは pointer 系がそのまま拾う（#gl,#ring の touch-action:none が前提）。 */
{
  let pinchPrev=null, tapAt=0, moved=false;
  const target = ringCanvas;
  target.addEventListener("touchstart", e=>{
    document.documentElement.classList.add("is-touch");
    if(e.touches.length===1){ tapAt=performance.now(); moved=false; pinchPrev=null; }
    else if(e.touches.length===2){
      pinchPrev=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                           e.touches[0].clientY-e.touches[1].clientY);
      // tapAt はここで消さない（消すと2本指の判定に使えなくなる）。ピンチは必ず指が動くので moved で区別する
    }
  },{passive:true});
  target.addEventListener("touchmove", e=>{
    if(e.touches.length>=2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                         e.touches[0].clientY-e.touches[1].clientY);
      if(pinchPrev && d>0){
        // 広げると先へ、縮めると戻る（ホイールと同じ感触になるよう係数を合わせた）
        pos=((pos+(d-pinchPrev)*4.5e-4)%1+1)%1;
        targetPos=null; lastInteract=performance.now(); hideHint();
      }
      pinchPrev=d;
    }
    moved=true;
  },{passive:true});
  target.addEventListener("touchend", e=>{
    // 指が全部離れたときだけ確定する（ピンチの片指を離した瞬間に誤発火させない）
    if(e.touches.length===0){
      if(tapAt && !moved && performance.now()-tapAt<300){ autoplay=!autoplay; lastInteract=-1e9; hideHint(); }
      pinchPrev=null; tapAt=0; moved=false;
    }
  },{passive:true});
}

window.addEventListener("keydown",e=>{
  if(e.key===" "){ autoplay=!autoplay; lastInteract=-1e9; e.preventDefault(); }
  if(e.key==="ArrowRight"){ targetPos=((Math.floor(pos*24)+1)%24+.5)/24; lastInteract=performance.now(); }
  if(e.key==="ArrowLeft"){ targetPos=((Math.floor(pos*24)+23)%24+.5)/24; lastInteract=performance.now(); }
  hideHint();
});
document.getElementById("todayBtn").addEventListener("click",()=>{
  targetPos=todayPos; lastInteract=performance.now(); hideHint();
});
let hintHidden=false;
function hideHint(){
  if(hintHidden) return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500);
}
setTimeout(hideHint,14000);

/* ============================================================
   リング描画
============================================================ */
function drawRing(now,curIdx,segT,accent,accentHex){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=Math.min(W,H)*.40;
  const cxp=cx(), cyp=cy();
  const ink=(a)=>`rgba(236,229,216,${a})`;

  ctx.save();
  ctx.translate(cxp,cyp);

  /* --- 回転系（リング本体） --- */
  ctx.save();
  ctx.rotate(-Math.PI/2 - pos*TAU);

  // 外周・内周
  ctx.lineWidth=1;
  ctx.strokeStyle=ink(.5);
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  ctx.strokeStyle=ink(.22);
  ctx.beginPath(); ctx.arc(0,0,R*.985,0,TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R*.66,0,TAU); ctx.stroke();

  // 七十二候の刻み
  for(let i=0;i<72;i++){
    const a=i/72*TAU;
    const major=(i%3===0);
    ctx.strokeStyle=ink(major?.55:.25);
    ctx.lineWidth=major?1.2:.7;
    const r1=major?R*.940:R*.958;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*R*.985,Math.sin(a)*R*.985);
    ctx.stroke();
  }

  // 現在節気のハイライト弧
  {
    const a0=curIdx/24*TAU, a1=(curIdx+1)/24*TAU;
    ctx.strokeStyle=accentHex;
    ctx.globalAlpha=.85;
    ctx.lineWidth=2.4;
    ctx.shadowColor=accentHex; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(0,0,R,a0+.012,a1-.012); ctx.stroke();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    // 節気内の進行
    ctx.strokeStyle=accentHex; ctx.globalAlpha=.5; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,R*1.018,a0+.012,a0+(a1-a0-.024)*segT+.012); ctx.stroke();
    ctx.globalAlpha=1;
  }

  // 節気名（放射方向の縦書き：文字の天が外周を向く和時計様式）
  const fontR=R*.80;
  const nameSize=Math.max(12,R*.062);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let i=0;i<24;i++){
    const a=(i+.5)/24*TAU;
    const cur=(i===curIdx);
    const chars=SEKKI[i].n.split("");
    ctx.save();
    ctx.rotate(a);
    ctx.fillStyle=cur?accentHex:ink(.72);
    if(cur){ ctx.shadowColor=accentHex; ctx.shadowBlur=10; }
    ctx.font=`${cur?600:400} ${nameSize*(cur?1.12:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    for(let c=0;c<chars.length;c++){
      const rr=fontR+nameSize*.72-c*nameSize*1.18;
      ctx.save();
      ctx.translate(rr,0);
      ctx.rotate(Math.PI/2);
      ctx.fillText(chars[c],0,0);
      ctx.restore();
    }
    ctx.restore();
  }

  // 季節の大文字（春夏秋冬）— 同じく放射方向
  ctx.font=`300 ${R*.30}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  ctx.fillStyle=ink(.055);
  for(let s=0;s<4;s++){
    const a=(s*6+3)/24*TAU;
    ctx.save();
    ctx.rotate(a); ctx.translate(R*.44,0); ctx.rotate(Math.PI/2);
    ctx.fillText(SEASON[s],0,0);
    ctx.restore();
  }

  // 今日の印
  {
    const a=todayPos*TAU;
    ctx.save();
    ctx.rotate(a);
    ctx.fillStyle=ink(.9);
    ctx.beginPath(); ctx.arc(R*1.05,0,2.6,0,TAU); ctx.fill();
    ctx.restore();
  }

  ctx.restore(); // 回転系おわり

  /* --- 固定系：頂点マーカー --- */
  ctx.fillStyle=accentHex;
  ctx.shadowColor=accentHex; ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.moveTo(0,-R*1.075-8);
  ctx.lineTo(-5,-R*1.075-18);
  ctx.lineTo(5,-R*1.075-18);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;

  /* --- 中央表示 --- */
  const s=SEKKI[curIdx];
  const fade=Math.min(1,(now-displayChangeT)/450);
  const ease=smooth(fade);
  ctx.globalAlpha=ease;

  const big=R*.30;
  ctx.fillStyle=ink(.96);
  ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=24;
  ctx.font=`500 ${big}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const ls=big*.10;
  ctx.save(); ctx.translate(ls/2,0);
  ctx.fillText(s.n, 0, -R*.115);
  ctx.restore();
  ctx.shadowBlur=0;

  ctx.font=`400 ${R*.052}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  ctx.fillStyle=ink(.60);
  ctx.fillText(s.k, 0, R*.055);

  ctx.font=`400 ${R*.042}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  ctx.fillStyle=ink(.42);
  ctx.fillText(posToDateStr(curIdx), 0, R*.135);

  ctx.font=`400 ${R*.047}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  ctx.fillStyle=ink(.68);
  ctx.fillText(s.desc, 0, R*.225);

  // 七十二候（現在の候）
  const koIdx=Math.min(2,Math.floor(segT*3));
  ctx.font=`400 ${R*.040}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  ctx.fillStyle=`rgba(${Math.round(accent[0]*255)},${Math.round(accent[1]*255)},${Math.round(accent[2]*255)},.85)`;
  ctx.fillText(`${KO_LABEL[koIdx]}　${KO[curIdx][koIdx]}`, 0, R*.315);

  ctx.globalAlpha=1;
  ctx.restore();
}

/* ============================================================
   メインループ
============================================================ */
// 外部から時をめぐるための小さなAPI（検証・演出用）
window.__meguri={ set(p){ pos=((p%1)+1)%1; targetPos=null; lastInteract=performance.now(); }, get(){ return pos; } };

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  // 自動再生（操作後4秒は停止）
  if(autoplay && !dragging && targetPos===null && now-lastInteract>4000){
    pos=(pos+dt/YEAR_SEC)%1;
  }
  // トゥイーン
  if(targetPos!==null){
    let d=targetPos-pos;
    if(d>.5)d-=1; if(d<-.5)d+=1;
    pos=((pos+d*Math.min(1,dt*4.5))%1+1)%1;
    if(Math.abs(d)<.0004){ pos=targetPos; targetPos=null; }
  }

  // 節気の補間
  const x=pos*24;
  const i0=Math.floor(x)%24, i1=(i0+1)%24;
  const segT=x-Math.floor(x);
  const bl=smooth(Math.max(0,(segT-.7)/.3)); // 節気の終盤30%で次へブレンド

  const colA=lerp3(PALS[i0][0],PALS[i1][0],bl);
  const colB=lerp3(PALS[i0][1],PALS[i1][1],bl);
  const colC=lerp3(PALS[i0][2],PALS[i1][2],bl);
  const ph=new Float32Array(6);
  for(let k=0;k<6;k++) ph[k]=lerp(SEKKI[i0].ph[k],SEKKI[i1].ph[k],bl);

  // 太陽高度：夏至(idx9中央)で最高、冬は地平近くへ
  const solPhase=Math.cos(TAU*(pos-(9.5)/24));
  const sunH=-0.34+0.62*(0.5+0.5*solPhase);
  const sunWarm=1-(0.5+0.5*solPhase)*.75;

  if(displayIdx!==i0){ displayIdx=i0; displayChangeT=now; }

  // GL描画
  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uColA,colA[0],colA[1],colA[2]);
  gl.uniform3f(U.uColB,colB[0],colB[1],colB[2]);
  gl.uniform3f(U.uColC,colC[0],colC[1],colC[2]);
  gl.uniform1fv(U.uPh,ph);
  gl.uniform1f(U.uSunH,sunH);
  gl.uniform1f(U.uSunWarm,sunWarm);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // リング
  const accent=PALS[i0][2];
  drawRing(now,i0,segT,accent,SEKKI[i0].pal[2]);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
