<div id="ui">

<script id="vs" type="x-shader/x-vertex">#version 300 es
layout(location = 0) in vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;

out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec2  uCam;          // smoothed view offset from pointer drag
uniform vec4  uRipple[10];   // xy: world pos, z: birth time, w: amplitude
uniform int   uRippleN;

#define PI  3.14159265359
#define TAU 6.28318530718

/* ------------------------------------------------------------------ */
/*  Hash / noise                                                       */
/* ------------------------------------------------------------------ */
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i),               hash12(i + vec2(1, 0)), u.x),
             mix(hash12(i + vec2(0, 1)),  hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 r = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) { v += a * vnoise(p); p = r * p * 2.03 + 11.7; a *= 0.5; }
  return v;
}

/* ------------------------------------------------------------------ */
/*  Water height field — exp(sin) octave waves, analytic gradient      */
/*  (derivative domain-warp: each octave drifts along the gradient)    */
/* ------------------------------------------------------------------ */
vec3 waveOctaves(vec2 p, float t, int octaves, float detailFade) {
  float h = 0.0;
  vec2  grad = vec2(0.0);
  float amp = 0.42, freq = 0.9, speed = 1.7;
  float angle = 0.0;
  float ampSum = 0.0;
  vec2  q = p;
  for (int i = 0; i < 10; i++) {
    if (i >= octaves) break;
    vec2 d = vec2(cos(angle), sin(angle));
    float x = dot(d, q) * freq + t * speed;
    float w = exp(sin(x) - 1.0);          // sharp-crested wave
    float dw = w * cos(x) * freq;         // analytic derivative
    float fade = exp(-float(i) * detailFade);
    h    += w  * amp * fade;
    grad += d * dw * amp * fade;
    ampSum += amp * fade;
    q -= d * dw * amp * 0.22;             // derivative domain warp
    amp *= 0.55; freq *= 1.87; speed *= 1.07; angle += 2.39996; // golden angle
  }
  return vec3(h / ampSum, grad / ampSum);
}

/* Click ripples: damped expanding rings, analytic radial derivative */
vec3 rippleField(vec2 p, float t) {
  float h = 0.0; vec2 grad = vec2(0.0);
  for (int i = 0; i < 10; i++) {
    if (i >= uRippleN) break;
    vec4 rp = uRipple[i];
    float age = t - rp.z;
    if (age < 0.0 || age > 9.0) continue;
    vec2  dp = p - rp.xy;
    float r  = length(dp) + 1e-4;
    float wavefront = age * 2.1;
    float x = (r - wavefront) * 5.5;
    float envelope = exp(-x * x * 0.15) * exp(-age * 0.55) * rp.w;
    float s = sin(x * 2.2);
    h += s * envelope * 0.17;
    float dhdr = (cos(x * 2.2) * 2.2 - s * 0.3 * x) * envelope * 0.17 * 5.5;
    grad += (dp / r) * dhdr;
  }
  return vec3(h, grad);
}

/* full surface: swell + chop + ripples */
vec3 surface(vec2 p, float t, float dist) {
  // fewer detail octaves in the distance (analytic LOD → no aliasing shimmer)
  float lod = clamp(dist * 0.012, 0.0, 1.0);
  int oct = 10 - int(lod * 5.0);
  vec3 w = waveOctaves(p, t, oct, 0.06 + lod * 0.55);
  vec3 r = rippleField(p, t);
  return vec3(w.x * 0.34 + r.x, w.yz * 0.34 + r.yz);
}

/* ------------------------------------------------------------------ */
/*  CIE 1931 colour matching — Wyman/Sloan/Shirley analytic fit        */
/* ------------------------------------------------------------------ */
float gpiece(float x, float mu, float s1, float s2) {
  float t = (x - mu) / (x < mu ? s1 : s2);
  return exp(-0.5 * t * t);
}
vec3 cieXYZ(float l) {
  float x = 1.056 * gpiece(l, 599.8, 37.9, 31.0)
          + 0.362 * gpiece(l, 442.0, 16.0, 26.7)
          - 0.065 * gpiece(l, 501.1, 20.4, 26.2);
  float y = 0.821 * gpiece(l, 568.8, 46.9, 40.5)
          + 0.286 * gpiece(l, 530.9, 16.3, 31.1);
  float z = 1.217 * gpiece(l, 437.0, 11.8, 36.0)
          + 0.681 * gpiece(l, 459.0, 26.0, 13.8);
  return vec3(x, y, z);
}
vec3 xyzToRgb(vec3 c) {
  return vec3( 3.2406 * c.x - 1.5372 * c.y - 0.4986 * c.z,
              -0.9689 * c.x + 1.8758 * c.y + 0.0415 * c.z,
               0.0557 * c.x - 0.2040 * c.y + 1.0570 * c.z);
}

/* ------------------------------------------------------------------ */
/*  Airy thin-film reflectance — spectral, both polarisations          */
/*  air (n1) / film (n2) / water (n3), after Belcour–Barla physics     */
/* ------------------------------------------------------------------ */
vec2 fresnelAmp(float n1, float c1, float n2, float c2) {
  // returns (r_s, r_p) amplitude coefficients
  float rs = (n1 * c1 - n2 * c2) / (n1 * c1 + n2 * c2);
  float rp = (n2 * c1 - n1 * c2) / (n2 * c1 + n1 * c2);
  return vec2(rs, rp);
}
float airyR(float lambda, float d, float c1, float n1, float n2, float n3) {
  float s1 = sqrt(max(0.0, 1.0 - c1 * c1));
  float s2 = n1 / n2 * s1;
  float c2 = sqrt(max(0.0, 1.0 - s2 * s2));
  float s3 = n2 / n3 * s2;
  float c3 = sqrt(max(0.0, 1.0 - s3 * s3));
  vec2 r12 = fresnelAmp(n1, c1, n2, c2);
  vec2 r23 = fresnelAmp(n2, c2, n3, c3);
  float phi = 4.0 * PI * n2 * d * c2 / lambda;
  float cp = cos(phi);
  vec2 num = r12 * r12 + r23 * r23 + 2.0 * r12 * r23 * cp;
  vec2 den = vec2(1.0) + r12 * r12 * r23 * r23 + 2.0 * r12 * r23 * cp;
  vec2 R = num / den;
  return 0.5 * (R.x + R.y);
}

/* integrate 13 wavelengths 400–700 nm → linear sRGB reflectance */
vec3 filmReflectance(float thickness, float cosI, out float avgR) {
  vec3 xyz = vec3(0.0);
  float ynorm = 0.0, rsum = 0.0;
  for (int i = 0; i < 13; i++) {
    float l = 400.0 + 25.0 * float(i);        // nm
    float R = airyR(l, thickness, cosI, 1.0, 1.38, 1.333);
    vec3 cmf = cieXYZ(l);
    xyz   += cmf * R;
    ynorm += cmf.y;
    rsum  += R;
  }
  avgR = rsum / 13.0;
  vec3 rgb = xyzToRgb(xyz / ynorm);
  return max(rgb, 0.0);
}

/* ------------------------------------------------------------------ */
/*  Sky — civil-twilight gradient, sun, soft cirrus                    */
/* ------------------------------------------------------------------ */
const vec3 SUN_DIR = normalize(vec3(0.35, 0.10, 0.93));
const vec3 SUN_COL = vec3(1.00, 0.72, 0.42);

vec3 sky(vec3 rd, float glowScale) {
  float y = max(rd.y, 0.0);
  vec3 zenith  = vec3(0.028, 0.042, 0.125);
  vec3 mid     = vec3(0.18, 0.12, 0.27);
  vec3 horizon = vec3(0.98, 0.47, 0.21);
  vec3 col = mix(mix(horizon, mid, smoothstep(0.0, 0.18, y)),
                 zenith, smoothstep(0.10, 0.65, y));

  float sd = max(dot(rd, SUN_DIR), 0.0);
  col += SUN_COL * pow(sd, 900.0) * 22.0 * glowScale;                 // disc
  col += SUN_COL * pow(sd, 45.0) * 0.55 * glowScale;                  // corona
  col += vec3(1.0, 0.55, 0.30) * pow(sd, 6.0) * 0.30 * glowScale;     // haze
  // horizon warm band strongest toward sun
  col += vec3(0.9, 0.4, 0.18) * exp(-y * 9.0) * (0.25 + 0.75 * sd) * 0.5;

  // sparse high cirrus
  if (rd.y > 0.015) {
    vec2 cp = rd.xz / (rd.y + 0.12) * 1.4;
    float cl = fbm(cp * 1.2 + vec2(uTime * 0.006, 0.0));
    cl = smoothstep(0.52, 0.85, cl) * exp(-rd.y * 2.2);
    col = mix(col, vec3(0.85, 0.62, 0.55), cl * 0.35);
  }
  // faint stars high up
  float st = pow(hash12(floor(rd.xz / max(rd.y, 0.05) * 240.0)), 60.0);
  col += vec3(0.8, 0.85, 1.0) * st * smoothstep(0.25, 0.7, rd.y) * 0.5;
  return col;
}

/* ------------------------------------------------------------------ */
/*  Tonemap / post                                                     */
/* ------------------------------------------------------------------ */
vec3 acesFilm(vec3 x) {
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

/* ------------------------------------------------------------------ */
void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
  float t = uTime;

  /* camera: low over the water, gently breathing, pointer steers */
  vec3 ro = vec3(0.0, 1.55 + 0.05 * sin(t * 0.23), t * 0.55);
  float yaw   = uCam.x * 0.55 + 0.03 * sin(t * 0.11);
  float pitch = -0.16 + uCam.y * 0.22 + 0.012 * sin(t * 0.17);

  vec3 fwd = normalize(vec3(sin(yaw), sin(pitch), cos(yaw) * cos(pitch)));
  vec3 right = normalize(cross(vec3(0, 1, 0), fwd));
  vec3 up = cross(fwd, right);
  vec3 rd = normalize(fwd * 1.35 + uv.x * right + uv.y * up);

  vec3 col;
  if (rd.y >= -0.005) {
    col = sky(rd, 1.0);
  } else {
    /* plane hit + 3-step parallax refinement against the height field */
    float dist = -ro.y / rd.y;
    vec2 wp = ro.xz + rd.xz * dist;
    for (int i = 0; i < 3; i++) {
      float h = surface(wp, t, dist).x;
      dist = (h - ro.y) / rd.y;
      wp = ro.xz + rd.xz * dist;
    }
    vec3 s = surface(wp, t, dist);
    vec3 n = normalize(vec3(-s.y, 1.0, -s.z));

    /* micro-detail normal for glitter (screen-stable, distance-faded) */
    float micro = vnoise(wp * 26.0 + t * 1.2) - 0.5;
    float microFade = exp(-dist * 0.05);
    n = normalize(n + vec3(micro, 0.0, vnoise(wp * 26.0 - t * 1.1) - 0.5) * 0.10 * microFade);

    vec3 v = -rd;
    float cosI = clamp(dot(v, n), 0.02, 1.0);

    /* --- thin-film thickness field (nm): drifting film + wave/ripple coupling */
    vec2 flow = wp * 0.42 + vec2(t * 0.05, -t * 0.032);
    float th = 240.0
             + 640.0 * fbm(flow)
             + 210.0 * fbm(wp * 0.9 - flow.yx * 0.7)
             + 380.0 * s.x                                  // film pools on wave slopes
             + 120.0 * sin(dot(s.yz, vec2(4.0, 3.2)));
    th = clamp(th, 90.0, 1250.0);

    float avgR;
    vec3 filmRGB = filmReflectance(th, cosI, avgR);
    // push interference saturation for a more vivid rainbow sheen
    float flum = dot(filmRGB, vec3(0.299, 0.587, 0.114));
    filmRGB = max(mix(vec3(flum), filmRGB, 1.8), 0.0);

    /* --- reflection */
    vec3 refl = reflect(rd, n);
    refl.y = abs(refl.y) + 0.015;
    vec3 reflCol = sky(refl, 0.6) * filmRGB * 2.2;
    // pure chromatic interference term — rainbow sheen independent of sky tint
    vec3 chroma = filmRGB - vec3(dot(filmRGB, vec3(0.299, 0.587, 0.114)));
    reflCol += chroma * (0.30 + 1.1 * dot(reflCol, vec3(0.333))) * 0.6;

    /* --- transmission into the body of water */
    float trans = clamp(1.0 - avgR, 0.0, 1.0);
    vec3 deepCol    = vec3(0.012, 0.045, 0.075);
    vec3 shallowCol = vec3(0.05, 0.19, 0.22);
    float crest = smoothstep(0.15, 0.75, s.x);
    vec3 waterCol = mix(deepCol, shallowCol, crest);
    // sun shining through wave crests (cheap subsurface)
    float sss = pow(max(dot(rd, SUN_DIR), 0.0), 3.0) * crest;
    waterCol += vec3(0.25, 0.45, 0.35) * sss * 0.8;
    // drifting caustic shimmer just under the surface
    vec2 cuv = wp * 1.7;
    float ca = vnoise(cuv + vec2(t * 0.5, 0.0)) + vnoise(cuv * 1.9 - vec2(0.0, t * 0.6));
    waterCol += vec3(0.04, 0.10, 0.11) * smoothstep(1.15, 1.75, ca) * exp(-dist * 0.10);

    col = waterCol * trans + reflCol;

    /* --- sun glitter: GGX-ish lobe + hard-threshold sparkle, iridescent tint */
    vec3 h = normalize(v + SUN_DIR);
    float ndh = max(dot(n, h), 0.0);
    float spec = pow(ndh, 700.0);
    float sparkleGate = step(0.90, hash12(floor(wp * 62.0) + floor(t * 7.0) * 0.13));
    float glitter = pow(ndh, 180.0) * sparkleGate
                  * smoothstep(2.5, 7.0, dist);   // hide oversized cells near camera
    vec3 glitCol = mix(SUN_COL, normalize(filmRGB + 0.02) * 1.6, 0.5);
    col += glitCol * (spec * 12.0 + glitter * 4.5) * smoothstep(-0.02, 0.10, SUN_DIR.y + 0.1);

    /* --- aerial perspective toward the horizon */
    float fog = 1.0 - exp(-dist * 0.016);
    vec3 fogCol = sky(vec3(rd.x, 0.02, rd.z), 0.5);
    col = mix(col, fogCol, fog * fog);
  }

  /* post: exposure → ACES → subtle grade → vignette → dither */
  col = max(col, 0.0) * 1.15;
  col = acesFilm(col);
  col = pow(col, vec3(1.0 / 2.2));
  col = mix(col, col * col * (3.0 - 2.0 * col), 0.28);          // gentle S-curve
  col *= 1.0 - 0.30 * dot(uv * 0.55, uv * 0.55);                // vignette
  col += (hash12(gl_FragCoord.xy + fract(t) * 61.7) - 0.5) / 255.0; // dither

  fragColor = vec4(col, 1.0);
}
</script>

<script>
(() => {
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
  if (!gl) { document.body.innerHTML = '<p style="color:#ccc;font-family:serif;padding:2em">WebGL2 が利用できません。</p>'; return; }

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  // fullscreen triangle
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  for (const name of ['uRes', 'uTime', 'uCam', 'uRipple', 'uRippleN'])
    U[name] = gl.getUniformLocation(prog, name);

  /* ---- state ---- */
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let camTarget = { x: 0, y: 0 }, cam = { x: 0, y: 0 };
  let dragging = false, lastDrag = null, moved = 0;
  const ripples = [];  // {x, z, t0, amp}
  const rippleData = new Float32Array(40);
  let startTime = performance.now();
  const now = () => (performance.now() - startTime) / 1000;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2) * quality;
    const w = innerWidth || 1280, h = innerHeight || 720;  // hidden panes report 0
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  let quality = 1;
  window.addEventListener('resize', resize);

  /* map a screen point onto the water plane (mirrors shader camera) */
  function screenToWater(px, py, t) {
    const uvx = (2 * px * dpr - canvas.width) / canvas.height;
    const uvy = (canvas.height - 2 * py * dpr) / canvas.height;
    const roY = 1.55 + 0.05 * Math.sin(t * 0.23), roZ = t * 0.55;
    const yaw = cam.x * 0.55 + 0.03 * Math.sin(t * 0.11);
    const pitch = -0.16 + cam.y * 0.22 + 0.012 * Math.sin(t * 0.17);
    const fwd = [Math.sin(yaw), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)];
    const rl = Math.hypot(fwd[2], -fwd[0]);
    const right = [fwd[2] / rl, 0, -fwd[0] / rl];
    const up = [fwd[1] * right[2] - fwd[2] * right[1],
                fwd[2] * right[0] - fwd[0] * right[2],
                fwd[0] * right[1] - fwd[1] * right[0]];
    const rd = [fwd[0] * 1.35 + uvx * right[0] + uvy * up[0],
                fwd[1] * 1.35 + uvx * right[1] + uvy * up[1],
                fwd[2] * 1.35 + uvx * right[2] + uvy * up[2]];
    if (rd[1] >= -0.01) return null;
    const d = -roY / rd[1];
    if (d > 80) return null;
    return [rd[0] * d, roZ + rd[2] * d];
  }
  function addRipple(px, py, amp) {
    const t = now();
    const w = screenToWater(px, py, t);
    if (!w) return;
    ripples.push({ x: w[0], z: w[1], t0: t, amp });
    while (ripples.length > 10) ripples.shift();
  }

  /* ---- input ---- */
  canvas.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; lastDrag = [e.clientX, e.clientY];
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastDrag[0], dy = e.clientY - lastDrag[1];
    moved += Math.abs(dx) + Math.abs(dy);
    camTarget.x = Math.max(-1, Math.min(1, camTarget.x - dx / innerWidth * 2.2));
    camTarget.y = Math.max(-0.7, Math.min(1, camTarget.y + dy / innerHeight * 1.6));
    lastDrag = [e.clientX, e.clientY];
  });
  canvas.addEventListener('pointerup', e => {
    dragging = false;
    if (moved < 6) addRipple(e.clientX, e.clientY, 0.8 + Math.random() * 0.5);
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') document.getElementById('ui').classList.toggle('hidden');
    if (e.key === 'f' || e.key === 'F')
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
  // ── タッチ: 2本指タップ = UI表示切替（指にキーボードは無い）──
  // なぞって視線を動かす・タップで波紋、は pointer 系がそのまま拾う（#gl の touch-action:none が前提）。
  {
    let tapAt=0, moved=false, maxTouches=0;
    canvas.addEventListener('touchstart', e => {
      document.documentElement.classList.add('is-touch');
      maxTouches = Math.max(maxTouches, e.touches.length);
      if (e.touches.length === 1) { tapAt = performance.now(); moved = false; maxTouches = 1; }
    }, { passive: true });
    canvas.addEventListener('touchmove', () => { moved = true; }, { passive: true });
    canvas.addEventListener('touchend', e => {
      // 指が全部離れたときだけ確定する（2本指の片方を離した瞬間に誤発火させない）
      if (e.touches.length === 0) {
        if (tapAt && !moved && maxTouches >= 2 && performance.now() - tapAt < 400) {
          document.getElementById('ui').classList.toggle('hidden');
        }
        tapAt = 0; maxTouches = 0;
      }
    }, { passive: true });
  }

  // auto-fade UI after a while
  setTimeout(() => document.getElementById('ui').classList.add('hidden'), 14000);
  canvas.addEventListener('pointerdown', () => {
    document.getElementById('ui').classList.add('hidden');
  }, { once: true });

  /* occasional ambient raindrop ripples */
  setInterval(() => {
    if (document.hidden || ripples.length > 6) return;
    const t = now();
    ripples.push({
      x: (Math.random() - 0.5) * 14,
      z: t * 0.55 + 4 + Math.random() * 14,
      t0: t, amp: 0.25 + Math.random() * 0.35
    });
    while (ripples.length > 10) ripples.shift();
  }, 3400);

  /* ---- adaptive quality ---- */
  let frameAcc = 0, frameN = 0, lastFrame = performance.now();

  let lastRenderMs = 0;
  function render() {
    if (innerWidth && Math.abs(canvas.width - innerWidth * dpr) > 2) resize();
    const t = now();
    const nowMs = performance.now();
    const dt = nowMs - lastFrame; lastFrame = nowMs; lastRenderMs = nowMs;
    frameAcc += dt; frameN++;
    if (dt > 100) { frameAcc -= dt; frameN--; }   // ignore stalls (hidden tab, etc.)
    if (frameN >= 40) {
      const avg = frameAcc / frameN;
      if (avg > 24 && quality > 0.5) { quality = Math.max(0.5, quality - 0.15); resize(); }
      else if (avg < 12 && quality < 1) { quality = Math.min(1, quality + 0.1); resize(); }
      frameAcc = 0; frameN = 0;
    }

    cam.x += (camTarget.x - cam.x) * 0.04;
    cam.y += (camTarget.y - cam.y) * 0.04;

    // prune dead ripples, pack uniform array
    for (let i = ripples.length - 1; i >= 0; i--)
      if (t - ripples[i].t0 > 9) ripples.splice(i, 1);
    rippleData.fill(0);
    ripples.forEach((r, i) => {
      rippleData[i * 4] = r.x; rippleData[i * 4 + 1] = r.z;
      rippleData[i * 4 + 2] = r.t0; rippleData[i * 4 + 3] = r.amp;
    });

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, t);
    gl.uniform2f(U.uCam, cam.x, cam.y);
    gl.uniform4fv(U.uRipple, rippleData);
    gl.uniform1i(U.uRippleN, ripples.length);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function frame() { requestAnimationFrame(frame); render(); }
  // keep animating (slowly) even when rAF is starved — hidden pane / embedded webview
  setInterval(() => { if (performance.now() - lastRenderMs > 400) render(); }, 400);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
