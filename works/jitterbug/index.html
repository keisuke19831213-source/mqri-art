<!doctype html>
<html lang="ja">

<style>
  html,body{margin:0;height:100%;background:#07080b;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#cfd3d8}

  #stat b{color:#e2b45a;font-weight:500} #stat .big{font-size:20px;letter-spacing:.08em;color:#eef0f2}
  #ctl{position:fixed;right:16px;bottom:16px;display:flex;gap:6px;user-select:none;flex-wrap:wrap;justify-content:flex-end;max-width:54vw}
  #ctl button{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:#c9cdd3;border-radius:999px;padding:6px 10px;font-size:11px;letter-spacing:.16em;cursor:pointer;backdrop-filter:blur(6px);font-family:inherit}

</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">ジターバグ<span>Jitterbug — ベクトル平衡（立方八面体）は、八枚の三角形が回りながら縮むだけで、正二十面体を通って正八面体に閉じる</span></div>
  <div id="hint">ドラッグ＝視点　Shift＋ドラッグ／二本指の横＝たたむ・ひらく　ホイール／ピンチ＝寄る<br>1 平衡　2 二十面体　3 八面体　F＝面を張る　C＝彩　Space＝自動</div>
</div>
<div id="stat"></div>
<div id="ctl"><button data-s="0">平衡</button><button data-s="1">二十面体</button><button data-s="2">八面体</button><button data-k="face" class="on">面</button><button data-k="pal">彩</button><button data-k="auto" class="on">自動</button></div>

<script>
'use strict';
// ============================================================
//  ジターバグ — Jitterbug  (2026-09-05 / ccf5 art)
//  立方八面体（ベクトル平衡：中心から頂点までの距離＝辺の長さ）の八枚の正三角形を、
//  それぞれの法線（立方体の体対角線）まわりに θ だけ回し（隣り合う三角形は逆向き）、中心へ h(θ) だけ寄せる。
//  三角形は剛体のまま、共有頂点が一致し続けるように h を解く（1自由度の機構＝Fuller の jitterbug）。
//  θ=0 立方八面体 → θ≈… 正二十面体（12頂点が等距離・非辺の最近接＝辺）→ θ=60° 正八面体（頂点が二つずつ重なる）
//  → さらに折ると三角形同士が通り抜けて正四面体。各段階は頂点距離の実測で判定する。
// ============================================================
const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) && isFinite(parseFloat(Q.get(k)))) ? parseFloat(Q.get(k)) : d;
const PHI = (1 + Math.sqrt(5))/2;
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]], add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]], mul = (a, s) => [a[0]*s, a[1]*s, a[2]*s], dot = (a, b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]], norm = a => { const l = Math.hypot(...a); return mul(a, 1/l); }, len = a => Math.hypot(...a);
function rotAxis(v, n, th){ const c = Math.cos(th), s = Math.sin(th); return add(add(mul(v, c), mul(cross(n, v), s)), mul(n, dot(n, v)*(1 - c))); }
// 八枚の三角形：法線 n = (±1,±1,±1)/√3、頂点 = n の成分のうち二つが ±1 で一つが 0（符号は n に従う）
const TRIS = []; const H0 = 2/Math.sqrt(3);
for (const sx of [1, -1]) for (const sy of [1, -1]) for (const sz of [1, -1]){ const n = norm([sx, sy, sz]); const v = [[sx, sy, 0], [sx, 0, sz], [0, sy, sz]];
  // 反時計回りに並べる（n から見て）
  const c = mul(n, H0); const a = sub(v[0], c), b = sub(v[1], c); if (dot(cross(a, b), n) < 0) [v[1], v[2]] = [v[2], v[1]];
  TRIS.push({ n, sgn: sx*sy*sz, off: v.map(p => sub(p, c)), v0: v }); }
// 12 頂点は各々ちょうど二枚の三角形に共有される。共有ペアの表
const key = p => p.map(x => Math.round(x*1000)).join(',');
const SHARE = new Map(); TRIS.forEach((t, ti) => t.v0.forEach((p, k) => { const kk = key(p); if (!SHARE.has(kk)) SHARE.set(kk, []); SHARE.get(kk).push([ti, k]); }));
const PAIRS = [...SHARE.values()];   // 12 個、各 [[ti,k],[tj,l]]
function solveH(th){ // 共有頂点が一致する h：|D(h)|² は h の二次式 → 最小点。全ペアで同じ h になる（機構）
  let num_ = 0, den = 0, res = 0;
  for (const [[ti, k], [tj, l]] of PAIRS){ const a = TRIS[ti], b = TRIS[tj];
    const ra = rotAxis(a.off[k], a.n, a.sgn*th), rb = rotAxis(b.off[l], b.n, b.sgn*th); const dn = sub(a.n, b.n), w = sub(ra, rb);
    num_ += -dot(dn, w); den += dot(dn, dn); }
  const h = num_/den;
  for (const [[ti, k], [tj, l]] of PAIRS){ const a = TRIS[ti], b = TRIS[tj]; const pa = add(mul(a.n, h), rotAxis(a.off[k], a.n, a.sgn*th)), pb = add(mul(b.n, h), rotAxis(b.off[l], b.n, b.sgn*th)); res = Math.max(res, len(sub(pa, pb))); }
  return { h, res };
}
function vertices(th){ const { h, res } = solveH(th); const V = TRIS.map(t => t.off.map(o => add(mul(t.n, h), rotAxis(o, t.n, t.sgn*th)))); return { V, h, res }; }
// 判定：12頂点（共有で重複）の中心距離 r、辺 e=√2、非辺の最近接 m
function measure(V){ const pts = []; for (const tri of V) for (const p of tri) pts.push(p); const uniq = []; for (const p of pts){ if (!uniq.some(q => len(sub(p, q)) < 1e-6)) uniq.push(p); }
  const r = uniq.map(len); const rmin = Math.min(...r), rmax = Math.max(...r); let m = 1e9; let d5 = 0;
  for (let i = 0; i < uniq.length; i++){ const ds = []; for (let j = 0; j < uniq.length; j++){ if (i === j) continue; const d = len(sub(uniq[i], uniq[j])); if (d > 1e-6){ ds.push(d); if (d < m) m = d; } } ds.sort((a, b) => a - b); d5 += ds.length >= 5 ? ds[4] : 1e9; }
  d5 /= uniq.length;   // 各頂点の5番目に近い頂点までの距離（二十面体なら＝辺）
  return { n: uniq.length, rmin, rmax, m, d5, uniq }; }
// 二十面体の角度：12頂点が等距離かつ最近接＝辺（√2）になる θ を走査で求める
let TH_ICO = 0; { let best = 1e9; for (let i = 0; i <= 6000; i++){ const th = i/6000*Math.PI/3; const { V } = vertices(th); const M = measure(V); const dev = Math.abs(M.d5 - Math.SQRT2) + (M.rmax - M.rmin); if (dev < best){ best = dev; TH_ICO = th; } } }
const TH_OCT = Math.PI/3;
const TH_MAX = Math.PI/3;   // 八面体で機構は閉じる（これ以上は三角形が互いに貫く）
const STAGES = [{ th: 0, name: 'ベクトル平衡（立方八面体）', en: 'VECTOR EQUILIBRIUM · CUBOCTAHEDRON' }, { th: TH_ICO, name: '正二十面体', en: 'ICOSAHEDRON' }, { th: TH_OCT, name: '正八面体（頂点が二つずつ重なる）', en: 'OCTAHEDRON' }];

// ============================================================
//  GLSL（辺＝板ポリのカプセル、面＝半透明、珠）
// ============================================================
const VS_EDGE = `#version 300 es
precision highp float;
layout(location=0) in vec3 aA; layout(location=1) in vec3 aB; layout(location=2) in vec3 aCol;
uniform vec3 uCamPos; uniform mat3 uCamInv; uniform float uTanHalf; uniform vec2 uRes; uniform float uWidth, uFar;
out vec3 vCol; out float vV; out float vDepth;
void main(){ int id = gl_VertexID; vec2 q = vec2(float(id & 1), float((id >> 1) & 1)); vec3 P = mix(aA, aB, q.x);
  vec3 view = normalize(P - uCamPos); vec3 axis = normalize(aB - aA); vec3 side = normalize(cross(view, axis)); vec3 W = P + side*uWidth*(q.y*2.0 - 1.0);
  vec3 c = uCamInv*(W - uCamPos); float z = max(c.z, 1e-3); gl_Position = vec4(c.x/(z*uTanHalf)*(uRes.y/uRes.x), c.y/(z*uTanHalf), 0.0, 1.0); vCol = aCol; vV = q.y*2.0 - 1.0; vDepth = z/uFar; }`;
const FS_EDGE = `#version 300 es
precision highp float; in vec3 vCol; in float vV; in float vDepth; uniform float uGlow; out vec4 o;
void main(){ float r = abs(vV); float body = sqrt(max(0.0, 1.0 - r*r)); vec3 col = vCol*(0.5 + 0.8*body) + vec3(0.6)*pow(body, 8.0)*0.5; float aa = smoothstep(1.0, 0.75, r); o = vec4(col*uGlow*aa, aa); gl_FragDepth = clamp(vDepth, 0.0, 0.9999); }`;
const VS_TRI = `#version 300 es
precision highp float; layout(location=0) in vec3 aP; layout(location=1) in vec3 aN; layout(location=2) in vec3 aCol;
uniform vec3 uCamPos; uniform mat3 uCamInv; uniform float uTanHalf; uniform vec2 uRes; uniform float uFar; out vec3 vCol; out vec3 vN; out vec3 vP; out float vDepth;
void main(){ vec3 c = uCamInv*(aP - uCamPos); float z = max(c.z, 1e-3); gl_Position = vec4(c.x/(z*uTanHalf)*(uRes.y/uRes.x), c.y/(z*uTanHalf), 0.0, 1.0); vCol = aCol; vN = aN; vP = aP; vDepth = z/uFar; }`;
const FS_TRI = `#version 300 es
precision highp float; in vec3 vCol; in vec3 vN; in vec3 vP; in float vDepth; uniform vec3 uCamPos; uniform float uFaceA; out vec4 o;
void main(){ vec3 V = normalize(uCamPos - vP); vec3 n = normalize(vN); float fr = pow(1.0 - abs(dot(n, V)), 2.0); vec3 L = normalize(vec3(-0.4, 0.7, 0.6)); float d = 0.35 + 0.65*abs(dot(n, L));
  vec3 col = vCol*d*(0.35 + 0.65*fr) + vec3(0.9, 0.95, 1.0)*fr*0.25; o = vec4(col*uFaceA, uFaceA*(0.35 + 0.5*fr)); gl_FragDepth = clamp(vDepth + 0.0004, 0.0, 0.9999); }`;
const VS_DOT = `#version 300 es
precision highp float; layout(location=0) in vec3 aP; layout(location=1) in vec3 aCol;
uniform vec3 uCamPos; uniform mat3 uCamInv; uniform float uTanHalf; uniform vec2 uRes; uniform float uRad, uFar; out vec3 vCol; out vec2 vQ; out float vDepth;
void main(){ int id = gl_VertexID; vec2 q = vec2(float(id & 1), float((id >> 1) & 1))*2.0 - 1.0; vec3 c = uCamInv*(aP - uCamPos); float z = max(c.z, 1e-3);
  vec2 ndc = vec2(c.x/(z*uTanHalf)*(uRes.y/uRes.x), c.y/(z*uTanHalf)); vec2 sz = vec2(uRad/(z*uTanHalf)*(uRes.y/uRes.x), uRad/(z*uTanHalf)); gl_Position = vec4(ndc + q*sz, 0.0, 1.0); vCol = aCol; vQ = q; vDepth = z/uFar; }`;
const FS_DOT = `#version 300 es
precision highp float; in vec3 vCol; in vec2 vQ; in float vDepth; uniform float uGlow; out vec4 o;
void main(){ float r = length(vQ); if (r > 1.0) discard; float body = sqrt(1.0 - r*r); vec3 n = vec3(vQ, body); float spec = pow(max(dot(n, normalize(vec3(-0.5, 0.6, 0.8))), 0.0), 14.0);
  vec3 col = vCol*(0.5 + 0.6*body) + vec3(1.0)*spec*0.6; float aa = smoothstep(1.0, 0.85, r); o = vec4(col*uGlow*aa, aa); gl_FragDepth = clamp(vDepth - 0.0003, 0.0, 0.9999); }`;
const VS_QUAD = `#version 300 es
void main(){ vec2 v = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(v*2.0-1.0, 0.0, 1.0); }`;
const FS_BG = `#version 300 es
precision highp float; uniform vec2 uRes; uniform vec3 uBg; out vec4 o; void main(){ vec2 uv = gl_FragCoord.xy/uRes*2.0 - 1.0; o = vec4(uBg*(1.0 - 0.35*dot(uv, uv)), 1.0); gl_FragDepth = 0.9999; }`;
const FS_DOWN = `#version 300 es
precision highp float; uniform sampler2D uS; uniform vec2 uDst; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy/uDst; vec2 px = 1.0/uDst; vec3 c = texture(uS, uv + px*vec2(-0.5,-0.5)).rgb + texture(uS, uv + px*vec2(0.5,-0.5)).rgb + texture(uS, uv + px*vec2(-0.5,0.5)).rgb + texture(uS, uv + px*vec2(0.5,0.5)).rgb; o = vec4(c*0.25, 1.0); }`;
const FS_POST = `#version 300 es
precision highp float; uniform sampler2D uAcc, uB1, uB2, uB3, uB4; uniform vec2 uRes; uniform float uBloom, uFade; out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){ vec2 uv = gl_FragCoord.xy/uRes; vec3 c = texture(uAcc, uv).rgb + (texture(uB1, uv).rgb*0.35 + texture(uB2, uv).rgb*0.28 + texture(uB3, uv).rgb*0.22 + texture(uB4, uv).rgb*0.15)*uBloom;
  c = pow(aces(c)*uFade, vec3(1.0/2.2)); float dth = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453); o = vec4(c + (dth-0.5)/255.0, 1.0); }`;

// ============================================================
//  WebGL
// ============================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) throw new Error('WebGL2 が必要です');
if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('EXT_color_buffer_float が必要です');
function compile(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(vs, fs){ const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++){ const info = gl.getActiveUniform(p, i); u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); } return { p, u }; }
const P_EDGE = program(VS_EDGE, FS_EDGE), P_TRI = program(VS_TRI, FS_TRI), P_DOT = program(VS_DOT, FS_DOT), P_BG = program(VS_QUAD, FS_BG), P_DOWN = program(VS_QUAD, FS_DOWN), P_POST = program(VS_QUAD, FS_POST);
const vaoQuad = gl.createVertexArray();
const edgeBuf = gl.createBuffer(), triBuf = gl.createBuffer(), dotBuf = gl.createBuffer();
const vaoEdge = gl.createVertexArray(); gl.bindVertexArray(vaoEdge); gl.bindBuffer(gl.ARRAY_BUFFER, edgeBuf); [[0,3,0],[1,3,12],[2,3,24]].forEach(([l, s, o]) => { gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, s, gl.FLOAT, false, 36, o); gl.vertexAttribDivisor(l, 1); });
const vaoTri = gl.createVertexArray(); gl.bindVertexArray(vaoTri); gl.bindBuffer(gl.ARRAY_BUFFER, triBuf); [[0,3,0],[1,3,12],[2,3,24]].forEach(([l, s, o]) => { gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, s, gl.FLOAT, false, 36, o); });
const vaoDot = gl.createVertexArray(); gl.bindVertexArray(vaoDot); gl.bindBuffer(gl.ARRAY_BUFFER, dotBuf); [[0,3,0],[1,3,12]].forEach(([l, s, o]) => { gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, s, gl.FLOAT, false, 24, o); gl.vertexAttribDivisor(l, 1); });
gl.bindVertexArray(null);
function makeTex(w, h, internal, filter){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texStorage2D(gl.TEXTURE_2D, 1, internal, w, h); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
let W = 0, H = 0, scene = null, bloom = null, depthRB = null;
function alloc(){ const dpr = Math.min(window.devicePixelRatio || 1, 2); const cw = Math.max(64, Math.round(canvas.clientWidth || window.innerWidth || 640)), ch = Math.max(64, Math.round(canvas.clientHeight || window.innerHeight || 480));
  let s = dpr; if (cw*ch*s*s > 3.0e6) s = Math.sqrt(3.0e6/(cw*ch)); const w = Math.round(cw*s), h = Math.round(ch*s); if (w === W && h === H) return false; W = w; H = h; canvas.width = W; canvas.height = H;
  if (scene){ gl.deleteTexture(scene.t); gl.deleteFramebuffer(scene.f); gl.deleteRenderbuffer(depthRB); bloom.forEach(b => { gl.deleteTexture(b.t); gl.deleteFramebuffer(b.f); }); }
  const t = makeTex(W, H, gl.RGBA16F, gl.LINEAR); const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  depthRB = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, depthRB); gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, W, H); gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depthRB); scene = { t, f };
  bloom = []; let bw = W, bh = H; for (let i = 0; i < 4; i++){ bw = Math.max(1, bw >> 1); bh = Math.max(1, bh >> 1); const tt = makeTex(bw, bh, gl.RGBA16F, gl.LINEAR); const ff = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, ff); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tt, 0); bloom.push({ t: tt, f: ff, w: bw, h: bh }); }
  return true; }

// ============================================================
//  彩・状態
// ============================================================
const PALETTES = [ { name: '夜', bg: [0.03, 0.035, 0.05], tri: [[1.0, 0.80, 0.45], [0.55, 0.78, 1.0]], edge: [0.95, 0.9, 0.8], dot: [1.0, 0.92, 0.7] }, { name: '藍', bg: [0.03, 0.05, 0.10], tri: [[0.9, 0.95, 1.0], [0.6, 0.85, 0.95]], edge: [0.85, 0.92, 1.0], dot: [1.0, 1.0, 1.0] }, { name: '朱', bg: [0.06, 0.03, 0.03], tri: [[1.0, 0.45, 0.3], [1.0, 0.75, 0.45]], edge: [1.0, 0.8, 0.6], dot: [1.0, 0.9, 0.7] } ];
const state = { t: num('warm', 0), th: num('th', 0)*Math.PI/180, thT: num('th', 0)*Math.PI/180, yaw: num('yaw', 0.7), pitch: num('pitch', 0.5), zoom: num('zoom', 1), auto: !Q.has('still'), dragging: false, face: Q.get('face') === '0' ? 0 : 1, pal: Math.round(num('pal', 0)) % PALETTES.length, stage: -1, hold: 0 };
const statEl = document.getElementById('stat');
function ease(x){ x = Math.max(0, Math.min(1, x)); return x*x*(3 - 2*x); }
function camera(){ const aspect = W/H; const fov = 28*Math.PI/180; const tanHalf = Math.tan(fov/2); const fit = 1.7/(0.8*tanHalf); const dist = (aspect < 1 ? fit/aspect : fit)/state.zoom;
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch); const pos = [dist*cp*Math.cos(state.yaw), dist*cp*Math.sin(state.yaw), dist*sp];
  let f = pos.map(v => -v); const fl = Math.hypot(...f); f = f.map(v => v/fl); const r = [-Math.sin(state.yaw), Math.cos(state.yaw), 0]; const up = [r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  return { pos, inv: new Float32Array([r[0], up[0], f[0], r[1], up[1], f[1], r[2], up[2], f[2]]), tanHalf, dist }; }
// 自動：平衡→二十面→八面→四面→戻る を、各段で少し止まりながら往復
const TOUR = [0, TH_ICO, TH_OCT, TH_ICO];
function render(dt){
  const pal = PALETTES[state.pal];
  if (state.auto && !state.dragging){ state.yaw += dt*0.12; const seg = 7.0; const u = (state.t/seg) % TOUR.length; const i = Math.floor(u), f = u - i; const a = TOUR[i], b = TOUR[(i + 1) % TOUR.length]; const e = f < 0.35 ? 0 : ease((f - 0.35)/0.65); state.thT = a + (b - a)*e; }
  state.th += (state.thT - state.th)*Math.min(1, dt*5);
  const { V, h, res } = vertices(state.th); const M = measure(V);
  const cam = camera(); const FAR = cam.dist*2 + 10;
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.f); gl.viewport(0, 0, W, H); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true); gl.disable(gl.BLEND); gl.clearColor(0, 0, 0, 1); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(P_BG.p); gl.bindVertexArray(vaoQuad); gl.uniform2f(P_BG.u.uRes, W, H); gl.uniform3fv(P_BG.u.uBg, pal.bg); gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 面（半透明・両面）
  const tri = []; V.forEach((tv, i) => { const c = TRIS[i].sgn > 0 ? pal.tri[0] : pal.tri[1]; const n = norm(cross(sub(tv[1], tv[0]), sub(tv[2], tv[0]))); for (const p of tv) tri.push(...p, ...n, ...c); });
  if (state.face){ gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false); gl.useProgram(P_TRI.p); const u = P_TRI.u; gl.uniform3fv(u.uCamPos, cam.pos); gl.uniformMatrix3fv(u.uCamInv, false, cam.inv); gl.uniform1f(u.uTanHalf, cam.tanHalf); gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uFar, FAR); gl.uniform1f(u.uFaceA, 0.55);
    gl.bindVertexArray(vaoTri); gl.bindBuffer(gl.ARRAY_BUFFER, triBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tri), gl.DYNAMIC_DRAW); gl.drawArrays(gl.TRIANGLES, 0, 24); gl.depthMask(true); }
  // 辺（加算）と珠
  const edges = [], dots = []; V.forEach((tv, i) => { const c = pal.edge; for (let k = 0; k < 3; k++){ edges.push(...tv[k], ...tv[(k + 1) % 3], ...c); } });
  for (const p of M.uniq) dots.push(...p, ...pal.dot);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false);
  gl.useProgram(P_EDGE.p); { const u = P_EDGE.u; gl.uniform3fv(u.uCamPos, cam.pos); gl.uniformMatrix3fv(u.uCamInv, false, cam.inv); gl.uniform1f(u.uTanHalf, cam.tanHalf); gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uWidth, 0.014); gl.uniform1f(u.uFar, FAR); gl.uniform1f(u.uGlow, 1.0);
    gl.bindVertexArray(vaoEdge); gl.bindBuffer(gl.ARRAY_BUFFER, edgeBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(edges), gl.DYNAMIC_DRAW); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 24); }
  gl.useProgram(P_DOT.p); { const u = P_DOT.u; gl.uniform3fv(u.uCamPos, cam.pos); gl.uniformMatrix3fv(u.uCamInv, false, cam.inv); gl.uniform1f(u.uTanHalf, cam.tanHalf); gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uRad, 0.05); gl.uniform1f(u.uFar, FAR); gl.uniform1f(u.uGlow, 1.0);
    gl.bindVertexArray(vaoDot); gl.bindBuffer(gl.ARRAY_BUFFER, dotBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(dots), gl.DYNAMIC_DRAW); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, M.uniq.length); }
  gl.disable(gl.BLEND); gl.depthMask(true); gl.disable(gl.DEPTH_TEST); gl.bindVertexArray(vaoQuad);
  gl.useProgram(P_DOWN.p); gl.uniform1i(P_DOWN.u.uS, 0); gl.activeTexture(gl.TEXTURE0); let src = scene.t;
  for (const b of bloom){ gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.viewport(0, 0, b.w, b.h); gl.bindTexture(gl.TEXTURE_2D, src); gl.uniform2f(P_DOWN.u.uDst, b.w, b.h); gl.drawArrays(gl.TRIANGLES, 0, 3); src = b.t; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(P_POST.p); gl.uniform2f(P_POST.u.uRes, W, H); gl.uniform1f(P_POST.u.uBloom, 0.45); gl.uniform1f(P_POST.u.uFade, ease((state.t - 0.2)/1.5));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.t); gl.uniform1i(P_POST.u.uAcc, 0); for (let i = 0; i < 4; i++){ gl.activeTexture(gl.TEXTURE1 + i); gl.bindTexture(gl.TEXTURE_2D, bloom[i].t); gl.uniform1i(P_POST.u['uB' + (i+1)], 1 + i); } gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 判定と表示
  const deg = state.th*180/Math.PI; const rr = (M.rmin + M.rmax)/2; const edgeLen = Math.SQRT2;
  let stage = ''; if (Math.abs(state.th) < 0.01) stage = 'ベクトル平衡：中心〜頂点 ＝ 辺'; else if (Math.abs(state.th - TH_ICO) < 0.01) stage = '正二十面体：12頂点が等距離・どの頂点も 5 つの隣が辺の長さ'; else if (Math.abs(state.th - TH_OCT) < 0.01) stage = '正八面体：頂点が二つずつ重なり 6 点';
  statEl.innerHTML = `θ ＝ <span class="big">${deg.toFixed(2)}°</span>　h ＝ ${h.toFixed(4)}<br>頂点 <b>${M.n}</b>　中心〜頂点 ${rr.toFixed(4)}（辺 ${edgeLen.toFixed(4)}・比 <b>${(rr/edgeLen).toFixed(4)}</b>）　最近接 ${M.m.toFixed(4)}<br>共有頂点のずれ <b>${res.toExponential(1)}</b>（機構の検算）${stage ? '<br><b>' + stage + '</b>' : ''}<br>5番目に近い頂点まで ${M.d5.toFixed(4)}　二十面体 θ＝${(TH_ICO*180/Math.PI).toFixed(3)}°（比 ${Math.sin(72*Math.PI/180).toFixed(4)}＝sin72°）　八面体 60°`;
}

// ============================================================
//  入力
// ============================================================
const ptrs = new Map(); let lastPinch = 0, uiTimer = 0; const ui = document.getElementById('ui');
function wake(){ ui.classList.remove('fade'); clearTimeout(uiTimer); uiTimer = setTimeout(() => ui.classList.add('fade'), 7000); } wake();
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); state.dragging = true; wake(); if (ptrs.size === 2){ const a = [...ptrs.values()]; lastPinch = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); } });
canvas.addEventListener('pointermove', e => { const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1){ if (e.shiftKey){ state.auto = false; setBtn('auto', false); state.thT = Math.max(0, Math.min(TH_MAX, state.thT + dx*0.004)); } else { state.yaw -= dx*0.006; state.pitch = Math.max(-1.5, Math.min(1.5, state.pitch + dy*0.006)); } }
  else if (ptrs.size === 2){ const a = [...ptrs.values()]; const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); if (lastPinch > 0) state.zoom = Math.max(0.5, Math.min(5, state.zoom*(d/lastPinch))); lastPinch = d; state.auto = false; setBtn('auto', false); state.thT = Math.max(0, Math.min(TH_MAX, state.thT + dx*0.003)); } });
function endPtr(e){ ptrs.delete(e.pointerId); lastPinch = 0; if (ptrs.size === 0) state.dragging = false; }
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); state.zoom = Math.max(0.5, Math.min(5, state.zoom*Math.exp(-e.deltaY*0.0015))); wake(); }, { passive: false });
function setBtn(k, on){ const b = document.querySelector(`#ctl button[data-k="${k}"]`); if (b) b.classList.toggle('on', !!on); }
function goStage(i){ state.auto = false; setBtn('auto', false); state.thT = STAGES[i].th; }
document.querySelectorAll('#ctl button').forEach(b => b.addEventListener('click', () => { wake(); if (b.dataset.s !== undefined) goStage(parseInt(b.dataset.s));
  if (b.dataset.k === 'face'){ state.face = 1 - state.face; setBtn('face', state.face === 1); } if (b.dataset.k === 'pal') state.pal = (state.pal + 1) % PALETTES.length; if (b.dataset.k === 'auto'){ state.auto = !state.auto; setBtn('auto', state.auto); } }));
window.addEventListener('keydown', e => { wake(); if (e.code === 'Space'){ e.preventDefault(); state.auto = !state.auto; setBtn('auto', state.auto); }
  if (e.key >= '1' && e.key <= '3') goStage(parseInt(e.key) - 1); if (e.key === 'f' || e.key === 'F'){ state.face = 1 - state.face; setBtn('face', state.face === 1); } if (e.key === 'c' || e.key === 'C') state.pal = (state.pal + 1) % PALETTES.length; });
new ResizeObserver(() => alloc()).observe(canvas); setBtn('face', state.face === 1);

// ============================================================
//  ループ
// ============================================================
alloc();
let last = performance.now();
if (Q.has('warm')){ for (let i = 0; i < 60; i++){ render(1/60); } }
function loop(now){ let dt = (now - last)/1000; last = now; if (dt > 0.08) dt = 0.08; state.t += dt; alloc(); render(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
