function sunColor(el){ // 簡易大気：低い太陽ほど暖かい
  const s = Math.max(Math.sin(el), 0.05); const beta = [0.05, 0.09, 0.18];
  return [1.0*Math.exp(-beta[0]/s), 0.94*Math.exp(-beta[1]/s), 0.86*Math.exp(-beta[2]/s)];
}

// ============================================================
//  描画
// ============================================================
const ZENITH = [0.040, 0.058, 0.095], HORIZON = [0.095, 0.10, 0.115];   // 暗い室内の天窓（藍）
const AMB = [0.046, 0.053, 0.068];
const sunRad = 1.0/(2*Math.PI*(1 - Math.cos(CFG.sunAng)));

function camera(){
  const aspect = W/H; const fov = 26*Math.PI/180; const tanHalf = Math.tan(fov/2);
  const fit = 3.62/(0.80*tanHalf); const dist = (aspect < 1 ? fit/aspect : fit)/state.zoom;
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const pos = [dist*cp*Math.cos(state.yaw), dist*cp*Math.sin(state.yaw), dist*sp + CFG.T*0.5];
  const tgt = [0, 0, CFG.T*0.5];
  let f = [tgt[0]-pos[0], tgt[1]-pos[1], tgt[2]-pos[2]]; const fl = Math.hypot(...f); f = f.map(v => v/fl);
  let r = [f[1], -f[0], 0]; const rl = Math.hypot(...r); r = r.map(v => v/rl);
  const up = [r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  return { pos, basis: new Float32Array([r[0], r[1], r[2], up[0], up[1], up[2], f[0], f[1], f[2]]), tanHalf };
}

function render(dt){
  state.frame++;
  const t = state.t;
  // 太陽
  let el, az;
  if (state.sunAuto){ [el, az] = sunPath(t);
    if (state.resumeAt >= 0){ const k = Math.min(1, (t - state.resumeAt)/3); const e = k*k*(3-2*k); el = state.manualEl + (el - state.manualEl)*e; az = state.manualAz + (az - state.manualAz)*e; if (k >= 1) state.resumeAt = -1; }
    state.sunEl = el; state.sunAz = az; }
  else { el = state.sunEl; az = state.sunAz; }
  const sun = [Math.cos(el)*Math.cos(az), Math.cos(el)*Math.sin(az), Math.sin(el)];
  const sunCol = sunColor(el); const Eh = Math.max(Math.sin(el), 0);
  const drawChanged = updateSweep(t); updateElementUniforms();
  const sunMoving = state.sunAuto && !state.paused;

  // ---- 1) フォトン → mapFrame ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, mapFrame.f); gl.viewport(0, 0, MR, MR);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(P_PHOTON.p); setCommon(P_PHOTON, sun, sunCol, Eh);
  const u = P_PHOTON.u;
  gl.uniform1i(u.uNa, CFG.photons); gl.uniform1i(u.uNb, CFG.photonsB); gl.uniform1fv(u.uCum, cumData); gl.uniform1f(u.uLtot, Ltot);
  const zen = Math.max(1e-3, Math.PI/2 - el);
  gl.uniform1f(u.uAnnR0, CFG.Rd - CFG.Re - 0.01); gl.uniform1f(u.uAnnR1, CFG.Rd + CFG.T*Math.tan(Math.min(zen, 1.45)) + 0.03);
  gl.uniform1f(u.uTexel, 2*CFG.L/MR); gl.uniform1i(u.uMask, Math.round(num('mask', 0)));
  gl.drawArrays(gl.POINTS, 0, 2*(CFG.photons + CFG.photonsB));
  gl.disable(gl.BLEND);
  // ---- 2) map EMA ----
  const mapK = drawChanged ? 24 : (sunMoving ? 40 : 900);
  if (state.sunJumped){ mapN = 0; state.sunJumped = false; }
  const mAlpha = 1/Math.min(mapN + 1, mapK); mapN++;
  const mNext = 1 - mapCur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, mapAcc[mNext].f); gl.viewport(0, 0, MR, MR);
  gl.useProgram(P_MIX.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, mapAcc[mapCur].t); gl.uniform1i(P_MIX.u.uA, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, mapFrame.t); gl.uniform1i(P_MIX.u.uB, 1); gl.uniform1f(P_MIX.u.uAlpha, mAlpha);
  gl.drawArrays(gl.TRIANGLES, 0, 3); mapCur = mNext;
  if (Q.get('probe') === '1' && (state.frame % 30) === 0){ const N = 96; const buf = new Float32Array(N*N*4); gl.readPixels((MR>>1) - (N>>1), (MR>>1) - (N>>1), N, N, gl.RGBA, gl.FLOAT, buf); let pos = 0, negv = 0, mx = -1e9, mn = 1e9, cntP = 0, cntN = 0; for (let i = 0; i < N*N; i++){ const g = buf[i*4+1]; if (g > 0){ pos += g; cntP++; } else if (g < 0){ negv += g; cntN++; } mx = Math.max(mx, g); mn = Math.min(mn, g); } const el = document.getElementById('ref'); el.classList.add('on'); el.textContent = `dt=${dtEma.toFixed(1)}ms scale=${scale.toFixed(2)} ph=${CFG.photons} probe center ${N}x${N}: sum+=${pos.toFixed(2)} (${cntP}) sum-=${negv.toFixed(2)} (${cntN}) max=${mx.toFixed(3)} min=${mn.toFixed(3)} err=${gl.getError()}`; }

  // ---- 3) カメラ → acc ----
  if (state.moved){ accN = 0; state.moved = false; }
  const accK = drawChanged ? 12 : (sunMoving ? 32 : 1200);
  const aAlpha = 1/Math.min(accN + 1, accK); accN++;
  const cam = camera(); const aNext = 1 - accCur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, acc[aNext].f); gl.viewport(0, 0, W, H);
  gl.useProgram(P_MAIN.p); setCommon(P_MAIN, sun, sunCol, Eh);
  const m = P_MAIN.u;
  gl.uniform2f(m.uRes, W, H); gl.uniform3fv(m.uCamPos, cam.pos); gl.uniformMatrix3fv(m.uCam, false, cam.basis); gl.uniform1f(m.uTanHalf, cam.tanHalf);
  gl.uniform3fv(m.uZenith, ZENITH); gl.uniform3fv(m.uHorizon, HORIZON); gl.uniform3fv(m.uAmb, AMB); gl.uniform1f(m.uSunRad, sunRad);
  gl.uniform1f(m.uRefOn, state.ref ? 1 : 0); gl.uniform1f(m.uAlpha, aAlpha);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, mapAcc[mapCur].t); gl.uniform1i(m.uMap, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, refTex); gl.uniform1i(m.uRef, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, acc[accCur].t); gl.uniform1i(m.uPrev, 2);
  gl.drawArrays(gl.TRIANGLES, 0, 3); accCur = aNext;

  // ---- 4) bloom chain ----
  gl.useProgram(P_DOWN.p); gl.uniform1i(P_DOWN.u.uS, 0); gl.activeTexture(gl.TEXTURE0);
  let src = acc[accCur].t;
  for (let i = 0; i < bloom.length; i++){ const b = bloom[i]; gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.viewport(0, 0, b.w, b.h); gl.bindTexture(gl.TEXTURE_2D, src); gl.uniform2f(P_DOWN.u.uDst, b.w, b.h); gl.drawArrays(gl.TRIANGLES, 0, 3); src = b.t; }

  // ---- 5) post → screen ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P_POST.p); const q = P_POST.u;
  gl.uniform2f(q.uRes, W, H); gl.uniform1f(q.uExposure, CFG.exposure); gl.uniform1f(q.uBloom, CFG.bloom);
  gl.uniform1f(q.uFade, Math.min(1, Math.max(0, (t - 0.2)/2.2))); gl.uniform1f(q.uDbg, Q.get('dbg') === 'map' ? 1 : 0);
  gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, mapAcc[mapCur].t); gl.uniform1i(q.uDbgMap, 6);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, acc[accCur].t); gl.uniform1i(q.uAcc, 0);
  for (let i = 0; i < 5; i++){ gl.activeTexture(gl.TEXTURE1 + i); gl.bindTexture(gl.TEXTURE_2D, bloom[i].t); gl.uniform1i(q['uB' + (i+1)], 1 + i); }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ============================================================
//  入力
// ============================================================
const ptrs = new Map(); let lastPinch = 0, lastMid = null, uiTimer = 0;
const ui = document.getElementById('ui');
function wake(){ ui.classList.remove('fade'); clearTimeout(uiTimer); uiTimer = setTimeout(() => ui.classList.add('fade'), 6000); }
wake();
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, shift: e.shiftKey || e.button === 2 }); wake();
  if (ptrs.size === 2){ const a = [...ptrs.values()]; lastPinch = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); lastMid = [(a[0].x + a[1].x)/2, (a[0].y + a[1].y)/2]; } });
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1){
    if (p.shift){ moveSun(dx, dy); }
    else { state.yaw -= dx*0.006; state.pitch = Math.max(0.12, Math.min(1.50, state.pitch + dy*0.006)); state.moved = true; }
  } else if (ptrs.size === 2){
    const a = [...ptrs.values()]; const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); const mid = [(a[0].x + a[1].x)/2, (a[0].y + a[1].y)/2];
    if (lastPinch > 0){ state.zoom = Math.max(0.5, Math.min(6, state.zoom*(d/lastPinch))); state.moved = true; }
    if (lastMid){ moveSun(mid[0] - lastMid[0], mid[1] - lastMid[1]); }
    lastPinch = d; lastMid = mid;
  }
});
function endPtr(e){ ptrs.delete(e.pointerId); lastPinch = 0; lastMid = null; }
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); state.zoom = Math.max(0.5, Math.min(6, state.zoom*Math.exp(-e.deltaY*0.0015))); state.moved = true; wake(); }, { passive: false });
function moveSun(dx, dy){
  if (state.sunAuto){ state.sunAuto = false; }
  state.sunAz -= dx*0.005; state.sunEl = Math.max(10*Math.PI/180, Math.min(89*Math.PI/180, state.sunEl + dy*0.004));
  state.sunJumped = true; state.moved = true;
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault();
    if (!state.sunAuto){ state.manualEl = state.sunEl; state.manualAz = state.sunAz; state.sunAuto = true; state.resumeAt = state.t; state.paused = false; anchorSun(); }
    else state.paused = !state.paused; wake(); }
  if (e.key === 'r' || e.key === 'R'){ state.ref = !state.ref; document.getElementById('ref').classList.toggle('on', state.ref); state.moved = true; }
  if (e.key === 'ArrowLeft') moveSun(-12, 0); if (e.key === 'ArrowRight') moveSun(12, 0);
  if (e.key === 'ArrowUp') moveSun(0, 12); if (e.key === 'ArrowDown') moveSun(0, -12);
});
new ResizeObserver(() => { if (allocScreen()) state.moved = true; }).observe(canvas);
window.addEventListener('resize', () => { if (allocScreen()) state.moved = true; });

// ============================================================
//  ループ（?warm=N で N 秒の状態から収束させて開始）
// ============================================================
allocScreen(); anchorSun();
let last = performance.now(), dtEma = 16, slowFrames = 0;
if (Q.has('warm')){ for (let i = 0; i < 64; i++) render(1/60); }
function loop(now){
  let dt = (now - last)/1000; last = now; if (dt > 0.08) dt = 0.08;
  if (!state.paused) state.t += dt;
  if (allocScreen()) state.moved = true;
  render(dt);
  // 適応解像度（提示間隔基準）
  const ms = dt*1000; if (ms < 79) dtEma = dtEma*0.9 + ms*0.1;
  if (dtEma > 30 && (scale > 0.5 || CFG.photons > 300*300)){ if (++slowFrames > 40){ if (CFG.photons > 300*300) CFG.photons = Math.round(Math.sqrt(CFG.photons)*0.8)**2; else { scale = Math.max(0.5, scale*0.85); allocScreen(); state.moved = true; } slowFrames = 0; } } else slowFrames = 0;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
