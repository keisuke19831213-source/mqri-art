<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="二十四節気の円環 — The Ring of Twenty-Four Seasons。太陽の360度を24の季節として巡る、インタラクティブな生成芸術作品。MQRI ART。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<title>二十四節気の円環 — The Ring of Twenty-Four Seasons</title>
<style>
:root{--font-geist-sans:"Helvetica Neue","Hiragino Kaku Gothic ProN",sans-serif;--font-geist-mono:"SFMono-Regular",Consolas,monospace}
:root{--ink:#070910;--paper:#e9e5d8;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:var(--paper);overflow:hidden}button{font:inherit}.artwork{position:relative;width:100vw;height:100svh;min-height:620px;background:#080a12;isolation:isolate;font-family:var(--font-geist-sans),sans-serif;overflow:hidden}.artwork canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-3}.artwork:after{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 50% 51%,transparent 20%,rgba(5,6,12,.05) 45%,rgba(5,6,12,.82) 100%);pointer-events:none}.noise{position:absolute;inset:0;z-index:8;opacity:.05;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
header{position:absolute;left:clamp(24px,4vw,72px);top:clamp(24px,5vh,58px);z-index:3}.eyebrow,.eng,footer,.legend{font-family:var(--font-geist-mono),monospace;letter-spacing:.16em;text-transform:uppercase}.eyebrow{font-size:9px;opacity:.52;margin-bottom:13px}h1{font-family:serif;font-weight:400;font-size:clamp(23px,2.1vw,34px);letter-spacing:.18em;margin:0}.eng{font-size:8px;opacity:.36;margin-top:9px;letter-spacing:.25em}.dial{position:absolute;width:min(76vmin,760px);height:min(76vmin,760px);left:50%;top:52%;transform:translate(-50%,-50%)}.orbit,.orbit:before,.orbit:after{position:absolute;border-radius:50%;border:1px solid rgba(235,231,215,.13)}.orbit{inset:4%}.orbit:before{content:"";inset:8%}.orbit:after{content:"";inset:19%;border-style:dotted;opacity:.7}.orbit i{position:absolute;width:5px;height:5px;background:#e9e5d8;border-radius:50%;left:50%;top:-3px;box-shadow:0 0 12px #fff}.orbit i:nth-child(2){left:auto;right:-3px;top:50%}.orbit i:nth-child(3){left:50%;top:auto;bottom:-3px}.orbit i:nth-child(4){left:-3px;top:50%}
.term{--radius:min(35.4vmin,354px);position:absolute;left:50%;top:50%;width:42px;height:50px;margin:-25px -21px;transform:rotate(var(--a)) translateY(calc(-1 * var(--radius))) rotate(calc(-1 * var(--a)));border:0;background:transparent;color:rgba(235,231,215,.38);padding:0;cursor:pointer;transition:color .5s,transform .5s;text-align:center}.term span{display:block;font-family:serif;font-size:12px;letter-spacing:.08em;white-space:nowrap}.term small{display:block;font:7px var(--font-geist-mono),monospace;letter-spacing:.1em;margin-top:4px;opacity:.4}.term:before{content:"";position:absolute;left:50%;top:-12px;width:1px;height:7px;background:currentColor}.term:hover,.term:focus-visible{color:#fff;outline:none}.term.active{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.85);transform:rotate(var(--a)) translateY(calc(-1 * var(--radius))) rotate(calc(-1 * var(--a))) scale(1.25)}.center{position:absolute;inset:31%;border-radius:50%;display:grid;place-items:center;text-align:center}.counter{position:absolute;top:4%;font-family:var(--font-geist-mono),monospace}.counter span{font-size:10px}.counter b{font-size:7px;font-weight:400;opacity:.4;margin-left:3px}.current h2{font:400 clamp(38px,7vmin,72px) serif;letter-spacing:.12em;margin:0 0 3px;text-shadow:0 2px 24px #000}.current p{font:9px var(--font-geist-mono),monospace;letter-spacing:.25em;text-transform:uppercase;margin:0;opacity:.55}.current em{font:400 11px serif;letter-spacing:.15em;display:block;margin-top:18px;opacity:.78}
.legend{position:absolute;right:clamp(24px,4vw,72px);top:clamp(28px,5vh,62px);font-size:8px;display:flex;gap:32px}.legend div{display:grid;gap:7px}.legend span{opacity:.35}.legend strong{font-weight:400;font-size:11px;letter-spacing:.08em}footer{position:absolute;left:clamp(24px,4vw,72px);right:clamp(24px,4vw,72px);bottom:clamp(22px,4vh,44px);display:flex;align-items:center;justify-content:space-between;font-size:8px;letter-spacing:.15em;color:rgba(235,231,215,.42)}footer p{position:absolute;left:50%;transform:translateX(-50%);margin:0}.mode{color:inherit;border:0;background:transparent;padding:8px 0;cursor:pointer;letter-spacing:.14em}.mode i{display:inline-block;width:5px;height:5px;border:1px solid currentColor;border-radius:50%;margin-right:8px}.mode i.playing{background:#dae7bd;box-shadow:0 0 8px #dae7bd;border-color:#dae7bd}
@media(max-width:700px){.artwork{min-height:540px}header{top:22px}h1{font-size:20px}.eng{display:none}.legend{top:auto;bottom:62px;right:22px}.dial{width:94vmin;height:94vmin;top:50%}.term{--radius:44vmin}.term span{font-size:10px}.term:nth-of-type(even) span{opacity:.65}.current h2{font-size:42px}.current em{font-size:9px;margin-top:12px}footer{left:22px;right:22px;bottom:18px}footer p{display:none}}@media(prefers-reduced-motion:reduce){.term{transition:none}}
/* 単一HTML化にあたっての追記：指の操作を作品が受け取る */
.artwork{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* iPhoneのノッチ・ホームバーを見込む */
@media(max-width:700px){header{top:calc(22px + env(safe-area-inset-top))}footer{bottom:calc(18px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<main class="artwork">
  <canvas aria-hidden="true"></canvas>
  <div class="noise"></div>
  <header>
    <div class="eyebrow">KINETIC ALMANAC · 2026</div>
    <h1>二十四節気の円環</h1>
    <div class="eng">THE RING OF TWENTY-FOUR SEASONS</div>
  </header>
  <section class="dial" aria-label="二十四節気を選択">
    <div class="orbit" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="center">
      <div class="counter"><span id="idx">11</span><b>/ 24</b></div>
      <div class="current"><h2 id="kanji"></h2><p id="roman"></p><em id="gloss"></em></div>
    </div>
  </section>
  <aside class="legend">
    <div><span>太陽黄経</span><strong id="ecl"></strong></div>
    <div><span>季節</span><strong id="season"></strong></div>
  </aside>
  <footer>
    <button class="mode" id="mode"><i></i><span id="modeLabel">自動巡行</span></button>
    <p>触れて、季節の流れを撹拌する</p>
    <span>ONE SOLAR YEAR · 360°</span>
  </footer>
</main>

<script>
'use strict';
/* =============================================================
   二十四節気の円環 — The Ring of Twenty-Four Seasons
   単一HTML版（2026-07-31）。もとは Next.js + React の実装だったが、
   作品本体はシェーダ1枚と24節気のダイヤルだけで、D1/drizzle は
   テンプレートの残骸で実行時には使われていなかった。MQRI ART の
   「外部依存ゼロ・1フォルダ=1URL」に合わせて素のJSへ書き直している。
   シェーダとCSSはもとの実装から逐語で移した。
   ============================================================= */
const TERMS = [
  ["立春","Risshun","光の芽生え"],
  ["雨水","Usui","雪は雨へ"],
  ["啓蟄","Keichitsu","土の目覚め"],
  ["春分","Shunbun","光と影の均衡"],
  ["清明","Seimei","万物は清らか"],
  ["穀雨","Kokuu","百穀を潤す雨"],
  ["立夏","Rikka","緑の季節へ"],
  ["小満","Shōman","生命が満ちる"],
  ["芒種","Bōshu","種を蒔く頃"],
  ["夏至","Geshi","光の極み"],
  ["小暑","Shōsho","熱の入口"],
  ["大暑","Taisho","暑気の頂"],
  ["立秋","Risshū","風に秋が立つ"],
  ["処暑","Shosho","熱が鎮まる"],
  ["白露","Hakuro","草に宿る露"],
  ["秋分","Shūbun","昼夜ふたたび均衡"],
  ["寒露","Kanro","冷たい露"],
  ["霜降","Sōkō","霜の兆し"],
  ["立冬","Rittō","冬の気配"],
  ["小雪","Shōsetsu","初雪の頃"],
  ["大雪","Taisetsu","雪は深く"],
  ["冬至","Tōji","闇の極み、光の再生"],
  ["小寒","Shōkan","寒の入口"],
  ["大寒","Daikan","静寂の頂"]
];

const VERT = `#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FRAG = `#version 300 es
precision highp float;out vec4 O;uniform vec2 r,m;uniform float t,s;
#define PI 3.14159265359
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fb(vec2 p){float v=0.,a=.5;mat2 q=mat2(.8,-.6,.6,.8);for(int i=0;i<5;i++){v+=a*n(p);p=q*p*2.03+4.7;a*=.5;}return v;}
vec3 pal(float x){vec3 spring=vec3(.38,.92,.66),summer=vec3(1.,.66,.12),autumn=vec3(.78,.22,.08),winter=vec3(.18,.55,.85);float z=fract(x)*4.;if(z<1.)return mix(winter,spring,smoothstep(0.,1.,z));if(z<2.)return mix(spring,summer,smoothstep(1.,2.,z));if(z<3.)return mix(summer,autumn,smoothstep(2.,3.,z));return mix(autumn,winter,smoothstep(3.,4.,z));}
void main(){vec2 uv=(2.*gl_FragCoord.xy-r)/min(r.x,r.y);float R=length(uv),a=atan(uv.y,uv.x);float tt=t*.035;vec2 mouse=(2.*m-r)/min(r.x,r.y);float touch=exp(-8.*length(uv-mouse));float warp=fb(uv*2.8+vec2(cos(tt),sin(tt)))*2.-1.;float season=fract(s+.018*warp+.012*sin(a*3.-tt));
vec3 ink=vec3(.018,.021,.035);vec3 c=ink;float halo=exp(-2.2*R)*(.12+.25*fb(uv*3.+tt));c+=pal(season)*halo;
float ring=exp(-120.*abs(R-(.58+.045*sin(a*12.+warp*4.-tt))));c+=pal(fract(season+a/PI*.08))*ring*(.32+touch);
for(int i=0;i<6;i++){float fi=float(i);float petals=abs(sin(a*(3.+mod(fi,3.))+fi*1.7+warp*2.));float rr=.11+fi*.075+.026*sin(a*(6.+fi)+tt*(1.+fi*.13)+warp*5.);float line=exp(-220.*abs(R-rr));c+=pal(fract(season+fi*.045))*line*(.12+.32*petals);}
float dust=pow(max(0.,n(uv*150.+tt)-.91),9.)*8.;c+=pal(season+.12)*dust*(1.-smoothstep(.2,1.05,R));
float spokes=pow(max(0.,cos(a*24.+warp*1.5)),60.)*exp(-2.*abs(R-.78));c+=pal(fract(season+a/PI*.025))*spokes*.5;
float core=exp(-14.*R*R);c+=vec3(1.,.88,.62)*core*(.2+.2*sin(tt+warp*3.));c+=pal(season)*touch*.18*(1.-smoothstep(0.,.8,R));
float grain=(h(gl_FragCoord.xy+floor(t*4.))-.5)*.035;c+=grain;c*=1.-.42*smoothstep(.62,1.35,R);c=pow(c,vec3(.82));O=vec4(c,1.);}`;

const canvas = document.querySelector('canvas');
const artwork = document.querySelector('.artwork');
const dial = document.querySelector('.dial');
const mouse = [-9999, -9999];
let selected = 10;          // 初期表示＝小暑（もとの実装と同じ）
let season = 10 / 24;       // なめらかに追従する現在値
let target = 10 / 24;
let auto = true;
let timer = null;

/* ---------- 24個のボタンを円周に置く ---------- */
const buttons = TERMS.map((term, i) => {
  const b = document.createElement('button');
  b.className = 'term';
  b.style.setProperty('--a', (i * 15 - 90) + 'deg');
  b.setAttribute('aria-label', term[0] + ' ' + term[2]);
  b.innerHTML = '<span></span><small></small>';
  b.querySelector('span').textContent = term[0];
  b.querySelector('small').textContent = String(i + 1).padStart(2, '0');
  b.addEventListener('click', () => { setAuto(false); choose(i); });
  dial.appendChild(b);
  return b;
});

function choose(i) {
  selected = i;
  season = i / 24;
  target = i / 24;
  buttons.forEach((b, k) => b.classList.toggle('active', k === i));
  document.getElementById('idx').textContent = String(i + 1).padStart(2, '0');
  document.getElementById('kanji').textContent = TERMS[i][0];
  document.getElementById('roman').textContent = TERMS[i][1];
  document.getElementById('gloss').textContent = TERMS[i][2];
  document.getElementById('ecl').textContent = ((315 + i * 15) % 360) + '°';
  document.getElementById('season').textContent = ['春', '夏', '秋', '冬'][Math.floor(i / 6)];
}

/* ---------- 自動巡行 ---------- */
function setAuto(v) {
  auto = v;
  document.getElementById('modeLabel').textContent = v ? '自動巡行' : '静止中';
  document.querySelector('.mode i').classList.toggle('playing', v);
  clearInterval(timer);
  if (v) timer = setInterval(() => choose((selected + 1) % 24), 4200);
}
document.getElementById('mode').addEventListener('click', () => setAuto(!auto));

/* ---------- 指・カーソルで季節の流れを撹拌する ---------- */
artwork.addEventListener('pointermove', e => {
  const q = canvas.getBoundingClientRect();
  mouse[0] = e.clientX - q.left;
  mouse[1] = e.clientY - q.top;
});
artwork.addEventListener('pointerleave', () => { mouse[0] = -9999; mouse[1] = -9999; });

/* ---------- WebGL2 ---------- */
const gl = canvas.getContext('webgl2', { antialias: false });
if (gl) {
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const R = gl.getUniformLocation(pr, 'r'), M = gl.getUniformLocation(pr, 'm'),
        T = gl.getUniformLocation(pr, 't'), S = gl.getUniformLocation(pr, 's');
  const start = performance.now();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const draw = now => {
    const d = Math.min(2, devicePixelRatio),
          w = Math.floor(canvas.clientWidth * d),
          h = Math.floor(canvas.clientHeight * d);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    season += (target - season) * 0.025;
    gl.uniform2f(R, w, h);
    gl.uniform2f(M, mouse[0] * d, (canvas.clientHeight - mouse[1]) * d);
    gl.uniform1f(T, reduce ? 0 : (now - start) / 1000);
    gl.uniform1f(S, season);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

choose(selected);
setAuto(true);
</script>
</body>
</html>
