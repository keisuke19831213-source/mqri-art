<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="実際の軌道要素で計算した惑星の運行を、地動・天動・二星の結びの三つの視点で体験するインタラクティブアート。">
<meta name="theme-color" content="#04060f">
<meta property="og:title" content="星の運行 ─ MOTVS STELLARVM">
<meta property="og:description" content="太陽を中心に、地球から見あげて、二星を結んで。時を操りながら星の運行をながめるデジタルアート。">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060f'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fff3d0'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='4.2' fill='none' stroke='%23d9b36a' stroke-opacity='.55'/%3E%3Ccircle cx='27' cy='16' r='1.7' fill='%237fb4d9'/%3E%3C/svg%3E">
<title>星の運行 ─ MOTVS STELLARVM</title>
<style>
  :root{
    --ink:#04060f;
    --night:#0a0f22;
    --star:#f5f2e6;
    --gold:#d9b36a;
    --gold-dim:rgba(217,179,106,.45);
    --haze:#8d94b6;
    --haze-dim:rgba(141,148,182,.55);
    --line:rgba(217,179,106,.22);
    --serif:"Hiragino Mincho ProN","Hiragino Serif","Yu Mincho","Noto Serif JP","Times New Roman",serif;
  }
  html,body{margin:0;padding:0;background:var(--ink);overscroll-behavior:none;}
  #stage{position:fixed;inset:0;overflow:hidden;background:var(--ink);
    font-family:var(--serif);color:var(--haze);user-select:none;-webkit-user-select:none;}
  canvas{position:absolute;inset:0;display:block;}
  #sky{touch-action:none;cursor:grab;}
  #sky.dragging{cursor:grabbing;}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(2,3,9,.55) 100%);}

  /* ── 題字 ── */
  #titleBlock{position:absolute;top:28px;right:26px;display:flex;flex-direction:row-reverse;
    gap:14px;pointer-events:none;}
  #titleBlock h1{writing-mode:vertical-rl;margin:0;font-size:clamp(26px,4.2vh,38px);
    font-weight:500;letter-spacing:.42em;color:var(--star);text-shadow:0 0 18px rgba(217,179,106,.25);}
  #titleBlock .latin{writing-mode:vertical-rl;font-size:9px;letter-spacing:.5em;
    color:var(--gold-dim);align-self:flex-start;padding-top:6px;}

  /* ── モード切替 ── */
  #modes{position:absolute;top:26px;left:24px;display:flex;flex-direction:column;gap:14px;}
  #modes button{background:none;border:none;border-left:2px solid transparent;
    padding:2px 0 2px 12px;text-align:left;cursor:pointer;font-family:var(--serif);
    color:var(--haze-dim);transition:color .3s,border-color .3s;}
  #modes button .k{display:block;font-size:17px;letter-spacing:.3em;}
  #modes button .c{display:block;font-size:9.5px;letter-spacing:.12em;margin-top:3px;opacity:.75;}
  #modes button:hover{color:var(--haze);}
  #modes button.on{color:var(--gold);border-left-color:var(--gold);}
  #modes button:focus-visible,#controls :focus-visible{outline:1px dashed var(--gold);outline-offset:3px;}

  /* ── 読み出し ── */
  #readout{position:absolute;left:26px;bottom:140px;pointer-events:none;max-width:60vw;}
  #poem{margin:0 0 10px;font-size:12.5px;letter-spacing:.14em;line-height:2;color:var(--haze);opacity:.85;}
  #date{margin:0;font-size:21px;letter-spacing:.14em;color:var(--star);
    font-variant-numeric:tabular-nums;}
  #speedLabel{margin:4px 0 0;font-size:10.5px;letter-spacing:.2em;color:var(--gold-dim);
    font-variant-numeric:tabular-nums;}

  /* ── 操作 ── */
  #controls{position:absolute;left:24px;right:24px;bottom:24px;display:flex;align-items:center;
    gap:14px;flex-wrap:wrap;}
  #controls button,#controls select{background:rgba(10,15,34,.55);border:1px solid var(--line);
    color:var(--haze);font-family:var(--serif);font-size:11.5px;letter-spacing:.2em;
    padding:7px 14px;cursor:pointer;transition:color .25s,border-color .25s;border-radius:2px;}
  #controls button:hover{color:var(--gold);border-color:var(--gold-dim);}
  #pauseBtn{min-width:96px;}
  #pairSel{display:none;max-width:46vw;}
  #pairSel.show{display:block;}
  #speed{-webkit-appearance:none;appearance:none;flex:1;min-width:120px;max-width:300px;
    height:18px;background:none;cursor:pointer;}
  #speed::-webkit-slider-runnable-track{height:1px;background:var(--line);}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--gold);margin-top:-5px;box-shadow:0 0 8px rgba(217,179,106,.6);}
  #speed::-moz-range-track{height:1px;background:var(--line);}
  #speed::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--gold);}

  /* ── ヒント・ツールチップ ── */
  #hint{position:absolute;left:50%;top:34px;transform:translateX(-50%);
    font-size:11px;letter-spacing:.28em;color:var(--haze-dim);pointer-events:none;
    transition:opacity 2.2s;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis;}
  #hint.gone{opacity:0;}
  #tip{position:absolute;pointer-events:none;font-size:11px;letter-spacing:.16em;
    color:var(--star);text-shadow:0 1px 6px #000;opacity:0;transition:opacity .2s;white-space:nowrap;}
  #tip small{display:block;color:var(--gold-dim);font-size:9.5px;margin-top:2px;letter-spacing:.12em;}

  /* 狭い画面 — 縦に余裕があるので下寄せのまま詰める */
  @media (max-width:640px){
    #titleBlock{top:18px;right:14px;}
    #titleBlock h1{font-size:clamp(22px,3.4vh,30px);letter-spacing:.34em;}
    #modes{top:18px;left:14px;gap:10px;}
    #readout{top:auto;bottom:184px;left:16px;max-width:74vw;}
    #date{font-size:17px;}
    #poem{font-size:11px;}
    #controls{left:14px;right:14px;bottom:16px;gap:8px;}
    #controls button,#controls select{padding:6px 11px;letter-spacing:.14em;}
    #speed{min-width:100%;max-width:none;margin-top:2px;}
    #pairSel{max-width:100%;}
    #hint{top:auto;bottom:150px;left:16px;transform:none;
      font-size:10px;letter-spacing:.14em;max-width:calc(100vw - 32px);}
  }
  /* 低い画面 — 下端が埋まるので読み出しを上へ逃がす */
  @media (max-height:560px){
    #poem{display:none;}
    #speedLabel{display:none;}
    #date{font-size:15px;}
    #modes{flex-direction:row;gap:16px;}
    #modes button .c{display:none;}
    #readout{bottom:auto;top:58px;left:24px;max-width:none;}
    #hint{top:auto;bottom:auto;left:50%;transform:translateX(-50%);
      top:58px;max-width:44vw;}
  }
  @media (max-height:560px) and (max-width:640px){
    #readout{top:52px;left:16px;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="trails"></canvas>
  <canvas id="sky"></canvas>
  <div id="vignette"></div>

  <header id="titleBlock" aria-hidden="true">
    <h1>星の運行</h1><span class="latin">MOTVS&nbsp;STELLARVM</span>
  </header>

  <nav id="modes" aria-label="ながめ方">
    <button data-mode="helio" class="on"><span class="k">地動</span><span class="c">太陽を中心に</span></button>
    <button data-mode="geo"><span class="k">天動</span><span class="c">地球から見る</span></button>
    <button data-mode="dance"><span class="k">結び</span><span class="c">二星の軌跡</span></button>
  </nav>

  <div id="readout">
    <p id="poem"></p>
    <p id="date"></p>
    <p id="speedLabel"></p>
  </div>

  <div id="controls">
    <button id="pauseBtn">とめる</button>
    <button id="todayBtn">今日へ</button>
    <button id="wipeBtn">軌跡を拭う</button>
    <button id="viewBtn">立体で見る</button>
    <button id="labelBtn">星名を消す</button>
    <input id="speed" type="range" min="-1" max="3.48" step="0.01" value="1"
      aria-label="時の速さ">
    <select id="pairSel" aria-label="結ぶ二星">
      <option value="2,1" selected>地球 × 金星 ─ 五芒の華</option>
      <option value="2,0">地球 × 水星 ─ 繁き輪</option>
      <option value="2,3">地球 × 火星 ─ うねりの帯</option>
      <option value="1,3">金星 × 火星 ─ 揺れる網</option>
      <option value="0,1">水星 × 金星 ─ 密なる渦</option>
      <option value="2,4">地球 × 木星 ─ 細かき環</option>
    </select>
  </div>

  <div id="hint">よこにドラッグ ─ 時がながれる &emsp; ホイール ─ 遠近 &emsp; 星にふれる ─ 名がともる</div>
  <div id="tip"></div>
</div>

<script>
'use strict';
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const J2000_MS = 946728000000; // 2000-01-01 12:00 UTC 近似

/* ── 軌道要素 (J2000 近似平均要素) ── */
const PLANETS = [
  {name:'水星', color:'#b9a998', size:2.3, a:0.38710, e:0.20563, I:7.005,  L0:252.2503, vp:77.4577,  O:48.3308,  dL:149472.6746, period:87.97},
  {name:'金星', color:'#e8d5a3', size:3.4, a:0.72333, e:0.00677, I:3.395,  L0:181.9791, vp:131.6024, O:76.6807,  dL:58517.8156,  period:224.70},
  {name:'地球', color:'#7fb4d9', size:3.6, a:1.00000, e:0.01671, I:0.0,    L0:100.4645, vp:102.9377, O:0.0,      dL:35999.3725,  period:365.25, earth:true},
  {name:'火星', color:'#d98559', size:2.9, a:1.52371, e:0.09339, I:1.850,  L0:-4.5535,  vp:-23.9435, O:49.5595,  dL:19140.2993,  period:686.98},
  {name:'木星', color:'#d9b08c', size:6.0, a:5.20289, e:0.04839, I:1.304,  L0:34.3964,  vp:14.7285,  O:100.4739, dL:3034.7461,   period:4332.6},
  {name:'土星', color:'#e0c98f', size:5.2, a:9.53707, e:0.05386, I:2.486,  L0:49.9542,  vp:92.5988,  O:113.6624, dL:1222.1138,   period:10759, ring:true},
];
const EARTH = 2;
const ZODIAC = ['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'].map(g => g + '︎');

function heliPos(p, t){
  const cy = t / 36525;
  const L = p.L0 + p.dL * cy;
  let M = ((L - p.vp) % 360) * D2R;
  let E = M + p.e * Math.sin(M);
  for(let i = 0; i < 6; i++) E -= (E - p.e * Math.sin(E) - M) / (1 - p.e * Math.cos(E));
  const xv = p.a * (Math.cos(E) - p.e);
  const yv = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);
  const inc = p.I * D2R;
  const w = (p.vp - p.O) * D2R, Om = p.O * D2R, ci = Math.cos(inc), si = Math.sin(inc);
  const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(Om), sO = Math.sin(Om);
  return {
    x: (cw * cO - sw * sO * ci) * xv + (-sw * cO - cw * sO * ci) * yv,
    y: (cw * sO + sw * cO * ci) * xv + (-sw * sO + cw * cO * ci) * yv,
    z: (sw * si) * xv + (cw * si) * yv,
  };
}
function geoPos(p, t, ep){ const h = heliPos(p, t); return {x: h.x - ep.x, y: h.y - ep.y, z: h.z - ep.z}; }

/* 軌道の描線 (ほぼ不変なので先に標本化) */
const ORBITS = PLANETS.map(p => {
  const pts = [];
  const inc = p.I * D2R;
  const w = (p.vp - p.O) * D2R, Om = p.O * D2R, ci = Math.cos(inc), si = Math.sin(inc);
  const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(Om), sO = Math.sin(Om);
  const b = p.a * Math.sqrt(1 - p.e * p.e);
  for(let i = 0; i <= 240; i++){
    const E = TAU * i / 240;
    const xv = p.a * (Math.cos(E) - p.e), yv = b * Math.sin(E);
    pts.push([
      (cw * cO - sw * sO * ci) * xv + (-sw * cO - cw * sO * ci) * yv,
      (cw * sO + sw * cO * ci) * xv + (-sw * sO + cw * cO * ci) * yv,
      (sw * si) * xv + (cw * si) * yv,
    ]);
  }
  return pts;
});

/* ── 画布 ── */
const sky = document.getElementById('sky'), trailC = document.getElementById('trails');
const sctx = sky.getContext('2d'), tctx = trailC.getContext('2d');
const tmp = document.createElement('canvas'), tmpx = tmp.getContext('2d');
let W = 0, H = 0, DPR = 1, CX = 0, CY = 0;
let fitScale = 1, zoomFactor = 1;   // scale = fitScale * zoomFactor  (px / AU)
let stars = [];

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  CX = W / 2; CY = H / 2;
  for(const c of [sky, trailC]){ c.width = W * DPR; c.height = H * DPR; c.style.width = W + 'px'; c.style.height = H + 'px'; }
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fitScale = Math.min(W, H) * 0.46 / 3.4;
  makeStars();
}
const scaleOf = () => fitScale * zoomFactor;

function makeStars(){
  stars = [];
  const R = Math.hypot(W, H) / 2 + 60;
  const n = Math.min(1300, Math.round(W * H / 1500));
  for(let i = 0; i < n; i++){
    stars.push({ r: Math.sqrt(Math.random()) * R, th: Math.random() * TAU,
      s: Math.random() < 0.85 ? 0.5 + Math.random() * 0.7 : 1.1 + Math.random() * 0.8,
      a: 0.15 + Math.random() * 0.55, ph: Math.random() * TAU, f: 0.3 + Math.random() * 1.4,
      c: Math.random() < 0.08 ? '#aecbe8' : (Math.random() < 0.08 ? '#e8cfae' : '#f5f2e6') });
  }
  // 天の川めいた帯
  const band = Math.PI * 0.32;
  for(let i = 0; i < n * 0.5; i++){
    const along = (Math.random() - 0.5) * R * 2.2;
    const off = (Math.random() + Math.random() + Math.random() - 1.5) * 90;
    const x = Math.cos(band) * along - Math.sin(band) * off;
    const y = Math.sin(band) * along + Math.cos(band) * off;
    stars.push({ r: Math.hypot(x, y), th: Math.atan2(y, x), s: 0.4 + Math.random() * 0.5,
      a: 0.05 + Math.random() * 0.2, ph: Math.random() * TAU, f: 0.2 + Math.random(), c: '#dfe4f2' });
  }
}

/* ── 状態 ── */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let simT = (Date.now() - J2000_MS) / 864e5;  // J2000 からの日数
let playing = !reduced;
let mode = 'helio';
let pair = [2, 1];
let lastLineT = simT;
let dragDays = 0;
let hover = null;
const bodiesOnScreen = [];   // {x,y,name,sub}

const $ = id => document.getElementById(id);
const speedEl = $('speed'), dateEl = $('date'), speedLabel = $('speedLabel'),
      poemEl = $('poem'), tipEl = $('tip'), pauseBtn = $('pauseBtn'), pairSel = $('pairSel');
const daysPerSec = () => Math.pow(10, parseFloat(speedEl.value));

const POEMS = {
  helio: '太陽を中心に、六つの星がめぐる。',
  geo:   '地球から見あげれば、星はときに立ちどまり、あともどりする。',
  dance: 'ふたつの星をむすぶ線が、歳月のなかに華を編む。',
};

/* ── 軌跡の画布 ── */
function clearTrails(){
  tctx.save(); tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.clearRect(0, 0, trailC.width, trailC.height); tctx.restore();
}
function fadeTrails(amount){
  tctx.save(); tctx.globalCompositeOperation = 'destination-out';
  tctx.fillStyle = 'rgba(0,0,0,' + amount + ')';
  tctx.fillRect(0, 0, W, H); tctx.restore();
}
function rescaleTrails(k){
  tmp.width = trailC.width; tmp.height = trailC.height;
  tmpx.clearRect(0, 0, tmp.width, tmp.height);
  tmpx.drawImage(trailC, 0, 0);
  tctx.save(); tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.clearRect(0, 0, trailC.width, trailC.height);
  const dcx = CX * DPR, dcy = CY * DPR;
  tctx.translate(dcx, dcy); tctx.scale(k, k); tctx.translate(-dcx, -dcy);
  tctx.drawImage(tmp, 0, 0);
  tctx.restore();
}

/* 視点 — tilt=0 で真上から。立体視点では黄道面を斜めに見おろす */
let view3D = false, labelsOn = true;
let tilt = 0, tiltTarget = 0;
function P(x, y, z){
  const s = scaleOf(), ct = Math.cos(tilt), st = Math.sin(tilt);
  z = z || 0;
  return { x: CX + x * s, y: CY - (y * ct + z * st) * s, d: y * st - z * ct };
}
const depthK = d => Math.max(0.7, Math.min(1.3, 1 - d * 0.02));

/* 惑星の軌跡 (地動・天動) */
function drawTrailSegments(t0, t1){
  const dt = t1 - t0;
  if(dt === 0) return;
  tctx.lineCap = 'round';
  for(let i = 0; i < PLANETS.length; i++){
    const p = PLANETS[i];
    if(mode === 'geo' && i === EARTH) continue;
    const maxStep = (mode === 'geo' ? Math.min(p.period, 365.25) : p.period) / 240;
    const steps = Math.min(90, Math.max(1, Math.ceil(Math.abs(dt) / maxStep)));
    tctx.strokeStyle = p.color; tctx.globalAlpha = 0.5; tctx.lineWidth = 1.1;
    tctx.beginPath();
    for(let k = 0; k <= steps; k++){
      const t = t0 + dt * k / steps;
      let pos;
      if(mode === 'geo'){ pos = geoPos(p, t, heliPos(PLANETS[EARTH], t)); }
      else pos = heliPos(p, t);
      const q = P(pos.x, pos.y, pos.z);
      k === 0 ? tctx.moveTo(q.x, q.y) : tctx.lineTo(q.x, q.y);
    }
    tctx.stroke();
  }
  if(mode === 'geo'){ // 太陽の道
    const steps = Math.min(90, Math.max(1, Math.ceil(Math.abs(dt) / 1.5)));
    tctx.strokeStyle = '#ffd98a'; tctx.globalAlpha = 0.45; tctx.lineWidth = 1.3;
    tctx.beginPath();
    for(let k = 0; k <= steps; k++){
      const t = t0 + dt * k / steps, ep = heliPos(PLANETS[EARTH], t);
      const q = P(-ep.x, -ep.y, -ep.z);
      k === 0 ? tctx.moveTo(q.x, q.y) : tctx.lineTo(q.x, q.y);
    }
    tctx.stroke();
  }
  tctx.globalAlpha = 1;
}

/* 結び — 二星をむすぶ線 */
function mixColor(c1, c2){
  const h = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const a = h(c1), b = h(c2);
  return 'rgb(' + Math.round((a[0]+b[0])/2) + ',' + Math.round((a[1]+b[1])/2) + ',' + Math.round((a[2]+b[2])/2) + ')';
}
function drawDanceLines(t1){
  const pA = PLANETS[pair[0]], pB = PLANETS[pair[1]];
  const lineEvery = Math.max(1, Math.min(pA.period, pB.period) / 72);
  const dt = t1 - lastLineT;
  let n = Math.floor(Math.abs(dt) / lineEvery);
  if(n === 0) return;
  let step = lineEvery * Math.sign(dt);
  if(n > 400){ step = dt / 400; n = 400; }
  tctx.strokeStyle = mixColor(pA.color, pB.color);
  tctx.globalAlpha = 0.075; tctx.lineWidth = 0.8;
  tctx.beginPath();
  for(let i = 1; i <= n; i++){
    const t = lastLineT + step * i;
    const a = heliPos(pA, t), b = heliPos(pB, t);
    const qa = P(a.x, a.y, a.z), qb = P(b.x, b.y, b.z);
    tctx.moveTo(qa.x, qa.y);
    tctx.lineTo(qb.x, qb.y);
  }
  tctx.stroke();
  tctx.globalAlpha = 1;
  lastLineT += step * n;
}

/* ── 空の描画 ── */
function drawStars(now){
  const rot = simT / 365250 * TAU;  // 千年でひとめぐり(誇張した歳差)
  for(const st of stars){
    const a = st.th + rot;
    const tw = st.a * (0.72 + 0.28 * Math.sin(now * 0.001 * st.f + st.ph));
    sctx.globalAlpha = tw;
    sctx.fillStyle = st.c;
    sctx.beginPath();
    sctx.arc(CX + st.r * Math.cos(a), CY + st.r * Math.sin(a), st.s, 0, TAU);
    sctx.fill();
  }
  sctx.globalAlpha = 1;
}
function glow(x, y, r, color, core){
  const g = sctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, core); g.addColorStop(0.35, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = g;
  sctx.beginPath(); sctx.arc(x, y, r, 0, TAU); sctx.fill();
}
function drawPlanet(x, y, p, alpha, k){
  const r = p.size * (k || 1);
  sctx.globalAlpha = alpha;
  glow(x, y, r * 5, p.color + '33', p.color + '88');
  sctx.fillStyle = p.color;
  sctx.beginPath(); sctx.arc(x, y, r, 0, TAU); sctx.fill();
  if(p.ring){
    sctx.strokeStyle = p.color; sctx.globalAlpha = alpha * 0.6; sctx.lineWidth = 1;
    sctx.beginPath(); sctx.ellipse(x, y, r * 2.1, r * 0.8, -0.35, 0, TAU); sctx.stroke();
  }
  if(labelsOn){
    sctx.globalAlpha = alpha * 0.6;
    sctx.fillStyle = '#aeb4cf'; sctx.font = '11px ' + getComputedStyle(document.body).getPropertyValue('--serif');
    sctx.fillText(p.name, x + r + 6, y - r - 4);
  }
  sctx.globalAlpha = 1;
}
function drawSun(x, y, alpha, k){
  k = k || 1;
  sctx.globalAlpha = alpha;
  glow(x, y, 34 * k, 'rgba(255,217,138,.35)', 'rgba(255,243,208,.95)');
  sctx.fillStyle = '#fff3d0';
  sctx.beginPath(); sctx.arc(x, y, 5.5 * k, 0, TAU); sctx.fill();
  sctx.globalAlpha = 1;
}
function drawOrbit(i, alpha){
  sctx.strokeStyle = 'rgba(141,148,182,' + alpha + ')';
  sctx.lineWidth = 0.7;
  sctx.beginPath();
  const pts = ORBITS[i];
  for(let k = 0; k < pts.length; k++){
    const q = P(pts[k][0], pts[k][1], pts[k][2]);
    k === 0 ? sctx.moveTo(q.x, q.y) : sctx.lineTo(q.x, q.y);
  }
  sctx.stroke();
}
function drawZodiac(){
  const Rw = Math.min(W, H) * 0.465 / scaleOf();
  sctx.strokeStyle = 'rgba(217,179,106,.16)'; sctx.lineWidth = 1;
  sctx.beginPath();
  for(let i = 0; i <= 120; i++){
    const a = TAU * i / 120;
    const q = P(Rw * Math.cos(a), Rw * Math.sin(a), 0);
    i === 0 ? sctx.moveTo(q.x, q.y) : sctx.lineTo(q.x, q.y);
  }
  sctx.stroke();
  sctx.fillStyle = 'rgba(217,179,106,.5)';
  sctx.font = '14px serif'; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
  for(let k = 0; k < 12; k++){
    const tick = k * 30 * D2R;
    const q1 = P(Rw * 0.986 * Math.cos(tick), Rw * 0.986 * Math.sin(tick), 0);
    const q2 = P(Rw * 1.014 * Math.cos(tick), Rw * 1.014 * Math.sin(tick), 0);
    sctx.strokeStyle = 'rgba(217,179,106,.22)';
    sctx.beginPath(); sctx.moveTo(q1.x, q1.y); sctx.lineTo(q2.x, q2.y); sctx.stroke();
    const mid = (k * 30 + 15) * D2R;
    const qg = P(Rw * 1.052 * Math.cos(mid), Rw * 1.052 * Math.sin(mid), 0);
    sctx.fillText(ZODIAC[k], qg.x, qg.y);
  }
  sctx.textAlign = 'left'; sctx.textBaseline = 'alphabetic';
}

function drawScene(now){
  sctx.clearRect(0, 0, W, H);
  drawStars(now);
  bodiesOnScreen.length = 0;
  const items = []; // 遠くから順に描く

  if(mode === 'helio' || mode === 'dance'){
    for(let i = 0; i < PLANETS.length; i++){
      const dim = mode === 'dance' && i !== pair[0] && i !== pair[1];
      drawOrbit(i, dim ? 0.05 : 0.13);
    }
    const qs = P(0, 0, 0);
    items.push({d: qs.d, draw: () => drawSun(qs.x, qs.y, 1)});
    bodiesOnScreen.push({x: qs.x, y: qs.y, name: '太陽', sub: 'めぐりの中心'});
    for(let i = 0; i < PLANETS.length; i++){
      const p = PLANETS[i], h = heliPos(p, simT);
      const q = P(h.x, h.y, h.z);
      const dim = mode === 'dance' && i !== pair[0] && i !== pair[1];
      items.push({d: q.d, draw: () => drawPlanet(q.x, q.y, p, dim ? 0.22 : 1, depthK(q.d))});
      bodiesOnScreen.push({x: q.x, y: q.y, name: p.name, sub: '太陽まで ' + Math.hypot(h.x, h.y, h.z).toFixed(2) + ' 天文単位'});
    }
  } else { // 天動
    drawZodiac();
    const ep = heliPos(PLANETS[EARTH], simT);
    const qs = P(-ep.x, -ep.y, -ep.z);
    items.push({d: qs.d, draw: () => drawSun(qs.x, qs.y, 1, depthK(qs.d))});
    bodiesOnScreen.push({x: qs.x, y: qs.y, name: '太陽', sub: '地球まで ' + Math.hypot(ep.x, ep.y, ep.z).toFixed(2) + ' 天文単位'});
    const qe = P(0, 0, 0);
    items.push({d: qe.d, draw: () => drawPlanet(qe.x, qe.y, PLANETS[EARTH], 1, 1)});
    bodiesOnScreen.push({x: qe.x, y: qe.y, name: '地球', sub: 'ここから見あげる'});
    for(let i = 0; i < PLANETS.length; i++){
      if(i === EARTH) continue;
      const p = PLANETS[i], g = geoPos(p, simT, ep);
      const q = P(g.x, g.y, g.z);
      items.push({d: q.d, draw: () => drawPlanet(q.x, q.y, p, 1, depthK(q.d))});
      bodiesOnScreen.push({x: q.x, y: q.y, name: p.name, sub: '地球まで ' + Math.hypot(g.x, g.y, g.z).toFixed(2) + ' 天文単位'});
    }
  }
  items.sort((a, b) => b.d - a.d);
  for(const it of items) it.draw();
}

/* ── 読み出し ── */
function fmtDate(){
  const d = new Date(J2000_MS + simT * 864e5);
  const y = d.getFullYear();
  const era = y <= 0 ? '紀元前' + (1 - y) + '年' : y + '年';
  return era + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function fmtSpeed(){
  const v = daysPerSec();
  if(v >= 365.25) return '時の速さ ─ 一秒に ' + (v / 365.25).toFixed(1) + ' 年';
  if(v >= 1) return '時の速さ ─ 一秒に ' + Math.round(v) + ' 日';
  return '時の速さ ─ 一秒に ' + (v * 24).toFixed(1) + ' 時間';
}
let lastReadout = 0;
function updateReadout(now){
  if(now - lastReadout < 120) return;
  lastReadout = now;
  dateEl.textContent = fmtDate();
  speedLabel.textContent = fmtSpeed();
}

/* ── 主ループ ── */
let prevNow = performance.now();
function frame(now){
  const dtReal = Math.min(0.1, (now - prevNow) / 1000);
  prevNow = now;
  if(Math.abs(tilt - tiltTarget) > 0.0004){
    tilt += (tiltTarget - tilt) * Math.min(1, dtReal * 5);
    clearTrails();
  }
  let t1 = simT;
  if(playing) t1 += daysPerSec() * dtReal;
  if(dragDays !== 0){ t1 += dragDays; dragDays = 0; }
  if(t1 !== simT){
    if(mode === 'dance') drawDanceLines(t1);
    else drawTrailSegments(simT, t1);
    simT = t1;
  }
  fadeTrails(mode === 'dance' ? 0.0012 : (mode === 'geo' ? 0.006 : 0.02));
  drawScene(now);
  updateReadout(now);
  requestAnimationFrame(frame);
}

/* ── 操作 ── */
const pointers = new Map();
let pinchDist = 0;
sky.addEventListener('pointerdown', e => {
  sky.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
  sky.classList.add('dragging');
});
sky.addEventListener('pointermove', e => {
  if(pointers.has(e.pointerId)){
    const prev = pointers.get(e.pointerId);
    if(pointers.size === 1){
      const dpp = Math.min(50, Math.max(0.05, daysPerSec() / 60));
      dragDays += (e.clientX - prev.x) * dpp;
      if(view3D) tiltTarget = Math.max(0, Math.min(1.32, tiltTarget + (e.clientY - prev.y) * 0.004));
    }
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if(pinchDist > 0) applyZoom(d / pinchDist);
      pinchDist = d;
    }
  } else {
    // ホバー
    let best = null, bd = 18;
    for(const bo of bodiesOnScreen){
      const d = Math.hypot(e.clientX - bo.x, e.clientY - bo.y);
      if(d < bd){ bd = d; best = bo; }
    }
    hover = best;
    if(best){
      tipEl.innerHTML = best.name + '<small>' + best.sub + '</small>';
      tipEl.style.left = (best.x + 14) + 'px';
      tipEl.style.top = (best.y + 6) + 'px';
      tipEl.style.opacity = 1;
    } else tipEl.style.opacity = 0;
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  pinchDist = 0;
  if(pointers.size === 0) sky.classList.remove('dragging');
}
sky.addEventListener('pointerup', endPointer);
sky.addEventListener('pointercancel', endPointer);

function applyZoom(k){
  const z2 = Math.min(22, Math.max(0.26, zoomFactor * k));
  const real = z2 / zoomFactor;
  if(real === 1) return;
  rescaleTrails(real);
  zoomFactor = z2;
}
sky.addEventListener('wheel', e => {
  e.preventDefault();
  applyZoom(Math.exp(-e.deltaY * 0.0012));
}, {passive: false});

/* ボタン */
function setPlaying(v){
  playing = v;
  pauseBtn.textContent = playing ? 'とめる' : 'めぐらす';
}
pauseBtn.addEventListener('click', () => setPlaying(!playing));
$('todayBtn').addEventListener('click', () => {
  simT = (Date.now() - J2000_MS) / 864e5;
  lastLineT = simT;
  clearTrails();
});
$('wipeBtn').addEventListener('click', () => { clearTrails(); lastLineT = simT; });

let hintTimer = 0;
function showHint(text){
  const h = $('hint');
  h.textContent = text;
  h.classList.remove('gone');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => h.classList.add('gone'), 7000);
}
$('viewBtn').addEventListener('click', () => {
  view3D = !view3D;
  tiltTarget = view3D ? 0.96 : 0;
  $('viewBtn').textContent = view3D ? '平面にもどす' : '立体で見る';
  if(view3D) showHint('たてにドラッグ ─ 傾きをかえる　よこにドラッグ ─ 時がながれる');
});
$('labelBtn').addEventListener('click', () => {
  labelsOn = !labelsOn;
  $('labelBtn').textContent = labelsOn ? '星名を消す' : '星名を灯す';
});
document.addEventListener('keydown', e => {
  if(e.code === 'Space' && !e.repeat && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SELECT'){
    e.preventDefault(); setPlaying(!playing);
  }
});

/* モード */
document.querySelectorAll('#modes button').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b === btn));
    poemEl.textContent = POEMS[mode];
    pairSel.classList.toggle('show', mode === 'dance');
    clearTrails();
    lastLineT = simT;
    if(mode === 'dance' && daysPerSec() < 200) speedEl.value = '2.4';
  });
});
pairSel.addEventListener('change', () => {
  pair = pairSel.value.split(',').map(Number);
  clearTrails();
  lastLineT = simT;
});

/* ヒント */
setTimeout(() => $('hint').classList.add('gone'), 8000);
if(reduced){
  setPlaying(false);
  $('hint').textContent = '「めぐらす」で時がながれる ─ ドラッグでも送れます';
}

poemEl.textContent = POEMS[mode];
setPlaying(playing);
window.addEventListener('resize', () => { resize(); clearTrails(); });
resize();
requestAnimationFrame(frame);
</script>
