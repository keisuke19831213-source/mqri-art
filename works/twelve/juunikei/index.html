<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>十二経 | 「12」第五作</title>
<style>
  :root{ --ink:#ece5d8; --ink-dim:rgba(236,229,216,.55); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#141008; }
  body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #gl{ z-index:0; } #ring{ z-index:1; cursor:grab; }
  #ring.dragging{ cursor:grabbing; }
  #title{
    position:fixed; top:28px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.55em;
    font-size:clamp(14px,1.6vmin,19px); font-weight:500;
    color:var(--ink-dim); text-shadow:0 0 18px rgba(0,0,0,.5); pointer-events:none;
  }
  #title b{ font-weight:600; color:var(--ink); font-size:1.35em; letter-spacing:.4em; }
  #series{
    position:fixed; bottom:24px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.4em;
    font-size:11px; color:rgba(236,229,216,.30); pointer-events:none;
  }
  #ctrl{ position:fixed; top:26px; right:30px; z-index:2;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .btn{
    font-family:inherit; font-size:12px; letter-spacing:.3em; text-indent:.3em;
    color:var(--ink-dim); background:transparent;
    border:1px solid rgba(236,229,216,.26); border-radius:999px;
    padding:8px 16px 7px 16px; cursor:pointer;
    transition:color .4s, border-color .4s, background .4s; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); border-color:rgba(236,229,216,.6); background:rgba(236,229,216,.06); }
  .btn.on{ color:var(--ink); border-color:rgba(236,229,216,.7); background:rgba(236,229,216,.08); }
  .seg{ display:flex; gap:8px; }
  .btn.small{ padding:7px 13px 6px 13px; font-size:11px; letter-spacing:.22em; text-indent:.22em; }
  #hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:11px; letter-spacing:.3em; color:rgba(236,229,216,.34);
    white-space:nowrap; pointer-events:none; transition:opacity 1.2s;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ring"></canvas>
<div id="title"><b>十二経</b>　気はひと日に、からだを三たびめぐる</div>
<div id="series">「12」— 円環の連作　第五</div>
<div id="ctrl">
  <div class="seg" id="flowSeg">
    <button class="btn small" data-f="0">止</button>
    <button class="btn small on" data-f="1">ゆるり</button>
    <button class="btn small" data-f="2">疾く</button>
  </div>
  <button class="btn" id="nowBtn">いまへ</button>
  <button class="btn" id="varBtn">見た目　銅人</button>
</div>
<div id="hint">まわして刻をめぐる — ドラッグ一周＝一日 / 経をタップ / 三焦だけ、かたちがない</div>

<script>
"use strict";

/* ============================================================
   十二経データ — 子午流注の順。path: 0胸→手 1手→頭 2頭→足 3足→胸
============================================================ */
const MER=[
 {n:"肺",   full:"手太陰肺経",   s:3,  yy:"陰", e:3, path:0, emo:"悲しみ・憂い"},
 {n:"大腸", full:"手陽明大腸経", s:5,  yy:"陽", e:3, path:1, emo:"執着——手放せない"},
 {n:"胃",   full:"足陽明胃経",   s:7,  yy:"陽", e:2, path:2, emo:"心配・取り越し苦労"},
 {n:"脾",   full:"足太陰脾経",   s:9,  yy:"陰", e:2, path:3, emo:"思慮過多・自責"},
 {n:"心",   full:"手少陰心経",   s:11, yy:"陰", e:1, path:0, emo:"喜びの欠如、または過剰"},
 {n:"小腸", full:"手太陽小腸経", s:13, yy:"陽", e:1, path:1, emo:"優柔不断・分別できない"},
 {n:"膀胱", full:"足太陽膀胱経", s:15, yy:"陽", e:4, path:2, emo:"恐れ・古い記憶"},
 {n:"腎",   full:"足少陰腎経",   s:17, yy:"陰", e:4, path:3, emo:"根源的なおそれ"},
 {n:"心包", full:"手厥陰心包経", s:19, yy:"陰", e:1, path:0, emo:"心のとざし・ガード"},
 {n:"三焦", full:"手少陽三焦経", s:21, yy:"陽", e:1, path:1, emo:"漠然とした不安", ghost:true},
 {n:"胆",   full:"足少陽胆経",   s:23, yy:"陽", e:0, path:2, emo:"決められない・怒りの抑圧"},
 {n:"肝",   full:"足厥陰肝経",   s:1,  yy:"陰", e:0, path:3, emo:"怒り・抑うつ"},
];
const GOGYO=[
 {n:"木", col:[0.40,0.63,0.46]},
 {n:"火", col:[0.83,0.38,0.27]},
 {n:"土", col:[0.79,0.64,0.31]},
 {n:"金", col:[0.85,0.83,0.76]},
 {n:"水", col:[0.38,0.50,0.64]},
];
const PATH_NAME=["胸から手へ","手から頭へ","頭から足へ","足から胸へ"];
const KOKU=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const TAU=Math.PI*2;

/* 24時間盤 — 真上＝子（0時）。経kの中心時刻 = s+1 */
function hourAngle(h){ return (-90 + (h/24)*360)*Math.PI/180; }
function activeIdx(h){ return Math.floor((((h-3)%24)+24)%24/2); }
function activeFrac(h){ return ((((h-3)%24)+24)%24%2)/2; }

/* うなり — 体の12.0時間と、海の記憶12.4時間 */
const H1=12.0, H2=12.4;
const BEAT=1/(1/H1-1/H2);   // 372時間 = 15.5日

/* ============================================================
   見た目3案
============================================================ */
const VORDER=["A","B","C"];
const VARIANTS={
  A:{ name:"銅人", bg:["#0b0908","#1c1409"], accent:"#d9b56a", body:"#c9a86a",
      elemSat:.48, wave1:"#d9b56a", wave2:"#6fa8b0", shaft:.9 },
  B:{ name:"水墨", bg:["#0a0c0e","#16191d"], accent:"#cfd4d8", body:"#b8c0c4",
      elemSat:.32, wave1:"#cfd4d8", wave2:"#6a8a98", shaft:.7 },
  C:{ name:"五行", bg:["#090e18","#122036"], accent:"#e0c890", body:"#a8b4c8",
      elemSat:1.0, wave1:"#e0c890", wave2:"#68b8c8", shaft:.6 },
};
const q0=new URLSearchParams(location.search);
let vKey=VARIANTS[(q0.get("v")||"A").toUpperCase()]?(q0.get("v")||"A").toUpperCase():"A";
let V=VARIANTS[vKey];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function rgbCss(c,a=1){ return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`; }
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
function elemCol(e){ const g=[.62,.60,.55]; return mix3(g,GOGYO[e].col,Math.min(1,.3+V.elemSat*.7)); }

/* ============================================================
   WebGL2 — 気のにじむ夜
============================================================ */
const glCanvas=document.getElementById("gl");
const gl=glCanvas.getContext("webgl2",{antialias:false,alpha:false});
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position=vec4(aPos,0.,1.); }`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uBgA,uBgB,uElem;
uniform float uQi;          // 気の波の角度（ラジアン・画面系）
uniform float uShaft;       // 像を照らす一条の光の強さ
out vec4 fragColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; } return v; }
void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;
  float t=uTime;
  float rr=length(uv), th=atan(uv.y,uv.x);
  vec2 p=uv*2.0;
  vec2 q=vec2(fbm(p+t*.010), fbm(p+vec2(5.2,1.3)-t*.008));
  float f=fbm(p+2.3*q);
  vec3 col=mix(uBgA,uBgB,clamp(f*f*2.2,0.,1.));
  col=mix(col,uElem*.55,clamp(length(q)*.7,0.,1.)*.30);
  /* 一条の光 — 像を天から照らす */
  {
    float beam=exp(-abs(uv.x)*(7.5-2.5*f))*smoothstep(.55,-.42,uv.y);
    col+=mix(vec3(.92,.86,.72),uElem,.35)*beam*uShaft*.12;
    /* 床のうけひかり */
    col+=mix(vec3(.92,.86,.72),uElem,.35)*exp(-abs(uv.y-.32)*9.)*exp(-abs(uv.x)*3.)*uShaft*.05;
  }
  /* 光塵 — 気配の粒 */
  {
    for(int L=0;L<2;L++){
      float sc=(L==0)?7.:13.;
      vec2 pp=uv*sc; pp.y-=t*(.05+.03*float(L));
      vec2 id=floor(pp), gv=fract(pp)-.5;
      float n=hash21(id+float(L)*17.);
      if(n<.30){
        vec2 off=(vec2(hash21(id+3.1),hash21(id+7.7))-.5)*.7;
        off+= .08*vec2(sin(t*.7+n*40.),cos(t*.5+n*30.));
        float d=length(gv-off);
        float tw=.5+.5*sin(t*(1.+n*2.5)+n*40.);
        col+=uElem*smoothstep(.05,.0,d)*tw*.22;
      }
    }
  }
  /* 気の峰 — 環にそって回る、ひとつの明るみとその対岸の翳り */
  float w=cos(th-uQi)*.5+.5;
  col+=uElem*w*exp(-abs(rr-.40)*10.)*.16;
  col-= (1.-w)*exp(-abs(rr-.40)*10.)*.05;
  col*=1.-.44*pow(rr*1.24,2.2);
  col+=(hash21(frag+fract(t)*61.7)-.5)*.03;
  col=col/(1.+col*.12);
  col=pow(max(col,0.),vec3(.96));
  fragColor=vec4(col,1.);
}`;
function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uTime","uBgA","uBgB","uElem","uQi","uShaft"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
let BGA=hex2rgb(V.bg[0]), BGB=hex2rgb(V.bg[1]);

/* ============================================================
   リングキャンバス
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||1280; H=window.innerHeight||800;
  glCanvas.width=Math.max(2,W*DPR); glCanvas.height=Math.max(2,H*DPR);
  ringCanvas.width=Math.max(2,W*DPR); ringCanvas.height=Math.max(2,H*DPR);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   状態 — 主変数は「時」（時間・連続値・現地時刻起点）
============================================================ */
function nowHour(){
  const d=new Date();
  return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600 + Math.floor(Date.now()/864e5)*24;
}
let tHour=(q0.get("hour")?parseFloat(q0.get("hour")):nowHour());
let targetHour=null;
let flowIdx=1;
const FLOWS=[{n:"止",v:0},{n:"ゆるり",v:.25},{n:"疾く",v:3}];   // 時間/秒
/* からだの光の見かけの刻 — 追いつけない速さでは歩調を落とす（一日＝最短12秒） */
let dispHour=null, lastTHour=tHour;
const CHASE=2;   // 時間/秒
let gazeMer=-1, gazeT=-1e9;
let lastInteract=-1e9;

function cx(){ return W/2; } function cy(){ return H/2; }
function ringR(){ return Math.min(W*.315, H*.36); }

/* ============================================================
   入力
============================================================ */
function angleOf(e){
  const x=(e.clientX??e.touches?.[0]?.clientX)-cx();
  const y=(e.clientY??e.touches?.[0]?.clientY)-cy();
  return Math.atan2(y,x);
}
let dragging=false,dragA=0,dragMoved=0;
ringCanvas.addEventListener("pointerdown",e=>{
  dragging=true; dragMoved=0; dragA=angleOf(e); targetHour=null;
  lastInteract=performance.now(); ringCanvas.classList.add("dragging");
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleOf(e);
  let da=a-dragA;
  if(da>Math.PI)da-=TAU; if(da<-Math.PI)da+=TAU;
  dragA=a; dragMoved+=Math.abs(da);
  tHour += da/TAU*24;                     // 一周＝一日
  lastInteract=performance.now();
});
ringCanvas.addEventListener("pointerup",e=>{
  dragging=false; ringCanvas.classList.remove("dragging");
  lastInteract=performance.now();
  if(dragMoved<.02){
    const x=e.clientX-cx(), y=e.clientY-cy();
    const rr=Math.hypot(x,y), R=ringR();
    if(rr>R*.62&&rr<R*1.5){
      const a=Math.atan2(y,x);
      const h=(((a*180/Math.PI+90)/360*24)%24+24)%24;   // 画面角→時刻
      gazeMer=activeIdx(h);
      gazeT=performance.now()/1000;
    }
  }
  hideHint();
});
window.addEventListener("wheel",e=>{
  tHour+=e.deltaY*3e-3; targetHour=null;
  lastInteract=performance.now(); hideHint();
},{passive:true});
const segBtns=[...document.querySelectorAll("#flowSeg .btn")];
function setFlow(i){
  flowIdx=i;
  segBtns.forEach((b,j)=>b.classList.toggle("on",j===i));
}
segBtns.forEach((b,i)=>b.addEventListener("click",()=>{ setFlow(i); hideHint(); }));
window.addEventListener("keydown",e=>{
  if(e.key===" "){ setFlow(flowIdx===0?1:0); e.preventDefault(); }
  hideHint();
});
document.getElementById("nowBtn").addEventListener("click",()=>{
  targetHour=nowHour(); lastInteract=performance.now(); hideHint();
});
const varBtn=document.getElementById("varBtn");
varBtn.textContent="見た目　"+V.name;
varBtn.addEventListener("click",()=>{
  vKey=VORDER[(VORDER.indexOf(vKey)+1)%VORDER.length];
  V=VARIANTS[vKey];
  BGA=hex2rgb(V.bg[0]); BGB=hex2rgb(V.bg[1]);
  document.body.style.background=V.bg[0];
  varBtn.textContent="見た目　"+V.name;
});
document.body.style.background=V.bg[0];
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500); }
setTimeout(hideHint,16000);

/* ============================================================
   からだ — 銅人。面でつくる立像（Catmull-Romスプライン）
============================================================ */
function crPoint(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return [
    .5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)];
}
function crCurve(pts,n=10){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let s=0;s<n;s++) out.push(crPoint(p0,p1,p2,p3,s/n));
  }
  out.push(pts[pts.length-1]);
  return out;
}
/* 閉じたCatmull-Rom（継ぎ目のない一筆の輪郭） */
function crClosed(pts,n=8){
  const out=[], N=pts.length;
  for(let i=0;i<N;i++){
    const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
    for(let s=0;s<n;s++) out.push(crPoint(p0,p1,p2,p3,s/n));
  }
  return out;
}
/* 立ち姿の輪郭 — 頭からつま先まで一筆。右半身の点列（B単位） */
const RSIDE=[
 [.045,-.995],[.088,-.945],[.094,-.875],[.076,-.800],[.040,-.762],
 [.042,-.715],[.078,-.686],[.158,-.656],[.228,-.616],[.256,-.552],
 [.258,-.462],[.240,-.352],[.226,-.242],[.207,-.132],[.216,-.052],
 [.196,.033],[.170,-.018],[.165,-.118],[.174,-.248],[.181,-.360],
 [.170,-.476],[.148,-.502],[.132,-.382],[.118,-.282],[.149,-.162],
 [.168,-.062],[.158,.040],[.136,.180],[.113,.340],[.108,.440],
 [.100,.560],[.079,.740],[.076,.840],[.136,.893],[.046,.900],
 [.043,.780],[.052,.600],[.049,.440],[.053,.280],[.029,.100],
];
function statuePath(c,B){
  const pts=[[0,-1.0*B]];   // ←×Bを忘れると頭頂が体の中心に落ち、胴が裂ける
  for(const [x,y] of RSIDE) pts.push([x*B,y*B]);
  pts.push([0,.046*B]);
  for(let i=RSIDE.length-1;i>=0;i--) pts.push([-RSIDE[i][0]*B,RSIDE[i][1]*B]);
  const P=crClosed(pts,7);
  c.beginPath();
  c.moveTo(P[0][0],P[0][1]);
  for(const q of P) c.lineTo(q[0],q[1]);
  c.closePath();
}
/* 銅人像のキャッシュ — 一枚に焼いてから合成する（内側にグローが濁らないように） */
let bodyCache=null, bodyCacheKey="";
function getBodyCache(B){
  const key=vKey+"|"+Math.round(B)+"|"+DPR;
  if(bodyCache && bodyCacheKey===key) return bodyCache;
  const bc=hex2rgb(V.body);
  const pad=B*.30;
  const wCss=B*.95+pad*2, hCss=B*1.96+pad*2;
  const topY=-1.0*B-pad;
  const cnv=document.createElement("canvas");
  cnv.width=Math.ceil(wCss*DPR); cnv.height=Math.ceil(hCss*DPR);
  const c=cnv.getContext("2d");
  c.setTransform(DPR,0,0,DPR, wCss/2*DPR, -topY*DPR);
  /* 青銅の地 — 一筆の輪郭を塗る */
  c.fillStyle=rgbCss([bc[0]*.55,bc[1]*.52,bc[2]*.46],1);
  statuePath(c,B);
  c.fill();
  /* 上からの光 — 像のなかだけに陰影を焼く */
  c.globalCompositeOperation="source-atop";
  const g=c.createLinearGradient(0,-1.0*B,0,.95*B);
  g.addColorStop(0, rgbCss([bc[0],bc[1],bc[2]],.52));
  g.addColorStop(.45,rgbCss([bc[0],bc[1],bc[2]],.16));
  g.addColorStop(1, "rgba(0,0,0,.16)");
  c.fillStyle=g;
  c.fillRect(-wCss/2,topY,wCss,hCss);
  /* 胸の温み */
  const g2=c.createRadialGradient(0,-.40*B,0, 0,-.40*B,.55*B);
  g2.addColorStop(0,rgbCss(bc,.20));
  g2.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=g2;
  c.fillRect(-wCss/2,topY,wCss,hCss);
  /* 縁の内側にまるみの影 */
  c.strokeStyle="rgba(0,0,0,.32)";
  c.lineWidth=B*.05;
  statuePath(c,B);
  c.stroke();
  c.globalCompositeOperation="source-over";
  /* 輪郭のリムライト */
  c.strokeStyle=rgbCss(bc,.34);
  c.lineWidth=1;
  statuePath(c,B);
  c.stroke();
  bodyCache={cnv,wCss,hCss,topY};
  bodyCacheKey=key;
  return bodyCache;
}
/* 経路（二次ベジェ）: [始点, 制御点, 終点]。一筆の体格に沿う */
function merPath(kind,B,s){
  const chest=[0,-.45*B], hand=[.19*B*s,.03*B], headTop=[0,-.99*B], foot=[.09*B*s,.87*B];
  switch(kind){
    case 0: return [chest,[.27*B*s,-.28*B],hand];        // 胸→手（腕にそって）
    case 1: return [hand,[.44*B*s,-.56*B],headTop];      // 手→頭（外をめぐって）
    case 2: return [headTop,[.10*B*s,-.06*B],foot];      // 頭→足（体幹をくだる）
    case 3: return [foot,[-.10*B*s,.30*B],chest];        // 足→胸（内をのぼる）
  }
}
function qBez(P,t){
  const [A,C,Bp]=P, u=1-t;
  return [u*u*A[0]+2*u*t*C[0]+t*t*Bp[0], u*u*A[1]+2*u*t*C[1]+t*t*Bp[1]];
}
function strokeQ(P,t0,t1,seg=24){
  ctx.beginPath();
  for(let i=0;i<=seg;i++){
    const t=t0+(t1-t0)*i/seg;
    const [x,y]=qBez(P,t);
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

/* ============================================================
   リング描画
============================================================ */
function drawRing(now){
  const nowSec=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=ringR();
  const ink=(a)=>`rgba(236,229,216,${a})`;

  const h=((dispHour%24)+24)%24;          // 見かけの刻
  const idx=activeIdx(h);
  const frac=activeFrac(h);
  const mer=MER[idx];
  const ec=elemCol(mer.e);
  const qiAngle=hourAngle(h);              // 気の峰の画面角

  ctx.save();
  ctx.translate(cx(),cy());

  /* --- シーソーの直径（峰と谷） --- */
  {
    ctx.strokeStyle=ink(.10); ctx.lineWidth=.8;
    ctx.beginPath();
    ctx.moveTo(Math.cos(qiAngle)*R*.97,Math.sin(qiAngle)*R*.97);
    ctx.lineTo(-Math.cos(qiAngle)*R*.97,-Math.sin(qiAngle)*R*.97);
    ctx.stroke();
  }

  /* --- 24時間盤 --- */
  ctx.strokeStyle=ink(.42); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  ctx.strokeStyle=ink(.15);
  ctx.beginPath(); ctx.arc(0,0,R*.985,0,TAU); ctx.stroke();
  /* 目盛：24時間×さらに半分 */
  for(let i=0;i<48;i++){
    const a=hourAngle(i/2);
    const major=(i%2===0);
    const bound=(i%4===2);   // 経の境（奇数時）
    ctx.strokeStyle=ink(bound?.55:(major?.35:.18));
    ctx.lineWidth=bound?1.2:.6;
    const r1=bound?R*.940:(major?R*.955:R*.965);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*R*.985,Math.sin(a)*R*.985);
    ctx.stroke();
  }
  /* 刻の名（子卯午酉だけ） */
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=`400 ${Math.max(9,R*.036)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  for(const [k,hh] of [["子",0],["卯",6],["午",12],["酉",18]]){
    const a=hourAngle(hh);
    ctx.fillStyle=ink(hh===0?.5:.28);
    ctx.fillText(k, Math.cos(a)*R*1.30, Math.sin(a)*R*1.30);
  }

  /* --- 経のセグメントと名 --- */
  const nameSize=Math.max(12,R*.062);
  for(let k=0;k<12;k++){
    const m=MER[k];
    const hc=(m.s+1)%24;
    const a=hourAngle(hc);
    /* 峰からの距離で明るさ（シーソー） */
    let dh=Math.abs(((hc-h)%24+24)%24); dh=Math.min(dh,24-dh);
    const bright=.5+.5*Math.cos(dh/12*Math.PI);
    const isCur=(k===idx);
    const isGaze=(k===gazeMer && nowSec-gazeT<10);
    const col=elemCol(m.e);
    /* 弧 — いまの経は流れる破線で「動き」を見せる */
    const a0=hourAngle(m.s), a1=hourAngle(m.s+2);
    ctx.strokeStyle=rgbCss(col,.10+.55*bright);
    ctx.lineWidth=isCur?3:1.6;
    if(isCur){
      ctx.setLineDash([9,6]);
      ctx.lineDashOffset=-nowSec*18;
      ctx.shadowColor=rgbCss(col,.9); ctx.shadowBlur=12;
    }else if(m.ghost){ ctx.setLineDash([4,5]); }
    ctx.beginPath(); ctx.arc(0,0,R,a0+.015,a1-.015); ctx.stroke();
    ctx.shadowBlur=0; ctx.setLineDash([]); ctx.lineDashOffset=0;
    /* 名（放射方向・外周から内へ）。三焦だけ輪郭のみ＝かたちがない */
    const chars=m.n.split("");
    ctx.save(); ctx.rotate(a);
    const fillCol=isCur?rgbCss(col,1):(isGaze?ink(.95):ink(.38+.34*bright));
    ctx.font=`${isCur?600:400} ${nameSize*(isCur?1.12:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    if(isCur){ ctx.shadowColor=rgbCss(col,.9); ctx.shadowBlur=10; }
    for(let c=0;c<chars.length;c++){
      const rr=R*1.09+nameSize*(.5+(chars.length-1-c)*1.14);
      ctx.save(); ctx.translate(rr,0); ctx.rotate(Math.PI/2);
      if(m.ghost){
        ctx.strokeStyle=fillCol; ctx.lineWidth=1;
        ctx.strokeText(chars[c],0,0);
      }else{
        ctx.fillStyle=fillCol;
        ctx.fillText(chars[c],0,0);
      }
      ctx.restore();
    }
    ctx.shadowBlur=0;
    /* 陰陽の印：陰=内向きの点、陽=外向きの点 */
    ctx.fillStyle=rgbCss(col,.28+.5*bright);
    const rr2=(m.yy==="陰")?R*.905:R*1.035;
    ctx.beginPath(); ctx.arc(rr2,0,1.8,0,TAU); ctx.fill();
    ctx.restore();
  }
  /* 表裏の橋（6組・同じ五行の隣り同士） */
  for(let p=0;p<6;p++){
    const mA=MER[p*2], col=elemCol(mA.e);
    const aM=hourAngle((mA.s+2)%24);   // 組の境目
    ctx.strokeStyle=rgbCss(col,.30);
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(0,0,R*.875, aM-.20, aM+.20);
    ctx.stroke();
  }

  /* --- うなりのふたつの波 — 体の12.0時間と、海の記憶12.4時間。重なる日だけ金にとける --- */
  {
    const Rb=R*.70;
    const ph1=(tHour/H1)*TAU, ph2=(tHour/H2)*TAU;
    let dph=Math.abs(((ph1-ph2)%TAU+TAU)%TAU); dph=Math.min(dph,TAU-dph);
    const meetGlow=Math.max(0,1-dph/.5);          // めぐり会いの輝き
    const amp=R*.022;
    for(const [ph,colHex] of [[ph1,V.wave1],[ph2,V.wave2]]){
      const c=hex2rgb(meetGlow>.5?V.accent:colHex);
      ctx.strokeStyle=rgbCss(c,.30+.45*meetGlow);
      ctx.lineWidth=1.1+meetGlow;
      ctx.shadowColor=rgbCss(c,.8); ctx.shadowBlur=4+10*meetGlow;
      ctx.beginPath();
      for(let i=0;i<=180;i++){
        const th=i/180*TAU;
        const r=Rb+amp*Math.sin(2*th-ph);
        const x=Math.cos(th)*r, y=Math.sin(th)*r;
        if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
      ctx.shadowBlur=0;
    }
  }

  /* --- からだ（銅人）と気のながれ --- */
  {
    const B=R*.44;
    const round=Math.floor(idx/4);
    const side=[1,-1,1][round];
    const bc=hex2rgb(V.body);
    ctx.save();
    ctx.translate(0,-R*.07);
    /* 背後の臓の字 — 気配だけの大文字 */
    ctx.font=`500 ${mer.n.length>1?R*.44:R*.60}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillStyle=ink(.05);
    ctx.fillText(mer.n,0,-R*.04);
    /* 立像 — 一枚に焼いた銅人を、外側だけのオーラとともに置く */
    const cache=getBodyCache(B);
    ctx.shadowColor=rgbCss(bc,.40);
    ctx.shadowBlur=B*.14;
    ctx.drawImage(cache.cnv, -cache.wCss/2, cache.topY, cache.wCss, cache.hCss);
    ctx.shadowBlur=0;
    /* 経穴の星座 — 体がほのかに瞬く */
    {
      const PTS=[[0,-.99],[0,-.45],[0,-.08]];
      const SYM=[[.228,-.616],[.21,-.35],[.19,.03],[.12,-.28],[.16,-.06],
                 [.08,.34],[.075,.60],[.075,.82],[.11,.89]];
      let pi=0;
      const star=(x,y)=>{
        const tw=.5+.5*Math.sin(nowSec*(.45+(pi%5)*.19)+pi*2.39);
        ctx.fillStyle=ink(.10+.28*tw);
        ctx.beginPath(); ctx.arc(x*B,y*B,1.0+1.1*tw,0,TAU); ctx.fill();
        pi++;
      };
      for(const [x,y] of PTS) star(x,y);
      for(const [x,y] of SYM){ star(x,y); star(-x,y); }
    }
    /* 丹田 — 内から灯る */
    {
      const g=ctx.createRadialGradient(0,-.08*B,0, 0,-.08*B,.10*B);
      g.addColorStop(0,rgbCss(ec,.55));
      g.addColorStop(1,rgbCss(ec,0));
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(0,-.08*B,.10*B,0,TAU); ctx.fill();
    }
    /* 今のめぐり（4拍子）を薄く＋経穴の点列 */
    ctx.strokeStyle=rgbCss(ec,.14);
    ctx.lineWidth=1;
    for(let kind=0;kind<4;kind++) strokeQ(merPath(kind,B,side),0,1);
    const Pcur=merPath(mer.path,B,side);
    for(let kind=0;kind<4;kind++){
      const P=merPath(kind,B,side);
      for(let d=1;d<=4;d++){
        const t=d/5;
        const [x,y]=qBez(P,t);
        let lit=0;
        if(kind===mer.path){
          const dd=Math.abs(t-frac);
          lit=Math.max(0,1-dd*6)* (t<=frac?1:.35);
        }
        ctx.fillStyle=rgbCss(ec,.14+.7*lit);
        if(lit>.3){ ctx.shadowColor=rgbCss(ec,.9); ctx.shadowBlur=6; }
        ctx.beginPath(); ctx.arc(x,y,1.5+1.6*lit,0,TAU); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    /* いまの経のながれ — 通った道が灯る */
    ctx.strokeStyle=rgbCss(ec,.55);
    ctx.lineWidth=1.6;
    ctx.shadowColor=rgbCss(ec,.9); ctx.shadowBlur=8;
    strokeQ(Pcur,0,Math.max(.02,frac));
    ctx.shadowBlur=0;
    /* 気の川 — 粒の流れが体をゆく */
    for(let k=25;k>=0;k--){
      const tk=frac-k*.02;
      if(tk<0) continue;
      const [x,y]=qBez(Pcur,tk);
      const [x2,y2]=qBez(Pcur,Math.min(1,tk+.01));
      let nx=-(y2-y), ny=(x2-x);
      const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
      const wob=Math.sin(nowSec*2.6+k*1.31)*B*.014*(k/26);
      const fade=1-k/26;
      ctx.fillStyle=rgbCss(ec,.12+.78*fade);
      if(k<3){ ctx.shadowColor=rgbCss(ec,1); ctx.shadowBlur=14; }
      ctx.beginPath(); ctx.arc(x+nx*wob,y+ny*wob,.7+2.9*fade,0,TAU); ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.restore();
    /* 盤から体への糸 — いまの経の座から、道のはじまりへ */
    {
      const aC=hourAngle((mer.s+1)%24);
      const sx=Math.cos(aC)*R*.945, sy=Math.sin(aC)*R*.945;
      const P0=merPath(mer.path,B,side)[0];
      const ex=P0[0], ey=P0[1]-R*.07;
      const mx=(sx+ex)/2*1.22, my=(sy+ey)/2*1.22;
      ctx.strokeStyle=rgbCss(ec,.24);
      ctx.lineWidth=1;
      ctx.setLineDash([2,6]); ctx.lineDashOffset=-nowSec*12;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset=0;
    }
  }

  /* --- ことば --- */
  const gz=(gazeMer>=0 && nowSec-gazeT<10);
  const m2=gz?MER[gazeMer]:mer;
  const col2=elemCol(m2.e);
  const FT=(s)=>`${s}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  /* 部分ごとに色を変えて中央ぞろえで描く */
  function drawParts(y,size,parts){
    ctx.font=`400 ${FT(size)}`;
    ctx.textAlign="left";
    let total=0;
    for(const p of parts) total+=ctx.measureText(p.t).width;
    let x=-total/2;
    for(const p of parts){
      ctx.fillStyle=p.c;
      ctx.fillText(p.t,x,y);
      x+=ctx.measureText(p.t).width;
    }
    ctx.textAlign="center";
  }
  const FROMTO=[["胸","手"],["手","頭"],["頭","足"],["足","胸"]];
  const kokuName=KOKU[Math.floor((((m2.s+1)%24)+1)/2)%12];
  const oppIdx=(idx+6)%12;

  ctx.font=`500 ${FT(R*.066)}`;
  ctx.fillStyle=rgbCss(col2,.95);
  ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=14;
  ctx.fillText(m2.full,0,R*.435);
  ctx.shadowBlur=0;
  ctx.font=`400 ${FT(R*.040)}`;
  ctx.fillStyle=ink(.55);
  ctx.fillText(`${GOGYO[m2.e].n}の${m2.yy}　${kokuName}の刻　${m2.s}時〜${(m2.s+2)%24}時`,0,R*.505);
  if(gz){
    const [f1,f2]=FROMTO[m2.path];
    drawParts(R*.575,R*.042,[
      {t:"ながれ　",c:ink(.45)},{t:`${f1} → ${f2}`,c:rgbCss(col2,.9)},
    ]);
    ctx.font=`400 ${FT(R*.038)}`;
    ctx.fillStyle=m2.ghost?rgbCss(hex2rgb(V.accent),.75):ink(.44);
    ctx.fillText(m2.ghost?"名あって形なし——実の臓器を持たない、ただひとつの腑":`乱れるとき：${m2.emo}`,0,R*.645);
  }else{
    const [f1,f2]=FROMTO[mer.path];
    drawParts(R*.575,R*.042,[
      {t:"ながれ　",c:ink(.45)},{t:`${f1} → ${f2}`,c:rgbCss(ec,.92)},
      {t:"　　谷にしずむのは　",c:ink(.36)},{t:MER[oppIdx].n,c:ink(.62)},
    ]);
    const hh=Math.floor(h), mm=Math.floor((h-hh)*60);
    ctx.font=`500 ${FT(R*.048)}`;
    ctx.fillStyle=ink(.80);
    ctx.fillText(`${hh}時${String(mm).padStart(2,"0")}分`,0,R*.65);
    const rel=((tHour/H1-tHour/H2)%1+1)%1;
    const meet=((1-rel)%1)*BEAT/24;
    drawParts(R*.715,R*.030,[
      {t:"● ",c:rgbCss(hex2rgb(V.wave1),.7)},{t:"体の波 12.0時間　　",c:ink(.38)},
      {t:"● ",c:rgbCss(hex2rgb(V.wave2),.7)},{t:"海の記憶 12.4時間",c:ink(.38)},
      {t:`　—　めぐり会いまで ${meet.toFixed(1)} 日`,c:ink(.30)},
    ]);
  }

  ctx.restore();
}

/* ============================================================
   メインループ
============================================================ */
window.__kei={
  setHour(x){ tHour=x; targetHour=null; },
  get(){ return {tHour, disp:dispHour, active:MER[activeIdx(((dispHour%24)+24)%24)].n}; },
};

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  if(!dragging && targetHour===null && now-lastInteract>3000){
    tHour+=FLOWS[flowIdx].v*dt;
  }
  if(targetHour!==null){
    tHour+=(targetHour-tHour)*Math.min(1,dt*3.5);
    if(Math.abs(targetHour-tHour)<.002){ tHour=targetHour; targetHour=null; }
  }
  /* 見かけの刻 — 実際を追いかける。向きは時の流れに揃える */
  {
    const actual=tHour;
    if(dispHour===null) dispHour=actual;
    const dir=(tHour>=lastTHour)?1:-1;
    lastTHour=tHour;
    const maxStep=CHASE*dt;
    if(dir>=0){
      const d=actual-dispHour;
      dispHour+=Math.min(Math.max(d,0),maxStep);
      if(d<0) dispHour=actual;              // 逆行の割り込みは素直に従う
    }else{
      const d=dispHour-actual;
      dispHour-=Math.min(Math.max(d,0),maxStep);
      if(d<0) dispHour=actual;
    }
  }

  const h=((dispHour%24)+24)%24;
  const ec=elemCol(MER[activeIdx(h)].e);
  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uBgA,BGA[0],BGA[1],BGA[2]);
  gl.uniform3f(U.uBgB,BGB[0],BGB[1],BGB[2]);
  gl.uniform3f(U.uElem,ec[0],ec[1],ec[2]);
  gl.uniform1f(U.uQi,-hourAngle(h));   // GLはy上向きなので符号を返す
  gl.uniform1f(U.uShaft,V.shaft);
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawRing(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
