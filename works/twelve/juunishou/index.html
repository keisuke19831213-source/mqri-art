<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>十二将 | 「12」第七作</title>
<style>
  :root{ --ink:#ece5d8; --ink-dim:rgba(236,229,216,.55); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0d0b09; }
  body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #gl{ z-index:0; } #ring{ z-index:1; cursor:grab; }
  #ring.dragging{ cursor:grabbing; }
  #title{
    position:fixed; top:28px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.55em;
    font-size:clamp(14px,1.6vmin,19px); font-weight:500;
    color:var(--ink-dim); text-shadow:0 0 18px rgba(0,0,0,.5); pointer-events:none;
  }
  #title b{ font-weight:600; color:var(--ink); font-size:1.35em; letter-spacing:.4em; }
  #series{
    position:fixed; bottom:24px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.4em;
    font-size:11px; color:rgba(236,229,216,.30); pointer-events:none;
  }
  #ctrl{ position:fixed; top:26px; right:30px; z-index:2;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .btn{
    font-family:inherit; font-size:12px; letter-spacing:.3em; text-indent:.3em;
    color:var(--ink-dim); background:transparent;
    border:1px solid rgba(236,229,216,.26); border-radius:999px;
    padding:8px 16px 7px 16px; cursor:pointer;
    transition:color .4s, border-color .4s, background .4s; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); border-color:rgba(236,229,216,.6); background:rgba(236,229,216,.06); }
  .btn.on{ color:var(--ink); border-color:rgba(236,229,216,.7); background:rgba(236,229,216,.08); }
  .seg{ display:flex; gap:8px; }
  .btn.small{ padding:7px 13px 6px 13px; font-size:11px; letter-spacing:.22em; text-indent:.22em; }
  #hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:11px; letter-spacing:.3em; color:rgba(236,229,216,.34);
    white-space:nowrap; pointer-events:none; transition:opacity 1.2s;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ring"></canvas>
<div id="title"><b>十二将</b>　天の円盤は、地の方盤の上をすべる</div>
<div id="series">「12」— 円環の連作　第七</div>
<div id="ctrl">
  <div class="seg" id="flowSeg">
    <button class="btn small" data-f="0">止</button>
    <button class="btn small on" data-f="1">ゆるり</button>
    <button class="btn small" data-f="2">疾く</button>
  </div>
  <button class="btn" id="nowBtn">いまへ</button>
  <button class="btn" id="varBtn">見た目　玄式</button>
</div>
<div id="hint">まわして刻をめぐる — 将をタップ / 太陽の印はつねに今の刻を指す / 天空だけ、かたちがない</div>

<script>
"use strict";

/* ============================================================
   十二天将 — 本座の支の順（子=0）。yy:吉凶
============================================================ */
const SHO=[
 {n:"玄武", yomi:"げんぶ",     e:"水", yy:"凶",   mean:"盗難・忘失・闇",       fig:"亀と蛇の、からみあう影", shin:true},
 {n:"貴人", yomi:"きじん",     e:"土", yy:"最吉", mean:"尊貴・救済・福徳",     fig:"天乙——もっとも貴き主神"},
 {n:"青龍", yomi:"せいりゅう", e:"木", yy:"最吉", mean:"発展・財宝・富貴",     fig:"東をまもる龍", shin:true},
 {n:"六合", yomi:"りくごう",   e:"木", yy:"吉",   mean:"和合・縁むすび・慶事", fig:"調和の霊"},
 {n:"勾陳", yomi:"こうちん",   e:"土", yy:"凶",   mean:"滞り・争い・遅延",     fig:"金色の蛇の軍神"},
 {n:"騰蛇", yomi:"とうだ",     e:"火", yy:"凶",   mean:"驚怖・怪異・火",       fig:"炎をまとう、翼ある蛇"},
 {n:"朱雀", yomi:"すざく",     e:"火", yy:"凶",   mean:"口舌・文書・訴訟",     fig:"南をまもる火の鳥", shin:true},
 {n:"太常", yomi:"たいじょう", e:"土", yy:"吉",   mean:"礼儀・衣服・四季",     fig:"おだやかな文官"},
 {n:"白虎", yomi:"びゃっこ",   e:"金", yy:"凶",   mean:"殺傷・病・迅速",       fig:"西をまもる虎", shin:true},
 {n:"太陰", yomi:"たいいん",   e:"金", yy:"吉",   mean:"秘密・隠匿・月",       fig:"知恵ぶかい老女"},
 {n:"天空", yomi:"てんくう",   e:"土", yy:"凶",   mean:"虚偽・消失・空虚",     fig:"姿なき霧——実体をもたない", ghost:true},
 {n:"天后", yomi:"てんこう",   e:"水", yy:"吉",   mean:"慈愛・女性・航海",     fig:"海の女神"},
];
const SHI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const GESSHO=["神后","大吉","功曹","太衝","天罡","太乙","勝光","小吉","伝送","従魁","河魁","登明"];  // 月将名（支ごと）
const TAU=Math.PI*2;

/* 暦 — 十二月と同じ基準 */
const YEAR=365.2422;
const J0=Date.UTC(2026,0,1)/864e5;
function solarDeg(t){ return (((t-J0)/YEAR*360)%360+360)%360; }
/* 月将（太陽の在る辰）— 黄経＝暦年角から春分(3/20≒77.9°)を引く。白羊(λ0°)=戌将 から連続にくだる */
function gesshoCont(t){
  const lam=((solarDeg(t)-77.9)%360+360)%360;
  return ((10 - lam/30)%12+12)%12;
}
/* 時支 — 連続 */
function jishiCont(t){
  const d=new Date(t*864e5);
  const h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;   // 現地の刻
  return (((h+1)%24)/2)%12;
}

/* ============================================================
   見た目3案
============================================================ */
const VORDER=["A","B","C"];
const VARIANTS={
  A:{ name:"玄式", bg:["#0d0b09","#1e1810"], accent:"#d9b56a", kichi:"#e4cb8a", kyo:"#a86450",
      board:"#8a7350" },
  B:{ name:"朱盤", bg:["#150a07","#331409"], accent:"#e09a60", kichi:"#ecd9a0", kyo:"#c06a48",
      board:"#a06038" },
  C:{ name:"銀墨", bg:["#0b0d10","#191e24"], accent:"#c9d2dc", kichi:"#dce6ee", kyo:"#8a97a8",
      board:"#76808e" },
};
const q0=new URLSearchParams(location.search);
let vKey=VARIANTS[(q0.get("v")||"A").toUpperCase()]?(q0.get("v")||"A").toUpperCase():"A";
let V=VARIANTS[vKey];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function rgbCss(c,a=1){ return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`; }
function smooth(t){ return t*t*(3-2*t); }
function yyCol(s){ return hex2rgb(s.yy==="凶"?V.kyo:V.kichi); }

/* ============================================================
   WebGL2 — 灯下の式盤
============================================================ */
const glCanvas=document.getElementById("gl");
const gl=glCanvas.getContext("webgl2",{antialias:false,alpha:false});
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position=vec4(aPos,0.,1.); }`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uBgA,uBgB,uAcc;
uniform float uPlate;      // 天盤の回転（ラジアン）
out vec4 fragColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; } return v; }
void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;
  float t=uTime;
  float rr=length(uv), th=atan(uv.y,uv.x);
  vec2 p=uv*2.0;
  vec2 q=vec2(fbm(p+t*.009), fbm(p+vec2(5.2,1.3)-t*.007));
  float f=fbm(p+2.3*q);
  vec3 col=mix(uBgA,uBgB,clamp(f*f*2.2,0.,1.));
  col=mix(col,uAcc*.45,clamp(length(q)*.7,0.,1.)*.22);
  /* 灯——上からひとつの明かり */
  col+=uAcc*exp(-abs(uv.x)*5.5)*smoothstep(.55,-.40,uv.y)*.09;
  /* 天盤のまわる気配 */
  float w=cos(th*1.0-uPlate)*.5+.5;
  col+=uAcc*w*exp(-abs(rr-.30)*10.)*.08;
  /* 光塵 */
  {
    vec2 pp=uv*10.; pp.y-=t*.03;
    vec2 id=floor(pp), gv=fract(pp)-.5;
    float n=hash21(id);
    if(n<.22){
      vec2 off=(vec2(hash21(id+3.1),hash21(id+7.7))-.5)*.7;
      float d=length(gv-off);
      float tw=.5+.5*sin(t*(1.+n*2.)+n*40.);
      col+=uAcc*smoothstep(.045,.0,d)*tw*.18;
    }
  }
  col*=1.-.44*pow(rr*1.24,2.2);
  col+=(hash21(frag+fract(t)*61.7)-.5)*.03;
  col=col/(1.+col*.12);
  col=pow(max(col,0.),vec3(.96));
  fragColor=vec4(col,1.);
}`;
function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uTime","uBgA","uBgB","uAcc","uPlate"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
let BGA=hex2rgb(V.bg[0]), BGB=hex2rgb(V.bg[1]);

/* ============================================================
   リングキャンバス
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||1280; H=window.innerHeight||800;
  glCanvas.width=Math.max(2,W*DPR); glCanvas.height=Math.max(2,H*DPR);
  ringCanvas.width=Math.max(2,W*DPR); ringCanvas.height=Math.max(2,H*DPR);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   状態 — 主変数は「日」（通日・連続値）
============================================================ */
let tDay=(q0.get("day")?parseFloat(q0.get("day")):Date.now()/864e5);
let targetDay=null;
let flowIdx=1;
const FLOWS=[{n:"止",v:0},{n:"ゆるり",v:.012},{n:"疾く",v:.16}];   // 日/秒
let gazeG=-1, gazeT=-1e9;
let lastInteract=-1e9;

function cx(){ return W/2; } function cy(){ return H/2; }
function ringR(){ return Math.min(W*.315, H*.36); }
/* 角度→方盤のふち（天円地方の写像） */
function sqPt(a,S){
  const c=Math.cos(a), s=Math.sin(a);
  const m=Math.max(Math.abs(c),Math.abs(s));
  return [c/m*S, s/m*S];
}

/* ============================================================
   入力
============================================================ */
function angleOf(e){
  const x=(e.clientX??e.touches?.[0]?.clientX)-cx();
  const y=(e.clientY??e.touches?.[0]?.clientY)-cy();
  return Math.atan2(y,x);
}
let dragging=false,dragA=0,dragMoved=0;
ringCanvas.addEventListener("pointerdown",e=>{
  dragging=true; dragMoved=0; dragA=angleOf(e); targetDay=null;
  lastInteract=performance.now(); ringCanvas.classList.add("dragging");
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleOf(e);
  let da=a-dragA;
  if(da>Math.PI)da-=TAU; if(da<-Math.PI)da+=TAU;
  dragA=a; dragMoved+=Math.abs(da);
  tDay += da/TAU;                        // 一周＝一日
  lastInteract=performance.now();
});
ringCanvas.addEventListener("pointerup",e=>{
  dragging=false; ringCanvas.classList.remove("dragging");
  lastInteract=performance.now();
  if(dragMoved<.02){
    const x=e.clientX-cx(), y=e.clientY-cy();
    const rr=Math.hypot(x,y), R=ringR();
    if(rr>R*.40&&rr<R*1.45){
      const aDeg=Math.atan2(y,x)*180/Math.PI;
      const u=(((aDeg+90)/30)%12+12)%12;
      const off=jishiCont(tDay)-gesshoCont(tDay);
      const g=Math.floor(((u-off)%12+12)%12+.5)%12;   // その席に来ている将
      gazeG=Math.round(((u-off)%12+12)%12)%12;
      gazeT=performance.now()/1000;
    }
  }
  hideHint();
});
window.addEventListener("wheel",e=>{
  tDay+=e.deltaY*5e-5; targetDay=null;
  lastInteract=performance.now(); hideHint();
},{passive:true});
const segBtns=[...document.querySelectorAll("#flowSeg .btn")];
function setFlow(i){
  flowIdx=i;
  segBtns.forEach((b,j)=>b.classList.toggle("on",j===i));
}
segBtns.forEach((b,i)=>b.addEventListener("click",()=>{ setFlow(i); hideHint(); }));
window.addEventListener("keydown",e=>{
  if(e.key===" "){ setFlow(flowIdx===0?1:0); e.preventDefault(); }
  hideHint();
});
document.getElementById("nowBtn").addEventListener("click",()=>{
  targetDay=Date.now()/864e5; lastInteract=performance.now(); hideHint();
});
const varBtn=document.getElementById("varBtn");
varBtn.textContent="見た目　"+V.name;
varBtn.addEventListener("click",()=>{
  vKey=VORDER[(VORDER.indexOf(vKey)+1)%VORDER.length];
  V=VARIANTS[vKey];
  BGA=hex2rgb(V.bg[0]); BGB=hex2rgb(V.bg[1]);
  document.body.style.background=V.bg[0];
  varBtn.textContent="見た目　"+V.name;
});
document.body.style.background=V.bg[0];
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500); }
setTimeout(hideHint,16000);

/* ============================================================
   北斗七星（天盤の中央・柄杓） — おおよその座標
============================================================ */
const HOKUTO=[[-.30,-.10],[-.16,-.14],[-.03,-.12],[.08,-.05],[.10,.08],[.22,.13],[.34,.10]];

/* ============================================================
   描画
============================================================ */
const dateFmt=(t)=>{
  const d=new Date(t*864e5);
  return `西暦 ${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日　${d.getHours()}時${String(d.getMinutes()).padStart(2,"0")}分`;
};
function drawRing(now){
  const nowSec=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=ringR();
  const ink=(a)=>`rgba(236,229,216,${a})`;
  const acc=hex2rgb(V.accent), brd=hex2rgb(V.board);

  const jc=jishiCont(tDay), gc=gesshoCont(tDay);
  const jishi=Math.floor(jc)%12;
  const gessho=Math.ceil(gc-1e-9)%12;   // 月将は宮に入った瞬間から次の宮まで同じ名

  const offU=jc-gc;                                  // 天盤のずれ（支単位）
  const teiza=Math.round(((0-offU)%12+12)%12)%12;    // 帝座（真北）に立つ将

  ctx.save();
  ctx.translate(cx(),cy());
  ctx.textAlign="center"; ctx.textBaseline="middle";

  /* --- 地盤（方） --- */
  const S=R*.92;
  ctx.strokeStyle=rgbCss(brd,.75); ctx.lineWidth=1.4;
  ctx.strokeRect(-S,-S,S*2,S*2);
  ctx.strokeStyle=rgbCss(brd,.28); ctx.lineWidth=.8;
  ctx.strokeRect(-S*.94,-S*.94,S*1.88,S*1.88);
  /* 支の目盛（ふちに36） */
  for(let i=0;i<36;i++){
    const a=(-90+i*10-15)*Math.PI/180;
    const p1=sqPt(a,S*.94), p2=sqPt(a,S);
    ctx.strokeStyle=rgbCss(brd,(i%3===0)?.55:.22);
    ctx.lineWidth=(i%3===0)?1.1:.6;
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
  }
  /* 十二支（方盤のふち・正立） */
  const shiSize=Math.max(12,R*.062);
  for(let k=0;k<12;k++){
    const a=(-90+k*30)*Math.PI/180;
    const p=sqPt(a,S*1.09);
    const isJ=(k===jishi);
    ctx.fillStyle=isJ?rgbCss(acc,1):ink(.52);
    if(isJ){ ctx.shadowColor=rgbCss(acc,.9); ctx.shadowBlur=10; }
    ctx.font=`${isJ?600:400} ${shiSize*(isJ?1.15:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillText(SHI[k],p[0],p[1]);
    ctx.shadowBlur=0;
  }
  /* 方位と鬼門 */
  ctx.font=`400 ${Math.max(9,R*.038)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  for(const [nm,deg] of [["北",0],["東",90],["南",180],["西",270]]){
    const a=(-90+deg)*Math.PI/180;
    const p=sqPt(a,S*1.22);
    ctx.fillStyle=ink(deg===0?.55:.30);
    ctx.fillText(nm,p[0],p[1]);
  }
  {
    const p=sqPt((-45)*Math.PI/180,S*1.17);
    ctx.fillStyle="rgba(160,70,58,.35)";
    ctx.fillText("鬼門",p[0],p[1]);
  }

  /* --- 天盤（円・まわる） --- */
  const Rp=R*.56;
  ctx.strokeStyle=ink(.40); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(0,0,Rp,0,TAU); ctx.stroke();
  ctx.strokeStyle=ink(.14);
  ctx.beginPath(); ctx.arc(0,0,Rp*.965,0,TAU); ctx.stroke();
  /* 将たち */
  const gSize=Math.max(11,R*.052);
  for(let g=0;g<12;g++){
    const s=SHO[g];
    const a=(-90+(g+offU)*30)*Math.PI/180;
    const isT=(g===teiza);
    const isGaze=(g===gazeG && nowSec-gazeT<10);
    const col=yyCol(s);
    /* 席の点 */
    ctx.fillStyle=rgbCss(col,isT?.95:.45);
    if(isT){ ctx.shadowColor=rgbCss(col,.9); ctx.shadowBlur=8; }
    ctx.beginPath(); ctx.arc(Math.cos(a)*Rp,Math.sin(a)*Rp, s.shin?2.6:1.8,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    /* 名（放射方向・盤とともにまわる・外周から内へ） */
    const chars=s.n.split("");
    ctx.save(); ctx.rotate(a);
    const alpha=isT?1:(isGaze?.95:.62);
    const fillCol=isT?rgbCss(col,1):(isGaze?ink(.95):rgbCss(col,.70));
    if(isT){ ctx.shadowColor=rgbCss(col,.9); ctx.shadowBlur=10; }
    ctx.font=`${isT?600:400} ${gSize*(isT?1.12:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    for(let c2=0;c2<chars.length;c2++){
      const rr=Rp*.72+gSize*(0-(c2-(chars.length-1))*1.10);
      ctx.save(); ctx.translate(rr,0); ctx.rotate(Math.PI/2);
      if(s.ghost){ ctx.strokeStyle=fillCol; ctx.lineWidth=1; ctx.strokeText(chars[c2],0,0); }
      else{ ctx.fillStyle=fillCol; ctx.fillText(chars[c2],0,0); }
      ctx.restore();
    }
    ctx.restore();
    ctx.shadowBlur=0;
  }
  /* 太陽の印（月将の座）— つねに今の刻を指す */
  {
    const a=(-90+jc*30)*Math.PI/180;
    const x=Math.cos(a)*Rp*1.06, y=Math.sin(a)*Rp*1.06;
    ctx.fillStyle="rgba(240,200,120,.95)";
    ctx.shadowColor="rgba(240,200,120,.9)"; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(x,y,4,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    /* 指し糸 — 太陽から時支へ */
    const p=sqPt(a,S*.99);
    ctx.strokeStyle="rgba(240,200,120,.30)";
    ctx.lineWidth=1;
    ctx.setLineDash([2,5]); ctx.lineDashOffset=-nowSec*8;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(p[0],p[1]); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset=0;
  }
  /* 帝座の印（真北の頂） */
  {
    ctx.fillStyle=rgbCss(acc,.9);
    ctx.beginPath();
    ctx.moveTo(0,-Rp*1.13-8);
    ctx.lineTo(-4.5,-Rp*1.13-17);
    ctx.lineTo(4.5,-Rp*1.13-17);
    ctx.closePath(); ctx.fill();
  }

  /* --- 北斗七星（天盤の中央・盤とともにまわる） --- */
  {
    ctx.save();
    ctx.rotate(offU*30*Math.PI/180);
    const sc=Rp*.52;
    ctx.strokeStyle=ink(.28); ctx.lineWidth=.9;
    ctx.beginPath();
    for(let i=0;i<HOKUTO.length;i++){
      const [hx,hy]=HOKUTO[i];
      if(i===0) ctx.moveTo(hx*sc,hy*sc); else ctx.lineTo(hx*sc,hy*sc);
    }
    ctx.stroke();
    for(let i=0;i<HOKUTO.length;i++){
      const [hx,hy]=HOKUTO[i];
      const tw=.6+.4*Math.sin(nowSec*(0.7+i*.23)+i*2.1);
      ctx.fillStyle=ink(.35+.4*tw);
      ctx.beginPath(); ctx.arc(hx*sc,hy*sc,1.2+1.2*tw,0,TAU); ctx.fill();
    }
    ctx.restore();
  }

  /* --- ことば --- */
  const FT=(s)=>`${s}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  const gz=(gazeG>=0 && nowSec-gazeT<10);
  const g=gz?SHO[gazeG]:SHO[teiza];
  const gcol=yyCol(g);
  ctx.fillStyle=ink(.95);
  ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=18;
  ctx.font=`500 ${FT(R*.088)}`;
  if(g.ghost){ ctx.strokeStyle=ink(.9); ctx.lineWidth=1.4; ctx.strokeText(g.n,0,R*.645); }
  else ctx.fillText(g.n,0,R*.645);
  ctx.shadowBlur=0;
  ctx.font=`400 ${FT(R*.036)}`;
  ctx.fillStyle=ink(.55);
  ctx.fillText(`${g.yomi}　—　${g.fig}`,0,R*.72);
  ctx.font=`400 ${FT(R*.038)}`;
  ctx.fillStyle=rgbCss(gcol,.92);
  ctx.fillText(`${g.yy}　${g.mean}`,0,R*.775);
  if(gz){
    ctx.font=`400 ${FT(R*.032)}`;
    ctx.fillStyle=ink(.42);
    ctx.fillText(g.ghost?"十二将でただひとり、実体を持たない——だから輪郭だけで書かれる":`${g.shin?"四神のひとり。":""}本座は ${SHI[SHO.indexOf(g)]} の方角`,0,R*.835);
  }else{
    /* ひとつの席に、ふたつの文を交互に */
    const slot=Math.floor(nowSec/9)%2;
    const ph=(nowSec%9)/9;
    const fade=Math.min(1,Math.min(ph,1-ph)*9);
    ctx.font=`400 ${FT(R*.033)}`;
    ctx.fillStyle=ink(.58*fade+.06);
    ctx.fillText(slot===0
      ?`月将 ${GESSHO[gessho]}（${SHI[gessho]}）を、時支 ${SHI[jishi]} にかさねる——帝座に ${SHO[teiza].n}`
      :`盤は一日にひとめぐり——月将のぶん、毎日およそ 1° とじ残す。とじるのは一年後`,0,R*.835);
    ctx.font=`500 ${FT(R*.040)}`;
    ctx.fillStyle=ink(.80);
    ctx.fillText(dateFmt(tDay),0,R*.895);
  }

  ctx.restore();
  return offU;
}

/* ============================================================
   メインループ
============================================================ */
window.__shou={
  setDay(d){ tDay=d; targetDay=null; },
  get(){ return {tDay, jishi:SHI[Math.floor(jishiCont(tDay))%12], gessho:GESSHO[Math.floor(gesshoCont(tDay))%12],
                 teiza:SHO[Math.round((((0-(jishiCont(tDay)-gesshoCont(tDay)))%12)+12)%12)%12].n}; },
};

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  if(!dragging && targetDay===null && now-lastInteract>3000){
    tDay+=FLOWS[flowIdx].v*dt;
  }
  if(targetDay!==null){
    tDay+=(targetDay-tDay)*Math.min(1,dt*3.5);
    if(Math.abs(targetDay-tDay)<.00005){ tDay=targetDay; targetDay=null; }
  }

  const offU=jishiCont(tDay)-gesshoCont(tDay);
  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uBgA,BGA[0],BGA[1],BGA[2]);
  gl.uniform3f(U.uBgB,BGB[0],BGB[1],BGB[2]);
  const acc=hex2rgb(V.accent);
  gl.uniform3f(U.uAcc,acc[0],acc[1],acc[2]);
  gl.uniform1f(U.uPlate,-offU*30*Math.PI/180);
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawRing(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
