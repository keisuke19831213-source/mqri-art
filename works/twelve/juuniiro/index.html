<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>十二色 | 「12」第八作</title>
<style>
  :root{ --ink:#ece5d8; --ink-dim:rgba(236,229,216,.55); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#111013; }
  body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #gl{ z-index:0; } #ring{ z-index:1; cursor:grab; }
  #ring.dragging{ cursor:grabbing; }
  #title{
    position:fixed; top:28px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.55em;
    font-size:clamp(14px,1.6vmin,19px); font-weight:500;
    color:var(--ink-dim); text-shadow:0 0 18px rgba(0,0,0,.5); pointer-events:none;
  }
  #title b{ font-weight:600; color:var(--ink); font-size:1.35em; letter-spacing:.4em; }
  #series{
    position:fixed; bottom:24px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.4em;
    font-size:11px; color:rgba(236,229,216,.30); pointer-events:none;
  }
  #ctrl{ position:fixed; top:26px; right:30px; z-index:2;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .btn{
    font-family:inherit; font-size:12px; letter-spacing:.3em; text-indent:.3em;
    color:var(--ink-dim); background:transparent;
    border:1px solid rgba(236,229,216,.26); border-radius:999px;
    padding:8px 16px 7px 16px; cursor:pointer;
    transition:color .4s, border-color .4s, background .4s; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); border-color:rgba(236,229,216,.6); background:rgba(236,229,216,.06); }
  .btn.on{ color:var(--ink); border-color:rgba(236,229,216,.7); background:rgba(236,229,216,.08); }
  .seg{ display:flex; gap:8px; }
  .btn.small{ padding:7px 13px 6px 13px; font-size:11px; letter-spacing:.22em; text-indent:.22em; }
  #hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:11px; letter-spacing:.3em; color:rgba(236,229,216,.34);
    white-space:nowrap; pointer-events:none; transition:opacity 1.2s;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ring"></canvas>
<div id="title"><b>十二色</b>　まざれば、灰にとける</div>
<div id="series">「12」— 円環の連作　第八</div>
<div id="ctrl">
  <div class="seg" id="flowSeg">
    <button class="btn small" data-f="0">止</button>
    <button class="btn small on" data-f="1">ゆるり</button>
    <button class="btn small" data-f="2">疾く</button>
  </div>
  <button class="btn" id="chordBtn">和音　補色</button>
  <button class="btn" id="varBtn">見た目　玄</button>
</div>
<div id="hint">まわして配色をめぐる — 色をタップすると残像 / 赤紫と紫は、虹に無い色</div>

<script>
"use strict";

/* ============================================================
   イッテンの12色相 — 黄を頂に、紫を底に（軽い色は浮き、重い色は沈む）
   tier: 0=一次色 1=二次色 2=三次色 / spectral: 虹にある色か
============================================================ */
const HUES=[
 {n:"黄",     kana:"き",           hex:"#F5C81E", tier:0, spectral:true},
 {n:"黄橙",   kana:"きだいだい",   hex:"#F0A01E", tier:2, spectral:true},
 {n:"橙",     kana:"だいだい",     hex:"#E97E20", tier:1, spectral:true},
 {n:"赤橙",   kana:"あかだいだい", hex:"#E25A28", tier:2, spectral:true},
 {n:"赤",     kana:"あか",         hex:"#D93A34", tier:0, spectral:true},
 {n:"赤紫",   kana:"あかむらさき", hex:"#B03A6E", tier:2, spectral:false},
 {n:"紫",     kana:"むらさき",     hex:"#7A3E8E", tier:1, spectral:false},
 {n:"青紫",   kana:"あおむらさき", hex:"#4A4A9E", tier:2, spectral:true},
 {n:"青",     kana:"あお",         hex:"#2E6AAE", tier:0, spectral:true},
 {n:"青緑",   kana:"あおみどり",   hex:"#23887E", tier:2, spectral:true},
 {n:"緑",     kana:"みどり",       hex:"#3A9A4A", tier:1, spectral:true},
 {n:"黄緑",   kana:"きみどり",     hex:"#9AB33A", tier:2, spectral:true},
];
/* 和音（イッテンの計算尺） — offs: 頂点の相対位置（色相番号） */
const CHORDS=[
 {n:"補色",     offs:[0,6],       says:"たがいを最も強くかがやかせ——まざれば、無彩の灰にしずむ"},
 {n:"三和音",   offs:[0,4,8],     says:"正三角形——安定と変化の、つりあい"},
 {n:"分裂補色", offs:[0,5,7],     says:"補色の刺激を、ふたつに割ってやわらげる"},
 {n:"四和音",   offs:[0,3,6,9],   says:"正方形——二組の補色。もっともにぎやかで、あやうい"},
 {n:"六和音",   offs:[0,2,4,6,8,10], says:"六角形——ゆたかさの果て。ほとんど白い光"},
];
const TAU=Math.PI*2;
function hueA(i){ return (-90+i*30)*Math.PI/180; }   // 黄=真上

/* ============================================================
   見た目3案 — 地はどれも無彩（色をいちばん立てる壁）
============================================================ */
const VORDER=["A","B","C"];
const VARIANTS={
  A:{ name:"玄",   bg:["#111013","#1c1a1e"], accent:"#d9b56a" },
  B:{ name:"煤",   bg:["#17150f","#262218"], accent:"#cbb27a" },
  C:{ name:"鈍色", bg:["#14171a","#22262b"], accent:"#aab6c2" },
};
const q0=new URLSearchParams(location.search);
let vKey=VARIANTS[(q0.get("v")||"A").toUpperCase()]?(q0.get("v")||"A").toUpperCase():"A";
let V=VARIANTS[vKey];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function rgbCss(c,a=1){ return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`; }
const RGB=HUES.map(h=>hex2rgb(h.hex));
function lightness(i){ const c=RGB[i]; return .30*c[0]+.55*c[1]+.15*c[2]; }

/* ============================================================
   WebGL2 — 画廊の壁（無彩の夜）
============================================================ */
const glCanvas=document.getElementById("gl");
const gl=glCanvas.getContext("webgl2",{antialias:false,alpha:false});
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position=vec4(aPos,0.,1.); }`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uBgA,uBgB;
out vec4 fragColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; } return v; }
void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;
  float t=uTime;
  float rr=length(uv);
  vec2 p=uv*2.0;
  vec2 q=vec2(fbm(p+t*.008), fbm(p+vec2(5.2,1.3)-t*.006));
  float f=fbm(p+2.3*q);
  vec3 col=mix(uBgA,uBgB,clamp(f*f*2.2,0.,1.));
  /* 画廊の灯 */
  col+=vec3(.9,.87,.8)*exp(-abs(uv.x)*5.0)*smoothstep(.55,-.40,uv.y)*.06;
  col*=1.-.42*pow(rr*1.22,2.2);
  col+=(hash21(frag+fract(t)*61.7)-.5)*.028;
  col=col/(1.+col*.12);
  col=pow(max(col,0.),vec3(.96));
  fragColor=vec4(col,1.);
}`;
function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uTime","uBgA","uBgB"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
let BGA=hex2rgb(V.bg[0]), BGB=hex2rgb(V.bg[1]);

/* ============================================================
   リングキャンバス
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||1280; H=window.innerHeight||800;
  glCanvas.width=Math.max(2,W*DPR); glCanvas.height=Math.max(2,H*DPR);
  ringCanvas.width=Math.max(2,W*DPR); ringCanvas.height=Math.max(2,H*DPR);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   状態 — 主変数は「和音の位相」（0..1で環をひとまわり）
============================================================ */
let phase=(q0.get("p")?parseFloat(q0.get("p")):0);
let chordIdx=0;
let flowIdx=1;
const FLOWS=[{n:"止",v:0},{n:"ゆるり",v:1/90},{n:"疾く",v:1/15}];   // 周/秒
let gazeH=-1, gazeT=-1e9;
let lastInteract=-1e9;

function cx(){ return W/2; } function cy(){ return H/2; }
function ringR(){ return Math.min(W*.315, H*.36); }

/* ============================================================
   入力
============================================================ */
function angleOf(e){
  const x=(e.clientX??e.touches?.[0]?.clientX)-cx();
  const y=(e.clientY??e.touches?.[0]?.clientY)-cy();
  return Math.atan2(y,x);
}
let dragging=false,dragA=0,dragMoved=0;
ringCanvas.addEventListener("pointerdown",e=>{
  dragging=true; dragMoved=0; dragA=angleOf(e);
  lastInteract=performance.now(); ringCanvas.classList.add("dragging");
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleOf(e);
  let da=a-dragA;
  if(da>Math.PI)da-=TAU; if(da<-Math.PI)da+=TAU;
  dragA=a; dragMoved+=Math.abs(da);
  phase=((phase+da/TAU)%1+1)%1;
  lastInteract=performance.now();
});
ringCanvas.addEventListener("pointerup",e=>{
  dragging=false; ringCanvas.classList.remove("dragging");
  lastInteract=performance.now();
  if(dragMoved<.02){
    const x=e.clientX-cx(), y=e.clientY-cy();
    const rr=Math.hypot(x,y), R=ringR();
    if(rr>R*.72&&rr<R*1.45){
      const aDeg=Math.atan2(y,x)*180/Math.PI;
      gazeH=Math.floor(((aDeg+90+15)%360+360)%360/30)%12;
      gazeT=performance.now()/1000;
    }
  }
  hideHint();
});
window.addEventListener("wheel",e=>{
  phase=((phase+e.deltaY*2e-4)%1+1)%1;
  lastInteract=performance.now(); hideHint();
},{passive:true});
const segBtns=[...document.querySelectorAll("#flowSeg .btn")];
function setFlow(i){
  flowIdx=i;
  segBtns.forEach((b,j)=>b.classList.toggle("on",j===i));
}
segBtns.forEach((b,i)=>b.addEventListener("click",()=>{ setFlow(i); hideHint(); }));
window.addEventListener("keydown",e=>{
  if(e.key===" "){ setFlow(flowIdx===0?1:0); e.preventDefault(); }
  hideHint();
});
const chordBtn=document.getElementById("chordBtn");
chordBtn.addEventListener("click",()=>{
  chordIdx=(chordIdx+1)%CHORDS.length;
  chordBtn.textContent="和音　"+CHORDS[chordIdx].n;
  hideHint();
});
const varBtn=document.getElementById("varBtn");
varBtn.textContent="見た目　"+V.name;
varBtn.addEventListener("click",()=>{
  vKey=VORDER[(VORDER.indexOf(vKey)+1)%VORDER.length];
  V=VARIANTS[vKey];
  BGA=hex2rgb(V.bg[0]); BGB=hex2rgb(V.bg[1]);
  document.body.style.background=V.bg[0];
  varBtn.textContent="見た目　"+V.name;
});
document.body.style.background=V.bg[0];
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500); }
setTimeout(hideHint,16000);

/* ============================================================
   描画
============================================================ */
function drawRing(now){
  const nowSec=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=ringR();
  const ink=(a)=>`rgba(236,229,216,${a})`;
  const acc=hex2rgb(V.accent);
  const chord=CHORDS[chordIdx];
  const rootCont=phase*12;                        // 和音の根音（連続）
  const verts=chord.offs.map(o=>(rootCont+o)%12); // 頂点（連続の色相位置）
  const vertCols=verts.map(v=>{
    const i=Math.floor(v)%12, j=(i+1)%12, f=v-Math.floor(v);
    return [RGB[i][0]+(RGB[j][0]-RGB[i][0])*f, RGB[i][1]+(RGB[j][1]-RGB[i][1])*f, RGB[i][2]+(RGB[j][2]-RGB[i][2])*f];
  });
  /* 混色 — 灰になるかは「環の上でのつりあい」で決める（イッテンの環は顔料の環。RGB平均では灰にならない） */
  let sx=0,sy=0;
  for(const v of verts){ const a=hueA(v); sx+=Math.cos(a); sy+=Math.sin(a); }
  const bal=Math.hypot(sx,sy)/verts.length;       // 0=完全なつりあい
  const gray=1-Math.min(1,bal*2.2);               // 1=灰
  const mixRaw=[0,0,0];
  for(const c of vertCols){ mixRaw[0]+=c[0]; mixRaw[1]+=c[1]; mixRaw[2]+=c[2]; }
  mixRaw[0]/=vertCols.length; mixRaw[1]/=vertCols.length; mixRaw[2]/=vertCols.length;
  const luma=.30*mixRaw[0]+.55*mixRaw[1]+.15*mixRaw[2];
  /* つりあうほど、混色は無彩へとける */
  const mix=[mixRaw[0]+(luma-mixRaw[0])*gray, mixRaw[1]+(luma-mixRaw[1])*gray, mixRaw[2]+(luma-mixRaw[2])*gray];
  /* かたむきの向き（つりあわないとき、どの色が勝っているか） */
  const domHue=Math.round((((Math.atan2(sy,sx)*180/Math.PI+90)/30)%12+12))%12;

  ctx.save();
  ctx.translate(cx(),cy());
  ctx.textAlign="center"; ctx.textBaseline="middle";

  /* --- 色の花びら — 和音の色が中心へ寄り、加法でまざる --- */
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(let k=0;k<verts.length;k++){
    const a=hueA(verts[k]);
    const li=lightness(Math.floor(verts[k])%12);
    const px=Math.cos(a)*R*.40, py=Math.sin(a)*R*.40-(li-.45)*R*.10;   // 軽い色はすこし浮く
    const rad=R*.40;
    const g=ctx.createRadialGradient(px,py,0,px,py,rad);
    const c=vertCols[k];
    g.addColorStop(0,rgbCss(c,.62));
    g.addColorStop(1,rgbCss(c,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(px,py,rad,0,TAU); ctx.fill();
  }
  ctx.restore();

  /* --- 色相環（12の弧） --- */
  const band0=R*.86, band1=R*1.0;
  for(let i=0;i<12;i++){
    const a0=hueA(i)-15*Math.PI/180+.008, a1=hueA(i)+15*Math.PI/180-.008;
    ctx.fillStyle=HUES[i].hex;
    ctx.beginPath();
    ctx.arc(0,0,band1,a0,a1);
    ctx.arc(0,0,band0,a1,a0,true);
    ctx.closePath(); ctx.fill();
    /* 一次色は外へすこし太い印 */
    if(HUES[i].tier===0){
      ctx.strokeStyle=HUES[i].hex;
      ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(0,0,R*1.025,a0+.03,a1-.03); ctx.stroke();
    }
  }
  /* 色名（放射方向・外周から内へ） */
  const nameSize=Math.max(12,R*.058);
  for(let i=0;i<12;i++){
    const a=hueA(i);
    const isV=verts.some(v=>Math.abs(((v-i)%12+12)%12)<.5 || Math.abs(((v-i)%12+12)%12)>11.5);
    const isG=(i===gazeH && nowSec-gazeT<7);
    const chars=HUES[i].n.split("");
    ctx.save(); ctx.rotate(a);
    ctx.fillStyle=isV?ink(.95):(isG?ink(.9):ink(.40));
    if(isV){ ctx.shadowColor=HUES[i].hex; ctx.shadowBlur=10; }
    ctx.font=`${isV?600:400} ${nameSize*(isV?1.1:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    for(let c2=0;c2<chars.length;c2++){
      const rr=R*1.10+nameSize*(.5+(chars.length-1-c2)*1.12);
      ctx.save(); ctx.translate(rr,0); ctx.rotate(Math.PI/2);
      ctx.fillText(chars[c2],0,0);
      ctx.restore();
    }
    ctx.restore();
    ctx.shadowBlur=0;
  }

  /* --- 金継ぎ — 虹に無い二色（赤紫・紫）のうえに、環をとじる金の脈 --- */
  {
    const aS=hueA(5)-15*Math.PI/180, aE=hueA(7)-15*Math.PI/180;
    const N=26;
    const breath=.45+.25*Math.sin(nowSec*.8);
    ctx.strokeStyle=rgbCss(acc,breath);
    ctx.lineWidth=1.4;
    ctx.shadowColor=rgbCss(acc,.8); ctx.shadowBlur=6;
    ctx.beginPath();
    for(let i=0;i<=N;i++){
      const t=i/N;
      const a=aS+(aE-aS)*t;
      const jag=Math.sin(t*29.7)*.028+Math.sin(t*13.3+2.1)*.022;
      const rr=R*(.93+jag);
      const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  /* --- ダビデの星（一次の三角と二次の逆三角・うすく） --- */
  for(const [tier,alpha] of [[0,.14],[1,.10]]){
    ctx.strokeStyle=ink(alpha); ctx.lineWidth=.9;
    ctx.beginPath();
    let first=true;
    for(let i=0;i<12;i++){
      if(HUES[i].tier!==tier) continue;
      const a=hueA(i);
      const x=Math.cos(a)*R*.80, y=Math.sin(a)*R*.80;
      if(first){ ctx.moveTo(x,y); first=false; } else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
  }

  /* --- 和音の多角形（計算尺・まわる） --- */
  {
    ctx.strokeStyle=ink(.75);
    ctx.lineWidth=1.6;
    ctx.shadowColor=ink(.6); ctx.shadowBlur=8;
    ctx.beginPath();
    for(let k=0;k<=verts.length;k++){
      const a=hueA(verts[k%verts.length]);
      const x=Math.cos(a)*R*.83, y=Math.sin(a)*R*.83;
      if(k===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    if(verts.length===2){ /* 直径はそのまま */ }
    ctx.stroke();
    ctx.shadowBlur=0;
    /* 頂点の珠 */
    for(let k=0;k<verts.length;k++){
      const a=hueA(verts[k]);
      ctx.fillStyle=rgbCss(vertCols[k],1);
      ctx.strokeStyle=ink(.85); ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(Math.cos(a)*R*.83,Math.sin(a)*R*.83,4.2,0,TAU); ctx.fill(); ctx.stroke();
    }
  }

  /* --- 中心の灰 — まざった色 --- */
  {
    const rc=R*.135;
    const g=ctx.createRadialGradient(0,0,0,0,0,rc);
    g.addColorStop(0,rgbCss(mix,.92));
    g.addColorStop(1,rgbCss(mix,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,0,rc,0,TAU); ctx.fill();
    ctx.strokeStyle=ink(.30); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,rc*.62,0,TAU); ctx.stroke();
  }

  /* --- ことば --- */
  const FT=(s)=>`${s}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  const gz=(gazeH>=0 && nowSec-gazeT<7);
  if(gz){
    const e=nowSec-gazeT;
    const h=HUES[gazeH];
    const comp=HUES[(gazeH+6)%12];
    /* 残像 — 色を見つめ、目を閉じれば補色 */
    const showComp=(e>3.5);
    const c=showComp?hex2rgb(comp.hex):hex2rgb(h.hex);
    const al=showComp?Math.max(0,.55-(e-3.5)*.18):.92;
    ctx.fillStyle=rgbCss(c,al);
    ctx.beginPath(); ctx.arc(0,R*.52,R*.085,0,TAU); ctx.fill();
    ctx.fillStyle=ink(.95);
    ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=16;
    ctx.font=`500 ${FT(R*.095)}`;
    ctx.fillText(showComp?comp.n:h.n,0,R*.70);
    ctx.shadowBlur=0;
    ctx.font=`400 ${FT(R*.036)}`;
    ctx.fillStyle=ink(.55);
    ctx.fillText(showComp?"——目のなかに、補色がのこる（残像）":`${h.kana}　${h.tier===0?"一次色":h.tier===1?"二次色":"三次色"}${h.spectral?"":"　⚠ 虹には無い色"}`,0,R*.775);
    if(!showComp && !h.spectral){
      ctx.font=`400 ${FT(R*.031)}`;
      ctx.fillStyle=rgbCss(acc,.75);
      ctx.fillText("スペクトルは線。この色が、目のなかで環をとじる継ぎ目",0,R*.835);
    }
  }else{
    ctx.fillStyle=ink(.95);
    ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=16;
    ctx.font=`500 ${FT(R*.095)}`;
    ctx.fillText(chord.n,0,R*.52);
    ctx.shadowBlur=0;
    /* いまの色たち */
    const names=verts.map(v=>HUES[Math.round(v)%12].n).join("・");
    ctx.font=`400 ${FT(R*.042)}`;
    ctx.fillStyle=ink(.62);
    ctx.fillText(names,0,R*.60);
    ctx.font=`400 ${FT(R*.036)}`;
    ctx.fillStyle=ink(.48);
    ctx.fillText(chord.says,0,R*.665);
    /* まざりの判定 */
    ctx.font=`500 ${FT(R*.040)}`;
    ctx.fillStyle=gray>.66?ink(.75):rgbCss(RGB[domHue],1);
    ctx.fillText(gray>.66?"まざれば——灰。イッテンはこれを、調和と呼んだ":`わずかに、${HUES[domHue].n}の側へかたむいている`,0,R*.735);
    /* 金継ぎの文（交互） */
    const slot=Math.floor(nowSec/9)%2;
    const ph=(nowSec%9)/9;
    const fade=Math.min(1,Math.min(ph,1-ph)*9);
    ctx.font=`400 ${FT(R*.029)}`;
    ctx.fillStyle=ink(.32*fade+.04);
    ctx.fillText(slot===0
      ?"光のスペクトルは線であって、環ではない"
      :"赤紫と紫——虹に無い二色が、環を金継ぎでとじている",0,R*.80);
  }

  ctx.restore();
}

/* ============================================================
   メインループ
============================================================ */
window.__iro={
  setPhase(p){ phase=((p%1)+1)%1; },
  setChord(i){ chordIdx=i%CHORDS.length; chordBtn.textContent="和音　"+CHORDS[chordIdx].n; },
  get(){ return {phase,chord:CHORDS[chordIdx].n}; },
};

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  if(!dragging && now-lastInteract>3000){
    phase=((phase+FLOWS[flowIdx].v*dt)%1+1)%1;
  }

  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uBgA,BGA[0],BGA[1],BGA[2]);
  gl.uniform3f(U.uBgB,BGB[0],BGB[1],BGB[2]);
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawRing(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
