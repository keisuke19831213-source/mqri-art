<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>十二月精 | 「12」第九作</title>
<style>
  :root{ --ink:#ece5d8; --ink-dim:rgba(236,229,216,.55); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0a0d14; }
  body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #gl{ z-index:0; } #ring{ z-index:1; cursor:grab; }
  #ring.dragging{ cursor:grabbing; }
  #title{
    position:fixed; top:28px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.55em;
    font-size:clamp(14px,1.6vmin,19px); font-weight:500;
    color:var(--ink-dim); text-shadow:0 0 18px rgba(0,0,0,.5); pointer-events:none;
  }
  #title b{ font-weight:600; color:var(--ink); font-size:1.35em; letter-spacing:.4em; }
  #series{
    position:fixed; bottom:24px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.4em;
    font-size:11px; color:rgba(236,229,216,.30); pointer-events:none;
  }
  #ctrl{ position:fixed; top:26px; right:30px; z-index:2;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .btn{
    font-family:inherit; font-size:12px; letter-spacing:.3em; text-indent:.3em;
    color:var(--ink-dim); background:transparent;
    border:1px solid rgba(236,229,216,.26); border-radius:999px;
    padding:8px 16px 7px 16px; cursor:pointer;
    transition:color .4s, border-color .4s, background .4s; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); border-color:rgba(236,229,216,.6); background:rgba(236,229,216,.06); }
  .btn.on{ color:var(--ink); border-color:rgba(236,229,216,.7); background:rgba(236,229,216,.08); }
  .seg{ display:flex; gap:8px; }
  .btn.small{ padding:7px 13px 6px 13px; font-size:11px; letter-spacing:.22em; text-indent:.22em; }
  #hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:11px; letter-spacing:.3em; color:rgba(236,229,216,.34);
    white-space:nowrap; pointer-events:none; transition:opacity 1.2s;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ring"></canvas>
<div id="title"><b>十二月精</b>　杖をもつ月だけが、季節を統べる</div>
<div id="series">「12」— 円環の連作　第九</div>
<div id="ctrl">
  <div class="seg" id="flowSeg">
    <button class="btn small" data-f="0">止</button>
    <button class="btn small on" data-f="1">ゆるり</button>
    <button class="btn small" data-f="2">疾く</button>
  </div>
  <button class="btn" id="miracleBtn">奇跡</button>
  <button class="btn" id="varBtn">見た目　焚夜</button>
</div>
<div id="hint">月の精をタップ＝杖がわたる / 「奇跡」＝一月の娘の物語 / 環の外に、十三人目</div>

<script>
"use strict";

/* ============================================================
   十二の月の精 — チェコ語の月名と語源、齢の四層
   tier: 0冬=老人 1春=若者 2夏=青年 3秋=壮年
============================================================ */
const MON=[
 {jp:"一月",   cz:"Leden",    ety:"led——氷。すべてが凍りつく月",         tier:0},
 {jp:"二月",   cz:"Únor",     ety:"nořit——沈む。氷が水へしずみだす月",   tier:0},
 {jp:"三月",   cz:"Březen",   ety:"bříza——白樺。芽吹きと、はらみの月",   tier:1},
 {jp:"四月",   cz:"Duben",    ety:"dub——樫。緑のよみがえる月",           tier:1},
 {jp:"五月",   cz:"Květen",   ety:"květ——花。百花の月",                  tier:1},
 {jp:"六月",   cz:"Červen",   ety:"červená——赤。果実の赤らむ月",         tier:2},
 {jp:"七月",   cz:"Červenec", ety:"赤のきわみ。まなつの月",              tier:2},
 {jp:"八月",   cz:"Srpen",    ety:"srp——鎌。刈り入れの月",               tier:2},
 {jp:"九月",   cz:"Září",     ety:"záře——かがやき。秋の光の月",          tier:3},
 {jp:"十月",   cz:"Říjen",    ety:"říje——鹿の、恋の月",                  tier:3},
 {jp:"十一月", cz:"Listopad", ety:"list＋padat——葉の、落ちる月",         tier:3},
 {jp:"十二月", cz:"Prosinec", ety:"prosit——願う。冬至の光を乞う月",      tier:0},
];
const TIERS=[
 {n:"老人", col:[.80,.85,.92]},
 {n:"若者", col:[.62,.82,.56]},
 {n:"青年", col:[.90,.58,.34]},
 {n:"壮年", col:[.74,.60,.40]},
];
/* 炎の色（季節） */
const FIRECOL=[[.62,.74,.95],[.68,.90,.58],[1.0,.62,.28],[.95,.72,.34]];
const TAU=Math.PI*2;
function monA(i){ return (-90+i*30)*Math.PI/180; }   // 一月＝真上

/* 奇跡の幕 — 1月→3月→6月→9月→1月 */
const MIRACLE=[
 {m:0, say:"焚き火のそばへ——十三人目の娘が、雪の森からやってくる", item:null,     dur:4.2},
 {m:2, say:"「三月どの、どうか」——雪がとけ、すみれが咲く",         item:"すみれ", ic:[.55,.42,.78], dur:4.6},
 {m:5, say:"「六月どの、どうか」——夏がひらき、いちごが赤らむ",     item:"いちご", ic:[.88,.26,.30], dur:4.6},
 {m:8, say:"「九月どの、どうか」——秋がみのり、りんごは二つだけ",   item:"りんご", ic:[.86,.44,.24], dur:4.6},
 {m:0, say:"礼をつくす者に、季節はひらく——娘は森へ帰ってゆく",     item:null,     dur:4.6},
];

/* ============================================================
   見た目3案
============================================================ */
const VORDER=["A","B","C"];
const VARIANTS={
  A:{ name:"焚夜", bg:["#0a0d14","#141b28"], accent:"#e0b160" },
  B:{ name:"雪原", bg:["#0e1218","#1c2836"], accent:"#cddcec" },
  C:{ name:"樅森", bg:["#0a100c","#15241a"], accent:"#c8b070" },
};
const q0=new URLSearchParams(location.search);
let vKey=VARIANTS[(q0.get("v")||"A").toUpperCase()]?(q0.get("v")||"A").toUpperCase():"A";
let V=VARIANTS[vKey];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function rgbCss(c,a=1){ return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`; }
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
function hash1(n){ return ((Math.sin(n*127.1)*43758.5453)%1+1)%1; }

/* ============================================================
   WebGL2 — 森の夜と季節の粒
============================================================ */
const glCanvas=document.getElementById("gl");
const gl=glCanvas.getContext("webgl2",{antialias:false,alpha:false});
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position=vec4(aPos,0.,1.); }`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uBgA,uBgB,uFire;
uniform float uPh[4];       // 雪・花弁・光虫・落葉
uniform float uFlare;       // 炎のいきおい
out vec4 fragColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2 hash22(vec2 p){ float n=hash21(p); return vec2(n,hash21(p+n+7.31)); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; } return v; }
float snowL(vec2 uv,float t,float sc,float sp){
  vec2 p=uv*sc; p.y-=t*sp; p.x+=sin(t*.22+sc)*.35;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  vec2 off=(rn-.5)*.72;
  off.x+=.18*sin(t*(1.+rn.x)+rn.y*6.28);
  float d=length(gv-off);
  return smoothstep(.055+.045*rn.x,.0,d)*(.35+.65*rn.y);
}
float petalL(vec2 uv,float t,float sc,float sp){
  vec2 p=uv*sc; p.y-=t*sp; p.x+=t*sp*.45+sin(t*.3)*.4;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  if(rn.x>.6) return 0.;
  vec2 off=(rn-.5)*.6;
  vec2 q=rot(t*(rn.x-.5)*4.+rn.y*6.28)*(gv-off);
  q.x*=1.9;
  return smoothstep(.10,.02,length(q))*(.65+.35*sin(t*2.+rn.y*9.));
}
float fireflyL(vec2 uv,float t,float sc){
  vec2 p=uv*sc;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  if(rn.x>.18) return 0.;
  vec2 off=.62*vec2(sin(t*.4+rn.y*6.28), cos(t*.31+rn.x*6.28))*(.4+.6*rn.y);
  float d=length(gv-off);
  float pulse=pow(.5+.5*sin(t*(.9+rn.y)+rn.x*20.), 6.);
  return (.003/(d*d+.0015))*pulse;
}
float leafL(vec2 uv,float t,float sc,float sp){
  vec2 p=uv*sc; p.y-=t*sp; p.x+=sin(t*.45+p.y*.8)*.5;
  vec2 id=floor(p), gv=fract(p)-.5, rn=hash22(id);
  if(rn.x>.5) return 0.;
  vec2 q=rot(t*(rn.y-.5)*5.+rn.x*6.28)*(gv-(rn-.5)*.6);
  q.x*=1.6; q.y*=.9;
  return smoothstep(.12,.03,length(q))*(.7+.3*sin(t*3.+rn.x*12.));
}
void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;
  float t=uTime;
  float rr=length(uv);
  vec2 p=uv*2.0;
  vec2 q=vec2(fbm(p+t*.010), fbm(p+vec2(5.2,1.3)-t*.008));
  float f=fbm(p+2.3*q);
  vec3 col=mix(uBgA,uBgB,clamp(f*f*2.2,0.,1.));
  /* 焚き火のあかりが夜ににじむ */
  col+=uFire*exp(-rr*3.2)*.20*uFlare;
  col+=uFire*exp(-rr*9.)*.25*uFlare;
  /* 季節の粒 */
  if(uPh[0]>.004){ float s=snowL(uv,t,7.,.14)+snowL(uv+3.7,t,12.,.22)*.7;
    col+=s*uPh[0]*vec3(.92,.96,1.05)*.8; }
  if(uPh[1]>.004){ float pe=petalL(uv,t,6.,.18)+petalL(uv+2.9,t,10.,.28)*.7;
    col+=pe*uPh[1]*vec3(1.,.82,.86)*.85; }
  if(uPh[2]>.004){ float mask=smoothstep(.55,-.35,uv.y);
    float ff=fireflyL(uv,t,5.)+fireflyL(uv+4.2,t,8.)*.6;
    col+=clamp(ff,0.,2.)*uPh[2]*mask*vec3(.80,.95,.45); }
  if(uPh[3]>.004){ float l=leafL(uv,t,5.5,.20)+leafL(uv+6.3,t,9.,.30)*.7;
    col+=l*uPh[3]*vec3(.85,.55,.22)*.8; }
  col*=1.-.44*pow(rr*1.24,2.2);
  col+=(hash21(frag+fract(t)*61.7)-.5)*.03;
  col=col/(1.+col*.12);
  col=pow(max(col,0.),vec3(.96));
  fragColor=vec4(col,1.);
}`;
function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uTime","uBgA","uBgB","uFire","uFlare"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
U.uPh=gl.getUniformLocation(prog,"uPh[0]");
let BGA=hex2rgb(V.bg[0]), BGB=hex2rgb(V.bg[1]);

/* ============================================================
   リングキャンバス
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||1280; H=window.innerHeight||800;
  glCanvas.width=Math.max(2,W*DPR); glCanvas.height=Math.max(2,H*DPR);
  ringCanvas.width=Math.max(2,W*DPR); ringCanvas.height=Math.max(2,H*DPR);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   状態
============================================================ */
let reign=0;                  // 杖をもつ月
let passT=-1e9;               // 杖のわたった時刻(秒)
let lap=0;                    // めぐった年の数（閉じない円の種）
let flowIdx=1;
const FLOWS=[{n:"止",v:0},{n:"ゆるり",v:9},{n:"疾く",v:2}];   // 秒/月
let nextPassT=9;
let mode="tale";              // tale | miracle
let mirStep=0, mirT=-1e9;
let gazeM=-1, gazeT=-1e9, gazeGirl=false;
let lastInteract=-1e9;
let seasonPh=[1,0,0,0];       // 粒のなめらかな移りかわり

function cx(){ return W/2; } function cy(){ return H/2; }
function ringR(){ return Math.min(W*.315, H*.36); }

function passTo(m,nowSec){
  if(m===reign) return;
  if(m<reign) lap++;                       // 環をまたいだら、年がひとつすすむ
  reign=((m%12)+12)%12;
  passT=nowSec;
}

/* ============================================================
   入力
============================================================ */
ringCanvas.addEventListener("pointerdown",e=>{
  lastInteract=performance.now();
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointerup",e=>{
  lastInteract=performance.now();
  if(mode!=="tale"){ hideHint(); return; }
  const x=e.clientX-cx(), y=e.clientY-cy();
  const rr=Math.hypot(x,y), R=ringR();
  const nowSec=performance.now()/1000;
  /* 娘（十三人目） */
  const ga=(150)*Math.PI/180;
  const gx=Math.cos(ga)*R*.86, gy=Math.sin(ga)*R*.86;
  if(Math.hypot(x-gx,y-gy)<R*.10){ gazeGirl=true; gazeM=-1; gazeT=nowSec; hideHint(); return; }
  if(rr>R*.40&&rr<R*1.45){
    const aDeg=Math.atan2(y,x)*180/Math.PI;
    const m=Math.floor(((aDeg+90+15)%360+360)%360/30)%12;
    if(m===reign){ gazeM=m; gazeGirl=false; gazeT=nowSec; }
    else{ passTo(m,nowSec); gazeM=m; gazeGirl=false; gazeT=nowSec; nextPassT=nowSec+FLOWS[flowIdx].v||nowSec+9; }
  }
  hideHint();
});
const segBtns=[...document.querySelectorAll("#flowSeg .btn")];
function setFlow(i){
  flowIdx=i;
  segBtns.forEach((b,j)=>b.classList.toggle("on",j===i));
}
segBtns.forEach((b,i)=>b.addEventListener("click",()=>{ setFlow(i); hideHint(); }));
window.addEventListener("keydown",e=>{
  if(e.key===" "){ setFlow(flowIdx===0?1:0); e.preventDefault(); }
  hideHint();
});
document.getElementById("miracleBtn").addEventListener("click",()=>{
  if(mode==="tale"){ mode="miracle"; mirStep=0; mirT=performance.now()/1000;
    passTo(MIRACLE[0].m,performance.now()/1000); gazeM=-1; }
  hideHint();
});
const varBtn=document.getElementById("varBtn");
varBtn.textContent="見た目　"+V.name;
varBtn.addEventListener("click",()=>{
  vKey=VORDER[(VORDER.indexOf(vKey)+1)%VORDER.length];
  V=VARIANTS[vKey];
  BGA=hex2rgb(V.bg[0]); BGB=hex2rgb(V.bg[1]);
  document.body.style.background=V.bg[0];
  varBtn.textContent="見た目　"+V.name;
});
document.body.style.background=V.bg[0];
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500); }
setTimeout(hideHint,16000);

/* ============================================================
   月の精 — 頭巾の座像（面で組む）
============================================================ */
function drawSpirit(x,y,h,col,alpha,isReign,seed){
  ctx.save();
  ctx.translate(x,y);
  /* 頭巾のかたち */
  ctx.fillStyle=rgbCss(col,alpha);
  if(isReign){ ctx.shadowColor=rgbCss(col,.9); ctx.shadowBlur=14; }
  ctx.beginPath();
  ctx.moveTo(-.42*h,.50*h);
  ctx.quadraticCurveTo(-.50*h,-.02*h, -.22*h,-.26*h);
  ctx.quadraticCurveTo(-.12*h,-.52*h, 0,-.52*h);
  ctx.quadraticCurveTo(.12*h,-.52*h, .22*h,-.26*h);
  ctx.quadraticCurveTo(.50*h,-.02*h, .42*h,.50*h);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  /* 顔の翳 */
  ctx.fillStyle=`rgba(10,10,14,${alpha*.75})`;
  ctx.beginPath(); ctx.ellipse(0,-.27*h,.13*h,.15*h,0,0,TAU); ctx.fill();
  /* 目のひかり（めぐった年で、すこし顔がちがう） */
  const e1=hash1(seed*7.3+lap*3.1);
  ctx.fillStyle=rgbCss(col,alpha*(.5+.4*e1));
  ctx.beginPath(); ctx.arc(-.045*h,-.27*h,.018*h+.008*h*e1,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(.045*h,-.27*h,.018*h+.008*h*(1-e1),0,TAU); ctx.fill();
  ctx.restore();
}

/* ============================================================
   描画
============================================================ */
let fireParts=[];
function drawRing(now){
  const nowSec=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=ringR();
  const ink=(a)=>`rgba(236,229,216,${a})`;
  const acc=hex2rgb(V.accent);
  const tier=MON[reign].tier;
  const fcol=FIRECOL[tier];
  const flare=1+1.4*Math.exp(-Math.max(0,nowSec-passT)/1.3);

  ctx.save();
  ctx.translate(cx(),cy());
  ctx.textAlign="center"; ctx.textBaseline="middle";

  /* --- 齢の四層（弧と名） --- */
  const TIERSEG=[11,2,5,8];   // 冬・春・夏・秋のはじまりの月index
  for(let b=0;b<4;b++){
    const a0=monA(TIERSEG[b])-15*Math.PI/180+.05, a1=a0+Math.PI/2-.10;
    ctx.strokeStyle=rgbCss(TIERS[b].col,.22);
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,R*1.04,a0,a1); ctx.stroke();
  }

  /* --- 環の目盛 --- */
  ctx.strokeStyle=ink(.28); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  for(let i=0;i<36;i++){
    const a=(-90+i*10-15)*Math.PI/180;
    ctx.strokeStyle=ink((i%3===0)?.40:.16);
    ctx.lineWidth=(i%3===0)?1.1:.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*R*.955,Math.sin(a)*R*.955);
    ctx.lineTo(Math.cos(a)*R*.985,Math.sin(a)*R*.985);
    ctx.stroke();
  }

  /* --- 月名（放射方向・外周から内へ） --- */
  const nameSize=Math.max(12,R*.060);
  for(let i=0;i<12;i++){
    const a=monA(i);
    const isR=(i===reign);
    const isG=(i===gazeM && nowSec-gazeT<8);
    const tcol=TIERS[MON[i].tier].col;
    const chars=MON[i].jp.split("");
    ctx.save(); ctx.rotate(a);
    ctx.fillStyle=isR?rgbCss(mix3(tcol,acc,.4),1):(isG?ink(.92):rgbCss(tcol,.55));
    if(isR){ ctx.shadowColor=rgbCss(acc,.8); ctx.shadowBlur=10; }
    ctx.font=`${isR?600:400} ${nameSize*(isR?1.12:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    for(let c2=0;c2<chars.length;c2++){
      const rr=R*1.09+nameSize*(.5+(chars.length-1-c2)*1.12);
      ctx.save(); ctx.translate(rr,0); ctx.rotate(Math.PI/2);
      ctx.fillText(chars[c2],0,0);
      ctx.restore();
    }
    ctx.restore();
    ctx.shadowBlur=0;
  }

  /* --- 奇跡の弦（1→3→6→9のとび石） --- */
  if(mode==="miracle"){
    ctx.strokeStyle=rgbCss(acc,.45);
    ctx.lineWidth=1.2;
    ctx.setLineDash([3,6]); ctx.lineDashOffset=-nowSec*10;
    const seq=[0,2,5,8];
    for(let k=0;k<Math.min(mirStep,3);k++){
      const a0=monA(seq[k]), a1=monA(seq[k+1]);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a0)*R*.62,Math.sin(a0)*R*.62);
      ctx.lineTo(Math.cos(a1)*R*.62,Math.sin(a1)*R*.62);
      ctx.stroke();
    }
    ctx.setLineDash([]); ctx.lineDashOffset=0;
  }

  /* --- 十二人の精 — 焚き火をかこんで --- */
  for(let i=0;i<12;i++){
    const a=monA(i);
    const isR=(i===reign);
    const t2=MON[i].tier;
    let col=TIERS[t2].col.slice();
    /* めぐった年のぶん、面差しがゆらぐ（閉じない円） */
    const drift=(hash1(i*13.7+lap*5.3)-.5)*.14;
    col=[Math.min(1,Math.max(0,col[0]+drift)),Math.min(1,Math.max(0,col[1]+drift*.6)),Math.min(1,Math.max(0,col[2]-drift*.4))];
    const rs=R*.60;
    const h=R*(t2===1?.105:.115)*(isR?1.22:1);
    const x=Math.cos(a)*rs, y=Math.sin(a)*rs-(isR?R*.02:0);
    /* 王座の石 */
    if(isR){
      ctx.fillStyle=ink(.18);
      ctx.beginPath(); ctx.ellipse(x,y+h*.55,h*.55,h*.16,0,0,TAU); ctx.fill();
    }
    drawSpirit(x,y,h,col,isR?.98:.62,isR,i);
    /* 杖 */
    if(isR){
      ctx.strokeStyle=rgbCss(acc,.9);
      ctx.lineWidth=1.6;
      ctx.beginPath();
      ctx.moveTo(x+h*.38,y+h*.50);
      ctx.lineTo(x+h*.52,y-h*.85);
      ctx.stroke();
      const pulse=.5+.5*Math.sin(nowSec*2.2);
      ctx.fillStyle=rgbCss(acc,.9);
      ctx.shadowColor=rgbCss(acc,1); ctx.shadowBlur=10+8*pulse;
      ctx.beginPath(); ctx.arc(x+h*.52,y-h*.85,2.6+1.4*pulse,0,TAU); ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  /* --- 十三人目 — 環の外の娘 --- */
  {
    const ga=150*Math.PI/180;
    const gx=Math.cos(ga)*R*.86, gy=Math.sin(ga)*R*.86;
    const bright=(mode==="miracle")?.85:(gazeGirl&&nowSec-gazeT<8?.8:.26);
    drawSpirit(gx,gy,R*.082,[.88,.78,.66],bright,false,99);
  }

  /* --- 焚き火 — 季節の色で燃える --- */
  {
    /* 薪 */
    ctx.strokeStyle="rgba(70,50,36,.85)";
    ctx.lineWidth=3.5;
    for(const [dx,dy,ang] of [[-.05,.10,.4],[.05,.10,-.5],[0,.115,1.2]]){
      ctx.save(); ctx.translate(dx*R,dy*R); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(-R*.075,0); ctx.lineTo(R*.075,0); ctx.stroke();
      ctx.restore();
    }
    /* 炎の粒 */
    if(fireParts.length<40 && Math.random()<.8){
      fireParts.push({x:(Math.random()-.5)*R*.07, y:R*.09, vy:-(.28+Math.random()*.30)*R,
        vx:(Math.random()-.5)*R*.05, life:0, max:.9+Math.random()*.7, sz:(2.2+Math.random()*2.8)});
    }
    const dt2=1/60;
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    for(let k=fireParts.length-1;k>=0;k--){
      const p2=fireParts[k];
      p2.life+=dt2;
      if(p2.life>p2.max){ fireParts.splice(k,1); continue; }
      const t3=p2.life/p2.max;
      const wob=Math.sin(nowSec*6+k)*R*.012*t3;
      const x=p2.x+p2.vx*p2.life+wob, y=p2.y+p2.vy*p2.life*flare*.8;
      const c=mix3(mix3([1,.95,.75],fcol,Math.min(1,t3*1.6)),[.2,.18,.2],Math.max(0,t3-.7)*3);
      ctx.fillStyle=rgbCss(c,(1-t3)*.75);
      ctx.beginPath(); ctx.arc(x,y,p2.sz*(1-t3*.6)*flare,0,TAU); ctx.fill();
    }
    /* 焚き火のグロー */
    const g=ctx.createRadialGradient(0,R*.04,0,0,R*.04,R*.30*flare);
    g.addColorStop(0,rgbCss(fcol,.30*flare));
    g.addColorStop(1,rgbCss(fcol,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,R*.04,R*.30*flare,0,TAU); ctx.fill();
    ctx.restore();
  }

  /* --- ことば --- */
  const FT=(s)=>`${s}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  if(mode==="miracle"){
    const st=MIRACLE[mirStep];
    ctx.fillStyle=ink(.95);
    ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=16;
    ctx.font=`500 ${FT(R*.082)}`;
    ctx.fillText(MON[st.m].jp,0,R*.40);
    ctx.shadowBlur=0;
    if(st.item){
      ctx.fillStyle=rgbCss(st.ic,.95);
      ctx.font=`500 ${FT(R*.052)}`;
      ctx.fillText(st.item,0,R*.475);
    }
    ctx.font=`400 ${FT(R*.034)}`;
    ctx.fillStyle=ink(.60);
    ctx.fillText(st.say,0,R*.545);
  }else{
    const gzOn=(gazeM>=0||gazeGirl)&&nowSec-gazeT<8;
    if(gazeGirl&&gzOn){
      ctx.fillStyle=ink(.95);
      ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=16;
      ctx.font=`500 ${FT(R*.075)}`;
      ctx.fillText("十三人目",0,R*.40);
      ctx.shadowBlur=0;
      ctx.font=`400 ${FT(R*.034)}`;
      ctx.fillStyle=ink(.58);
      ctx.fillText("人間の娘——環の外から来て、火にあたることをゆるされた者",0,R*.475);
      ctx.fillStyle=ink(.40);
      ctx.fillText("環はいつも、外にひらいている",0,R*.545);
    }else{
      const m=MON[(gzOn?gazeM:reign)];
      const tcol=TIERS[m.tier].col;
      ctx.fillStyle=ink(.95);
      ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=16;
      ctx.font=`500 ${FT(R*.082)}`;
      ctx.fillText(m.jp,0,R*.40);
      ctx.shadowBlur=0;
      ctx.font=`400 ${FT(R*.036)}`;
      ctx.fillStyle=ink(.58);
      ctx.fillText(`${m.cz}　—　${m.ety}`,0,R*.475);
      const slot=Math.floor(nowSec/9)%2;
      const ph=(nowSec%9)/9;
      const fade=Math.min(1,Math.min(ph,1-ph)*9);
      ctx.font=`400 ${FT(R*.032)}`;
      if(slot===0){
        ctx.fillStyle=rgbCss(tcol,(.60*fade+.06));
        ctx.fillText(`${["冬","春","夏","秋"][m.tier]}の座——${TIERS[m.tier].n}のすがた`,0,R*.545);
      }else{
        ctx.fillStyle=ink(.42*fade+.05);
        ctx.fillText(`${lap+1}めぐりめ——めぐってきた月は、去年とおなじ顔をしていない`,0,R*.545);
      }
    }
  }

  ctx.restore();
}

/* ============================================================
   メインループ
============================================================ */
window.__gessei={
  pass(m){ passTo(m,performance.now()/1000); },
  miracle(){ document.getElementById("miracleBtn").click(); },
  get(){ return {reign:MON[reign].jp,lap,mode}; },
};

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  if(mode==="tale"){
    if(FLOWS[flowIdx].v>0 && now-lastInteract>3000 && t>=nextPassT){
      const nm=(reign+1)%12;
      if(nm===0) lap++;
      reign=nm; passT=t;
      nextPassT=t+FLOWS[flowIdx].v;
    }
  }else{
    const st=MIRACLE[mirStep];
    if(t-mirT>st.dur){
      mirStep++;
      if(mirStep>=MIRACLE.length){ mode="tale"; nextPassT=t+FLOWS[flowIdx].v; }
      else{ passTo(MIRACLE[mirStep].m,t); mirT=t; }
    }
  }

  /* 季節の粒のなめらかな移り */
  const tgt=[0,0,0,0]; tgt[MON[reign].tier]=1;
  for(let k=0;k<4;k++) seasonPh[k]+=(tgt[k]-seasonPh[k])*Math.min(1,dt*1.2);

  const tier=MON[reign].tier;
  const fcol=FIRECOL[tier];
  const flare=1+1.4*Math.exp(-Math.max(0,t-passT)/1.3);
  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uBgA,BGA[0],BGA[1],BGA[2]);
  gl.uniform3f(U.uBgB,BGB[0],BGB[1],BGB[2]);
  gl.uniform3f(U.uFire,fcol[0],fcol[1],fcol[2]);
  gl.uniform1fv(U.uPh,new Float32Array(seasonPh));
  gl.uniform1f(U.uFlare,Math.min(2,flare));
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawRing(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
