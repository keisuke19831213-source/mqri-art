<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>十二月 | 「12」第四作</title>
<style>
  :root{ --ink:#ece5d8; --ink-dim:rgba(236,229,216,.55); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0a121a; }
  body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #gl{ z-index:0; } #ring{ z-index:1; cursor:grab; }
  #ring.dragging{ cursor:grabbing; }
  #title{
    position:fixed; top:28px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.55em;
    font-size:clamp(14px,1.6vmin,19px); font-weight:500;
    color:var(--ink-dim); text-shadow:0 0 18px rgba(0,0,0,.5); pointer-events:none;
  }
  #title b{ font-weight:600; color:var(--ink); font-size:1.35em; letter-spacing:.4em; }
  #series{
    position:fixed; bottom:24px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.4em;
    font-size:11px; color:rgba(236,229,216,.30); pointer-events:none;
  }
  #ctrl{ position:fixed; top:26px; right:30px; z-index:2;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .btn{
    font-family:inherit; font-size:12px; letter-spacing:.3em; text-indent:.3em;
    color:var(--ink-dim); background:transparent;
    border:1px solid rgba(236,229,216,.26); border-radius:999px;
    padding:8px 16px 7px 16px; cursor:pointer;
    transition:color .4s, border-color .4s, background .4s; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); border-color:rgba(236,229,216,.6); background:rgba(236,229,216,.06); }
  .btn.on{ color:var(--ink); border-color:rgba(236,229,216,.7); background:rgba(236,229,216,.08); }
  .seg{ display:flex; gap:8px; }
  .btn.small{ padding:7px 13px 6px 13px; font-size:11px; letter-spacing:.22em; text-indent:.22em; }
  #hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:11px; letter-spacing:.3em; color:rgba(236,229,216,.34);
    white-space:nowrap; pointer-events:none; transition:opacity 1.2s;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ring"></canvas>
<div id="title"><b>十二月</b>　ひと年に、月は十二・三六八回みちる</div>
<div id="series">「12」— 円環の連作　第四</div>
<div id="ctrl">
  <div class="seg" id="flowSeg">
    <button class="btn small" data-f="0">止</button>
    <button class="btn small on" data-f="1">ゆるり</button>
    <button class="btn small" data-f="2">疾く</button>
  </div>
  <button class="btn" id="nowBtn">今日へ</button>
  <button class="btn" id="varBtn">見た目　潮騒</button>
</div>
<div id="hint">まわして月をめぐる — ドラッグ一周＝ひと朔望月 / 月名をタップ / 朔の真珠は十九年でとじる</div>

<script>
"use strict";

/* ============================================================
   和風月名
============================================================ */
const MONTHS=[
 {k:"睦月",   yomi:"むつき",     mean:"親族むつみ合う、年のはじめ"},
 {k:"如月",   yomi:"きさらぎ",   mean:"衣を更に着る、寒さの底"},
 {k:"弥生",   yomi:"やよい",     mean:"草木いやおい、しげりゆく"},
 {k:"卯月",   yomi:"うづき",     mean:"卯の花の咲く月"},
 {k:"皐月",   yomi:"さつき",     mean:"早苗を植える月"},
 {k:"水無月", yomi:"みなづき",   mean:"水の月——田に水を張る"},
 {k:"文月",   yomi:"ふみづき",   mean:"文をひろげる、七夕の月"},
 {k:"葉月",   yomi:"はづき",     mean:"葉の落ちはじめる月"},
 {k:"長月",   yomi:"ながつき",   mean:"夜長の月"},
 {k:"神無月", yomi:"かんなづき", mean:"神々は出雲へ——留守の月"},
 {k:"霜月",   yomi:"しもつき",   mean:"霜の降る月"},
 {k:"師走",   yomi:"しわす",     mean:"師も走る、年の暮れ"},
];
/* 月の異名（月齢→名前） */
const MOON_NAMES=[
 [0.0, 1.0, "朔",     "さく・新月"],
 [1.0, 2.5, "繊月",   "せんげつ"],
 [2.5, 4.0, "三日月", "みかづき"],
 [6.4, 8.4, "上弦",   "じょうげん"],
 [12.4,13.4,"十三夜", "じゅうさんや"],
 [13.4,14.2,"小望月", "こもちづき"],
 [14.2,15.3,"望",     "ぼう・満月"],
 [15.3,16.4,"十六夜", "いざよい"],
 [16.4,17.4,"立待月", "たちまちづき"],
 [17.4,18.4,"居待月", "いまちづき"],
 [18.4,19.4,"寝待月", "ねまちづき"],
 [19.4,20.4,"更待月", "ふけまちづき"],
 [21.4,23.4,"下弦",   "かげん"],
 [25.0,27.0,"有明月", "ありあけづき"],
 [28.5,29.6,"晦",     "つごもり"],
];
function moonName(age){
  for(const [a,b,n,y] of MOON_NAMES) if(age>=a&&age<b) return [n,y];
  return age<14.77?["満ちゆく月","—"]:["欠けゆく月","—"];
}
/* 潮名（旧暦日の型） */
const TIDES=["大潮","大潮","大潮","中潮","中潮","中潮","小潮","小潮","小潮","長潮","若潮","中潮","中潮","大潮","大潮"];
function tideName(age){ return TIDES[Math.floor(age)%15]; }

const TAU=Math.PI*2;
/* 天文定数 */
const SYN=29.530589;                 // 朔望月（日）
const YEAR=365.2422;                 // 太陽年（日）
const NM_REF=Date.UTC(2000,0,6,18,14)/864e5;   // 基準の朔
const J0=Date.UTC(2026,0,1)/864e5;             // 睦月のはじまり（角度の原点）
function moonAge(t){ return ((t-NM_REF)%SYN+SYN)%SYN; }
function solarDeg(t){ return (((t-J0)/YEAR*360)%360+360)%360; }
function lunation(t){ return Math.floor((t-NM_REF)/SYN); }
function newMoonTime(n){ return NM_REF+n*SYN; }

/* ============================================================
   見た目3案
============================================================ */
const VORDER=["A","B","C"];
const VARIANTS={
  A:{ name:"潮騒", bg:["#0a121a","#14283a"], moon:"#e8e4d4", accent:"#a8c8c0",
      water:[0.30,0.55,0.58], pearl:"#d8dce4" },
  B:{ name:"月白", bg:["#07070c","#12121e"], moon:"#eceef2", accent:"#b8c4dc",
      water:[0.36,0.45,0.66], pearl:"#e4e8f0" },
  C:{ name:"藍波", bg:["#0c1622","#1a3048"], moon:"#f0e6c8", accent:"#d9b56a",
      water:[0.24,0.42,0.60], pearl:"#e8d8a8" },
};
const q0=new URLSearchParams(location.search);
let vKey=VARIANTS[(q0.get("v")||"A").toUpperCase()]?(q0.get("v")||"A").toUpperCase():"A";
let V=VARIANTS[vKey];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function rgbCss(c,a=1){ return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`; }
function smooth(t){ return t*t*(3-2*t); }

/* ============================================================
   WebGL2 — 海霧の夜
============================================================ */
const glCanvas=document.getElementById("gl");
const gl=glCanvas.getContext("webgl2",{antialias:false,alpha:false});
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position=vec4(aPos,0.,1.); }`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uBgA,uBgB,uWater;
uniform vec2 uMoonDir;      // 月の方向（単位ベクトル）
uniform float uSpring;      // 大潮=1 小潮=0
out vec4 fragColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; } return v; }
void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;
  float t=uTime;
  float rr=length(uv);
  vec2 p=uv*2.0;
  vec2 q=vec2(fbm(p+t*.012), fbm(p+vec2(5.2,1.3)-t*.009));
  float f=fbm(p+2.3*q);
  vec3 col=mix(uBgA,uBgB,clamp(f*f*2.2,0.,1.));
  col=mix(col,uWater*.55,clamp(length(q)*.7,0.,1.)*.26);
  /* 月光 — 月の方角から差す */
  float lit=max(0.,dot(normalize(uv+1e-6),uMoonDir));
  col+=vec3(.85,.86,.80)*pow(lit,3.)*exp(-rr*1.2)*.14;
  /* 潮のうねり — 大潮のとき波が高い */
  float wave=fbm(vec2(uv.x*3.2+t*.10, uv.y*8.-t*.05));
  col+=uWater*wave*exp(-abs(rr-.47)*7.)*(.10+.22*uSpring);
  /* 遠い星 */
  vec2 sp=uv*30.; vec2 id=floor(sp),gv=fract(sp)-.5;
  float n=hash21(id);
  if(n<.13){ vec2 off=(vec2(hash21(id+3.1),hash21(id+7.7))-.5)*.8;
    float d=length(gv-off);
    col+=vec3(.9,.92,.95)*smoothstep(.05,.0,d)*(.5+.5*sin(t*(1.+n*3.)+n*40.))*.35; }
  col*=1.-.44*pow(rr*1.24,2.2);
  col+=(hash21(frag+fract(t)*61.7)-.5)*.03;
  col=col/(1.+col*.12);
  col=pow(max(col,0.),vec3(.96));
  fragColor=vec4(col,1.);
}`;
function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uTime","uBgA","uBgB","uWater","uMoonDir","uSpring"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
let BGA=hex2rgb(V.bg[0]), BGB=hex2rgb(V.bg[1]);

/* ============================================================
   リングキャンバス
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||1280; H=window.innerHeight||800;
  glCanvas.width=Math.max(2,W*DPR); glCanvas.height=Math.max(2,H*DPR);
  ringCanvas.width=Math.max(2,W*DPR); ringCanvas.height=Math.max(2,H*DPR);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   状態 — 主変数は「日」（1970年からの通日・連続値）
============================================================ */
let tDay=(q0.get("day")?parseFloat(q0.get("day")):Date.now()/864e5);
let targetDay=null;
let flowIdx=1;
const FLOWS=[{n:"止",v:0},{n:"ゆるり",v:.45},{n:"疾く",v:40}];   // 日/秒
/* 月の見かけの月齢 — 時が速すぎるときは自分のペース（約8秒で一巡）で追いかける */
let dispAge=null, lastTDay=tDay;
const CHASE=29.530589/8;   // 日/秒（表示の最高速）
let gazeMonth=-1, gazeT=-1e9;
let lastInteract=-1e9;

function cx(){ return W/2; } function cy(){ return H/2; }
function ringR(){ return Math.min(W*.315, H*.36); }

/* ============================================================
   入力
============================================================ */
function angleOf(e){
  const x=(e.clientX??e.touches?.[0]?.clientX)-cx();
  const y=(e.clientY??e.touches?.[0]?.clientY)-cy();
  return Math.atan2(y,x);
}
let dragging=false,dragA=0,dragMoved=0;
ringCanvas.addEventListener("pointerdown",e=>{
  dragging=true; dragMoved=0; dragA=angleOf(e); targetDay=null;
  lastInteract=performance.now(); ringCanvas.classList.add("dragging");
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleOf(e);
  let da=a-dragA;
  if(da>Math.PI)da-=TAU; if(da<-Math.PI)da+=TAU;
  dragA=a; dragMoved+=Math.abs(da);
  tDay += da/TAU*SYN;                     // 一周＝ひと朔望月
  lastInteract=performance.now();
});
ringCanvas.addEventListener("pointerup",e=>{
  dragging=false; ringCanvas.classList.remove("dragging");
  lastInteract=performance.now();
  if(dragMoved<.02){
    const x=e.clientX-cx(), y=e.clientY-cy();
    const rr=Math.hypot(x,y), R=ringR();
    if(rr>R*.62&&rr<R*1.5){
      const a=Math.atan2(y,x);
      gazeMonth=Math.floor((((a*180/Math.PI+90)%360)+360)%360/30)%12;
      gazeT=performance.now()/1000;
    }
  }
  hideHint();
});
window.addEventListener("wheel",e=>{
  tDay+=e.deltaY*8e-3; targetDay=null;
  lastInteract=performance.now(); hideHint();
},{passive:true});
const segBtns=[...document.querySelectorAll("#flowSeg .btn")];
function setFlow(i){
  flowIdx=i;
  segBtns.forEach((b,j)=>b.classList.toggle("on",j===i));
}
segBtns.forEach((b,i)=>b.addEventListener("click",()=>{ setFlow(i); hideHint(); }));
window.addEventListener("keydown",e=>{
  if(e.key===" "){ setFlow(flowIdx===0?1:0); e.preventDefault(); }
  hideHint();
});
document.getElementById("nowBtn").addEventListener("click",()=>{
  targetDay=Date.now()/864e5; lastInteract=performance.now(); hideHint();
});
const varBtn=document.getElementById("varBtn");
varBtn.textContent="見た目　"+V.name;
varBtn.addEventListener("click",()=>{
  vKey=VORDER[(VORDER.indexOf(vKey)+1)%VORDER.length];
  V=VARIANTS[vKey];
  BGA=hex2rgb(V.bg[0]); BGB=hex2rgb(V.bg[1]);
  document.body.style.background=V.bg[0];
  varBtn.textContent="見た目　"+V.name;
});
document.body.style.background=V.bg[0];
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500); }
setTimeout(hideHint,16000);

/* ============================================================
   月を描く（本物の月相）— 灯る側は太陽をむく
============================================================ */
function drawMoon(x,y,r,age,litDir){
  const p=age/SYN*TAU;               // 0=朔
  const b=r*Math.cos(p);
  ctx.save();
  ctx.translate(x,y); ctx.rotate(litDir);
  /* 影の円盤 */
  ctx.fillStyle="rgba(60,64,72,.85)";
  ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
  /* 照らされた部分 */
  ctx.fillStyle=V.moon;
  ctx.shadowColor=V.moon; ctx.shadowBlur=10+8*(1-Math.abs(Math.cos(p)));
  ctx.beginPath();
  ctx.arc(0,0,r,-Math.PI/2,Math.PI/2,false);
  ctx.ellipse(0,0,Math.abs(b),r,0,Math.PI/2,-Math.PI/2,b>0);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

/* ============================================================
   リング描画
============================================================ */
const dateFmt=(t)=>{
  const d=new Date(t*864e5);
  return `西暦 ${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日`;
};
function drawRing(now){
  const nowSec=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=ringR();
  const ink=(a)=>`rgba(236,229,216,${a})`;

  const age=(dispAge===null?moonAge(tDay):dispAge);   // 見かけの月齢（速いときは歩調を落として追う）
  const sunDeg=solarDeg(tDay);
  const monIdx=Math.floor(sunDeg/30)%12;
  const elong=age/SYN*TAU;
  const aSun=(-90+sunDeg)*Math.PI/180;
  const aMoon=aSun+elong;
  const spring=Math.abs(Math.cos(elong));       // 大潮=1 小潮=0
  const n=lunation(tDay);

  ctx.save();
  ctx.translate(cx(),cy());

  /* --- 暦の環（理想の十二月） --- */
  ctx.strokeStyle=ink(.42); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  ctx.strokeStyle=ink(.15);
  ctx.beginPath(); ctx.arc(0,0,R*.985,0,TAU); ctx.stroke();
  /* 目盛 — 12ヶ月×約30日 ＝ 360日ぶんの刻み（5日ごと強調） */
  for(let i=0;i<72;i++){
    const a=(-90+i*5)*Math.PI/180;
    const major=(i%6===0);
    ctx.strokeStyle=ink(major?.5:.2);
    ctx.lineWidth=major?1.2:.6;
    const r1=major?R*.945:R*.962;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*R*.985,Math.sin(a)*R*.985);
    ctx.stroke();
  }
  /* 月名（放射方向・外周から内へ） */
  const nameSize=Math.max(12,R*.068);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let k=0;k<12;k++){
    const a=(-90+k*30+15)*Math.PI/180;
    const isCur=(k===monIdx);
    const isGaze=(k===gazeMonth && nowSec-gazeT<10);
    const chars=MONTHS[k].k.split("");
    ctx.save(); ctx.rotate(a);
    ctx.fillStyle=isCur?V.accent:(isGaze?ink(.95):ink(.60));
    if(isCur){ ctx.shadowColor=V.accent; ctx.shadowBlur=10; }
    ctx.font=`${isCur?600:400} ${nameSize*(isCur?1.1:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    for(let c=0;c<chars.length;c++){
      const rr=R*1.09+nameSize*(.5+(chars.length-1-c)*1.14);
      ctx.save(); ctx.translate(rr,0); ctx.rotate(Math.PI/2);
      ctx.fillText(chars[c],0,0);
      ctx.restore();
    }
    ctx.restore();
  }

  /* --- 朔の真珠 — ほんものの月がはじめた月々（61朔望月＝約5年ぶん） --- */
  {
    const NP=61;
    let prevA=null, prevSeg=null;
    for(let k=n-NP+1;k<=n;k++){
      const T=newMoonTime(k);
      const deg=solarDeg(T);
      const seg=Math.floor(deg/30);
      const a=(-90+deg)*Math.PI/180;
      const agePearl=(n-k)/NP;                   // 0=新しい
      const fade=1-agePearl;
      const leap=(prevSeg!==null && seg===prevSeg);   // 同じ月にふたつめの朔＝閏月
      const rr=R*.80;
      const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
      /* 弦 */
      if(prevA!==null){
        ctx.strokeStyle=rgbCss(hex2rgb(V.pearl),.04+.30*fade);
        ctx.lineWidth=.7+1.1*fade;
        ctx.beginPath();
        ctx.moveTo(Math.cos(prevA)*rr,Math.sin(prevA)*rr);
        ctx.lineTo(x,y);
        ctx.stroke();
      }
      /* 真珠 */
      if(leap){
        ctx.strokeStyle=rgbCss(hex2rgb(V.accent),.25+.65*fade);
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(x,y,3.4,0,TAU); ctx.stroke();
        if(fade>.4){
          ctx.fillStyle=rgbCss(hex2rgb(V.accent),.35+.5*fade);
          ctx.font=`400 ${Math.max(8,R*.032)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
          ctx.fillText("閏", x*1.10, y*1.10);
        }
      }else{
        ctx.fillStyle=rgbCss(hex2rgb(V.pearl),.10+.75*fade);
        ctx.beginPath(); ctx.arc(x,y,1.4+1.4*fade,0,TAU); ctx.fill();
      }
      prevA=a; prevSeg=seg;
    }
  }

  /* --- 太陽（季節の座標） --- */
  {
    const x=Math.cos(aSun)*R*.965, y=Math.sin(aSun)*R*.965;
    ctx.fillStyle="rgba(240,200,120,.95)";
    ctx.shadowColor="rgba(240,200,120,.9)"; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(x,y,4,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }

  /* --- 月の座標 — 暦の環の上をゆく白い点（朔で太陽と重なり、望で対岸へ） --- */
  {
    const x=Math.cos(aMoon)*R*.965, y=Math.sin(aMoon)*R*.965;
    ctx.fillStyle=rgbCss(hex2rgb(V.moon),.95);
    ctx.shadowColor=V.moon; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(x,y,3,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }

  /* --- 中央 --- */
  const gz=(gazeMonth>=0 && nowSec-gazeT<10);
  if(gz){
    const m=MONTHS[gazeMonth];
    ctx.fillStyle=ink(.96);
    ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=24;
    ctx.font=`500 ${R*.17}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillText(m.k,0,-R*.10);
    ctx.shadowBlur=0;
    ctx.font=`400 ${R*.048}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillStyle=ink(.6);
    ctx.fillText(m.yomi,0,R*.06);
    ctx.font=`400 ${R*.042}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillStyle=ink(.44);
    ctx.fillText(m.mean,0,R*.155);
  }else{
    /* 大きな月 — この作品の主役。本物の月相で照る */
    const mR=R*.235, mY=-R*.10;
    drawMoon(0,mY,mR,age, Math.atan2(Math.sin(aSun)*R-mY, Math.cos(aSun)*R-0));
    const [mn,my]=moonName(age);
    ctx.fillStyle=ink(.94);
    ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=18;
    ctx.font=`500 ${R*.095}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillText(mn,0,R*.265);
    ctx.shadowBlur=0;
    ctx.font=`400 ${R*.040}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillStyle=ink(.52);
    ctx.fillText(`${my}　月齢 ${age.toFixed(1)}`,0,R*.345);
    /* 潮 */
    const tn=tideName(age);
    ctx.font=`500 ${R*.050}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillStyle=rgbCss(V.water,.55+.45*spring);
    ctx.fillText(tn,0,R*.425);
    ctx.font=`500 ${R*.046}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillStyle=ink(.80);
    ctx.fillText(dateFmt(tDay),0,R*.505);
    ctx.font=`400 ${R*.032}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillStyle=ink(.34);
    ctx.fillText(`ひと年に朔望月 12.368 — 環は毎年 10.9° とじ残す`,0,R*.575);
    const m235=((n%235)+235)%235;
    ctx.fillStyle=ink(.28);
    ctx.fillText(`メトンの環 ${m235+1}／235 朔望月　十九年でほぼとじる（残り0.087日）`,0,R*.635);
  }

  ctx.restore();
}

/* ============================================================
   メインループ
============================================================ */
window.__tsuki={
  setDay(d){ tDay=d; targetDay=null; },
  get(){ return {tDay, age:moonAge(tDay), sunDeg:solarDeg(tDay), lunation:lunation(tDay)}; },
};

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  if(!dragging && targetDay===null && now-lastInteract>3000){
    tDay+=FLOWS[flowIdx].v*dt;
  }
  if(targetDay!==null){
    tDay+=(targetDay-tDay)*Math.min(1,dt*3.5);
    if(Math.abs(targetDay-tDay)<.005){ tDay=targetDay; targetDay=null; }
  }
  /* 見かけの月齢 — 実際を追いかける。追いつけない速さでは歩調を落とす（約8秒で一巡）。
     向きは「時の流れ」と同じにする（最短経路だと早送り中に逆回りへ反転してしまう） */
  {
    const actual=moonAge(tDay);
    if(dispAge===null) dispAge=actual;
    const flowDir=(tDay>=lastTDay)?1:-1;
    lastTDay=tDay;
    const maxStep=CHASE*dt;
    if(flowDir>=0){
      const d=((actual-dispAge)%SYN+SYN)%SYN;
      dispAge=(dispAge+Math.min(d,maxStep))%SYN;
    }else{
      const d=((dispAge-actual)%SYN+SYN)%SYN;
      dispAge=((dispAge-Math.min(d,maxStep))%SYN+SYN)%SYN;
    }
  }

  const elong=dispAge/SYN*TAU;
  const aSun=(-90+solarDeg(tDay))*Math.PI/180;
  const aMoon=aSun+elong;
  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uBgA,BGA[0],BGA[1],BGA[2]);
  gl.uniform3f(U.uBgB,BGB[0],BGB[1],BGB[2]);
  gl.uniform3f(U.uWater,V.water[0],V.water[1],V.water[2]);
  gl.uniform2f(U.uMoonDir,Math.cos(aMoon),-Math.sin(aMoon));
  gl.uniform1f(U.uSpring,Math.abs(Math.cos(elong)));
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawRing(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
