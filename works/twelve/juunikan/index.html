<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>十二感 | 「12」第十一作</title>
<style>
  :root{ --ink:#ece5d8; --ink-dim:rgba(236,229,216,.55); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0e0c10; }
  body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #gl{ z-index:0; } #ring{ z-index:1; cursor:grab; }
  #ring.dragging{ cursor:grabbing; }
  #title{
    position:fixed; top:28px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.55em;
    font-size:clamp(14px,1.6vmin,19px); font-weight:500;
    color:var(--ink-dim); text-shadow:0 0 18px rgba(0,0,0,.5); pointer-events:none;
  }
  #title b{ font-weight:600; color:var(--ink); font-size:1.35em; letter-spacing:.4em; }
  #series{
    position:fixed; bottom:24px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.4em;
    font-size:11px; color:rgba(236,229,216,.30); pointer-events:none;
  }
  #ctrl{ position:fixed; top:26px; right:30px; z-index:2;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .btn{
    font-family:inherit; font-size:12px; letter-spacing:.3em; text-indent:.3em;
    color:var(--ink-dim); background:transparent;
    border:1px solid rgba(236,229,216,.26); border-radius:999px;
    padding:8px 16px 7px 16px; cursor:pointer;
    transition:color .4s, border-color .4s, background .4s; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); border-color:rgba(236,229,216,.6); background:rgba(236,229,216,.06); }
  .btn.on{ color:var(--ink); border-color:rgba(236,229,216,.7); background:rgba(236,229,216,.08); }
  .seg{ display:flex; gap:8px; }
  .btn.small{ padding:7px 13px 6px 13px; font-size:11px; letter-spacing:.22em; text-indent:.22em; }
  #hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:11px; letter-spacing:.3em; color:rgba(236,229,216,.34);
    white-space:nowrap; pointer-events:none; transition:opacity 1.2s;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ring"></canvas>
<div id="title"><b>十二感</b>　からだは、環に巻きついている</div>
<div id="series">「12」— 円環の連作　第十一</div>
<div id="ctrl">
  <div class="seg" id="flowSeg">
    <button class="btn small" data-f="0">止</button>
    <button class="btn small on" data-f="1">ゆるり</button>
    <button class="btn small" data-f="2">疾く</button>
  </div>
  <button class="btn" id="varBtn">見た目　気層</button>
</div>
<div id="hint">感覚をタップ＝ともし直す / 下の感覚は上の感覚へ育つ（四本の直径） / 熱感覚だけ、対をもたない</div>

<script>
"use strict";

/* ============================================================
   シュタイナーの十二感覚 — 黄道の順＝頭から足へ、体が環に巻きつく
   tier: 0上位(思考・14-21歳) 1中位(感情・7-14歳) 2下位(意志・0-7歳)
   mirror: 鏡像対の相手（-1=なし）
============================================================ */
const SENSES=[
 {n:"自我感覚", tan:"自我", yomi:"じが",     sign:"白羊宮", part:"頭",       tier:0, mirror:6,
  desc:"目のまえの「あなた」を、直接かんじとる——いちばん高い感覚", bp:[0,-.99]},
 {n:"思考感覚", tan:"思考", yomi:"しこう",   sign:"金牛宮", part:"咽頭",     tier:0, mirror:7,
  desc:"他者のかんがえの、すじみちをかんじる", bp:[0,-.72]},
 {n:"言語感覚", tan:"言語", yomi:"げんご",   sign:"双児宮", part:"腕",       tier:0, mirror:8,
  desc:"語られたことばを、かたちとして聴く", bp:[.24,-.18]},
 {n:"聴覚",     tan:"聴",   yomi:"ちょう",   sign:"巨蟹宮", part:"胸",       tier:0, mirror:9,
  desc:"音のうちがわにある、ひびきの心を聴く", bp:[0,-.50]},
 {n:"熱感覚",   tan:"熱",   yomi:"ねつ",     sign:"獅子宮", part:"心臓",     tier:1, mirror:-1, heart:true,
  desc:"あたたかさ・つめたさ——関心そのもの。だから心臓に住む", bp:[-.06,-.44]},
 {n:"視覚",     tan:"視",   yomi:"し",       sign:"処女宮", part:"下腹",     tier:1, mirror:-1,
  desc:"色とひかり。世界の表情をうけとる", bp:[0,-.16]},
 {n:"触覚",     tan:"触",   yomi:"しょく",   sign:"天秤宮", part:"腰",       tier:2, mirror:0,
  desc:"じぶんの輪郭を知る——世界とじぶんの、境い目", bp:[.15,-.05]},
 {n:"生命感覚", tan:"生命", yomi:"せいめい", sign:"天蝎宮", part:"からだの奥", tier:2, mirror:1,
  desc:"快調・不調——いのちの天気をかんじる", bp:[0,.02]},
 {n:"運動感覚", tan:"運動", yomi:"うんどう", sign:"人馬宮", part:"大腿",     tier:2, mirror:2,
  desc:"じぶんのうごきを、内がわからかんじる", bp:[.11,.25]},
 {n:"平衡感覚", tan:"平衡", yomi:"へいこう", sign:"磨羯宮", part:"膝",       tier:2, mirror:3,
  desc:"重力のなかで、まっすぐに立つ", bp:[.08,.46]},
 {n:"嗅覚",     tan:"嗅",   yomi:"きゅう",   sign:"宝瓶宮", part:"下腿",     tier:1, mirror:-1,
  desc:"香り——もっとも古い、記憶の感覚", bp:[.075,.66]},
 {n:"味覚",     tan:"味",   yomi:"み",       sign:"双魚宮", part:"足",       tier:1, mirror:-1,
  desc:"あじわい——世界を、うちに取りいれる", bp:[.10,.90]},
];
const TIERS=[
 {n:"上位——思考の感覚", age:"一四〜二一歳", col:[.72,.80,.92]},
 {n:"中位——感情の感覚", age:"七〜一四歳",   col:[.88,.72,.48]},
 {n:"下位——意志の感覚", age:"〇〜七歳",     col:[.76,.52,.42]},
];
const MIRROR_SAYS={
 6:"じぶんの輪郭を知った者だけが、他者の輪郭を尊べる——触覚は自我感覚へ育つ",
 7:"いのちの調子をかんじる力が、考えの真偽をかんじる力に育つ",
 8:"うごく意志が、ことばを受けとる力に育つ",
 9:"重力に立つ力が、ひびきのなかに立つ力に育つ",
};
const TAU=Math.PI*2;
function senA(k){ return (-90+k*30)*Math.PI/180; }   // 自我感覚＝真上（頭）

/* ============================================================
   見た目3案 — 地そのものが「下は重く、上はひかる」
============================================================ */
const VORDER=["A","B","C"];
const VARIANTS={
  A:{ name:"気層", bgTop:"#1a2432", bgBot:"#221410", accent:"#d9b56a", body:"#c9a86a" },
  B:{ name:"墨",   bgTop:"#14161a", bgBot:"#191412", accent:"#cfd4d8", body:"#b8c0c4" },
  C:{ name:"燈",   bgTop:"#171420", bgBot:"#241208", accent:"#e0b160", body:"#d0a870" },
};
const q0=new URLSearchParams(location.search);
let vKey=VARIANTS[(q0.get("v")||"A").toUpperCase()]?(q0.get("v")||"A").toUpperCase():"A";
let V=VARIANTS[vKey];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function rgbCss(c,a=1){ return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`; }
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }

/* ============================================================
   WebGL2 — 気の層（上は光、下は土）
============================================================ */
const glCanvas=document.getElementById("gl");
const gl=glCanvas.getContext("webgl2",{antialias:false,alpha:false});
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position=vec4(aPos,0.,1.); }`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uTop,uBot,uAcc;
out vec4 fragColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; } return v; }
void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;
  float t=uTime;
  float rr=length(uv);
  /* 上下のグラデ＝精神と大地 */
  float g=smoothstep(-.55,.55,uv.y);   // GLはy上向き：上=1
  vec3 col=mix(uBot,uTop,g);
  vec2 p=uv*2.0;
  vec2 q=vec2(fbm(p+t*.010), fbm(p+vec2(5.2,1.3)-t*.008));
  float f=fbm(p+2.3*q);
  col=mix(col,mix(uBot,uTop,g)*1.5,clamp(f*f,0.,1.)*.30);
  /* 一条の光 */
  col+=uAcc*exp(-abs(uv.x)*5.5)*smoothstep(.55,-.40,-uv.y*0.+.0+ -uv.y)*.0;
  col+=uAcc*exp(-abs(uv.x)*6.0)*smoothstep(-.55,.45,uv.y)*.07;
  /* 光塵——上へのぼる（変容のけはい） */
  {
    vec2 pp=uv*9.; pp.y-=t*.06;
    vec2 id=floor(pp), gv=fract(pp)-.5;
    float n=hash21(id);
    if(n<.24){
      vec2 off=(vec2(hash21(id+3.1),hash21(id+7.7))-.5)*.7;
      float d=length(gv-off);
      float tw=.5+.5*sin(t*(1.+n*2.)+n*40.);
      col+=uAcc*smoothstep(.045,.0,d)*tw*.20;
    }
  }
  col*=1.-.42*pow(rr*1.22,2.2);
  col+=(hash21(frag+fract(t)*61.7)-.5)*.03;
  col=col/(1.+col*.12);
  col=pow(max(col,0.),vec3(.96));
  fragColor=vec4(col,1.);
}`;
function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uTime","uTop","uBot","uAcc"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
let TOPC=hex2rgb(V.bgTop), BOTC=hex2rgb(V.bgBot);

/* ============================================================
   リングキャンバス
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||1280; H=window.innerHeight||800;
  glCanvas.width=Math.max(2,W*DPR); glCanvas.height=Math.max(2,H*DPR);
  ringCanvas.width=Math.max(2,W*DPR); ringCanvas.height=Math.max(2,H*DPR);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   一筆の人体（第五作より・掟＝素の折れ線で検分済みの点列）
============================================================ */
function crPoint(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return [
    .5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)];
}
const RSIDE=[
 [.045,-.995],[.088,-.945],[.094,-.875],[.076,-.800],[.040,-.762],
 [.042,-.715],[.078,-.686],[.158,-.656],[.228,-.616],[.256,-.552],
 [.258,-.462],[.240,-.352],[.226,-.242],[.207,-.132],[.216,-.052],
 [.196,.033],[.170,-.018],[.165,-.118],[.174,-.248],[.181,-.360],
 [.170,-.476],[.148,-.502],[.132,-.382],[.118,-.282],[.149,-.162],
 [.168,-.062],[.158,.040],[.136,.180],[.113,.340],[.108,.440],
 [.100,.560],[.079,.740],[.076,.840],[.136,.893],[.046,.900],
 [.043,.780],[.052,.600],[.049,.440],[.053,.280],[.029,.100],
];
function smoothClosed(c,pts){
  const N=pts.length;
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  c.beginPath();
  let m=mid(pts[0],pts[1]);
  c.moveTo(m[0],m[1]);
  for(let i=1;i<=N;i++){
    const p=pts[i%N], m2=mid(p,pts[(i+1)%N]);
    c.quadraticCurveTo(p[0],p[1],m2[0],m2[1]);
  }
  c.closePath();
}
function statuePath(c,B){
  const pts=[[0,-1.0*B]];
  for(const [x,y] of RSIDE) pts.push([x*B,y*B]);
  pts.push([0,.046*B]);
  for(let i=RSIDE.length-1;i>=0;i--) pts.push([-RSIDE[i][0]*B,RSIDE[i][1]*B]);
  smoothClosed(c,pts);
}
let bodyCache=null, bodyCacheKey="";
function getBodyCache(B){
  const key=vKey+"|"+Math.round(B)+"|"+DPR;
  if(bodyCache && bodyCacheKey===key) return bodyCache;
  const bc=hex2rgb(V.body);
  const pad=B*.30;
  const wCss=B*.95+pad*2, hCss=B*1.96+pad*2;
  const topY=-1.0*B-pad;
  const cnv=document.createElement("canvas");
  cnv.width=Math.ceil(wCss*DPR); cnv.height=Math.ceil(hCss*DPR);
  const c=cnv.getContext("2d");
  c.setTransform(DPR,0,0,DPR, wCss/2*DPR, -topY*DPR);
  c.fillStyle=rgbCss([bc[0]*.50,bc[1]*.47,bc[2]*.42],1);
  statuePath(c,B);
  c.fill();
  c.globalCompositeOperation="source-atop";
  const g=c.createLinearGradient(0,-1.0*B,0,.95*B);
  g.addColorStop(0, rgbCss(bc,.50));
  g.addColorStop(.45,rgbCss(bc,.15));
  g.addColorStop(1, "rgba(0,0,0,.18)");
  c.fillStyle=g;
  c.fillRect(-wCss/2,topY,wCss,hCss);
  c.strokeStyle="rgba(0,0,0,.30)";
  c.lineWidth=B*.05;
  statuePath(c,B);
  c.stroke();
  c.globalCompositeOperation="source-over";
  c.strokeStyle=rgbCss(bc,.32);
  c.lineWidth=1;
  statuePath(c,B);
  c.stroke();
  bodyCache={cnv,wCss,hCss,topY};
  bodyCacheKey=key;
  return bodyCache;
}

/* ============================================================
   状態
============================================================ */
let phase=(q0.get("p")?parseFloat(q0.get("p")):0);   // 観想の位置 0..1
let flowIdx=1;
const FLOWS=[{n:"止",v:0},{n:"ゆるり",v:1/72},{n:"疾く",v:1/18}];   // 周/秒
const care=SENSES.map(()=>1);        // 感覚のともしび（手入れをやめると眠る）
let lastInteract=-1e9;

function cx(){ return W/2; } function cy(){ return H/2; }
function ringR(){ return Math.min(W*.30, H*.34); }

/* ============================================================
   入力
============================================================ */
function angleOf(e){
  const x=(e.clientX??e.touches?.[0]?.clientX)-cx();
  const y=(e.clientY??e.touches?.[0]?.clientY)-cy();
  return Math.atan2(y,x);
}
let dragging=false,dragA=0,dragMoved=0;
ringCanvas.addEventListener("pointerdown",e=>{
  dragging=true; dragMoved=0; dragA=angleOf(e);
  lastInteract=performance.now(); ringCanvas.classList.add("dragging");
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleOf(e);
  let da=a-dragA;
  if(da>Math.PI)da-=TAU; if(da<-Math.PI)da+=TAU;
  dragA=a; dragMoved+=Math.abs(da);
  phase=((phase+da/TAU)%1+1)%1;
  lastInteract=performance.now();
});
ringCanvas.addEventListener("pointerup",e=>{
  dragging=false; ringCanvas.classList.remove("dragging");
  lastInteract=performance.now();
  if(dragMoved<.02){
    const x=e.clientX-cx(), y=e.clientY-cy();
    const rr=Math.hypot(x,y), R=ringR();
    if(rr>R*.62&&rr<R*1.5){
      const aDeg=Math.atan2(y,x)*180/Math.PI;
      const k=Math.floor(((aDeg+90+15)%360+360)%360/30)%12;
      phase=(k/12+.001)%1;                 // その感覚を見つめ
      care[k]=1;                            // ともし直す
    }
  }
  hideHint();
});
window.addEventListener("wheel",e=>{
  phase=((phase+e.deltaY*2e-4)%1+1)%1;
  lastInteract=performance.now(); hideHint();
},{passive:true});
const segBtns=[...document.querySelectorAll("#flowSeg .btn")];
function setFlow(i){
  flowIdx=i;
  segBtns.forEach((b,j)=>b.classList.toggle("on",j===i));
}
segBtns.forEach((b,i)=>b.addEventListener("click",()=>{ setFlow(i); hideHint(); }));
window.addEventListener("keydown",e=>{
  if(e.key===" "){ setFlow(flowIdx===0?1:0); e.preventDefault(); }
  hideHint();
});
const varBtn=document.getElementById("varBtn");
varBtn.textContent="見た目　"+V.name;
varBtn.addEventListener("click",()=>{
  vKey=VORDER[(VORDER.indexOf(vKey)+1)%VORDER.length];
  V=VARIANTS[vKey];
  TOPC=hex2rgb(V.bgTop); BOTC=hex2rgb(V.bgBot);
  document.body.style.background=V.bgBot;
  varBtn.textContent="見た目　"+V.name;
});
document.body.style.background=V.bgBot;
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500); }
setTimeout(hideHint,16000);

/* ============================================================
   描画
============================================================ */
function wrapJP(text,maxW){
  const out=[]; let line="";
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW){ out.push(line); line=ch; }
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function drawRing(now){
  const nowSec=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=ringR();
  const ink=(a)=>`rgba(236,229,216,${a})`;
  const acc=hex2rgb(V.accent);
  const focus=Math.floor(((phase%1)+1)%1*12)%12;
  const fs=SENSES[focus];

  ctx.save();
  ctx.translate(cx(),cy());
  ctx.textAlign="center"; ctx.textBaseline="middle";

  const B=R*.42, bodyOffY=-R*.06;
  const bp=(k)=>[SENSES[k].bp[0]*B, SENSES[k].bp[1]*B+bodyOffY];

  /* --- 三期の弧（発達のカレンダー） --- */
  const TIERSEG=[[0,4],[4,6],[6,10]];  // 上位0-3・中位4-5…（中位は4,5と10,11に割れる）
  for(const [b,s,e] of [[0,0,4],[1,4,6],[2,6,10],[1,10,12]]){
    const a0=senA(s)-15*Math.PI/180+.04, a1=senA(e-1)+15*Math.PI/180-.04;
    ctx.strokeStyle=rgbCss(TIERS[b].col,.22);
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,R*1.045,a0,a1); ctx.stroke();
  }

  /* --- 環 --- */
  ctx.strokeStyle=ink(.30); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  for(let i=0;i<36;i++){
    const a=(-90+i*10-15)*Math.PI/180;
    ctx.strokeStyle=ink((i%3===0)?.38:.15);
    ctx.lineWidth=(i%3===0)?1.1:.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*R*.955,Math.sin(a)*R*.955);
    ctx.lineTo(Math.cos(a)*R*.985,Math.sin(a)*R*.985);
    ctx.stroke();
  }

  /* --- 鏡像対の四本の直径 --- */
  for(let k=6;k<10;k++){
    const m=SENSES[k].mirror;
    const isF=(focus===k||focus===m);
    const a=senA(k);
    ctx.strokeStyle=isF?rgbCss(acc,.55):ink(.10);
    ctx.lineWidth=isF?1.4:.8;
    if(isF){ ctx.setLineDash([8,6]); ctx.lineDashOffset=-nowSec*14; }
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*R*.90,Math.sin(a)*R*.90);
    ctx.lineTo(-Math.cos(a)*R*.90,-Math.sin(a)*R*.90);
    ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset=0;
    /* 変容の粒——下から上へのぼる */
    if(isF){
      for(let d2=0;d2<7;d2++){
        const t2=((nowSec*.13+d2/7)%1);
        const x=Math.cos(a)*R*.90*(1-2*t2), y=Math.sin(a)*R*.90*(1-2*t2);
        ctx.fillStyle=rgbCss(acc,.25+.55*Math.sin(t2*Math.PI));
        ctx.beginPath(); ctx.arc(x,y,1.4+1.2*Math.sin(t2*Math.PI),0,TAU); ctx.fill();
      }
    }
  }

  /* --- 人体 --- */
  {
    const cache=getBodyCache(B);
    const bc=hex2rgb(V.body);
    ctx.save();
    ctx.translate(0,bodyOffY);
    ctx.shadowColor=rgbCss(bc,.40);
    ctx.shadowBlur=B*.14;
    ctx.drawImage(cache.cnv,-cache.wCss/2,cache.topY,cache.wCss,cache.hCss);
    ctx.shadowBlur=0;
    ctx.restore();
  }

  /* --- 十二の糸 — 環の感覚から、からだの部位へ --- */
  for(let k=0;k<12;k++){
    const s=SENSES[k];
    const isF=(k===focus);
    const isM=(fs.mirror===k);
    const tcol=TIERS[s.tier].col;
    const a=senA(k);
    const x0=Math.cos(a)*R*.90, y0=Math.sin(a)*R*.90;
    const [x1,y1]=bp(k);
    const mx=(x0+x1)/2*1.30, my=(y0+y1)/2*1.30;
    const al=(isF?.7:(isM?.45:.13))*(.4+.6*care[k]);
    ctx.strokeStyle=isF||isM?rgbCss(acc,al):rgbCss(tcol,al);
    ctx.lineWidth=isF?1.6:.9;
    if(isF){ ctx.setLineDash([3,6]); ctx.lineDashOffset=-nowSec*12; }
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.quadraticCurveTo(mx,my,x1,y1);
    ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset=0;
    /* 部位のともしび */
    const tw=.5+.5*Math.sin(nowSec*(s.heart?2.2:1.0)+k*1.7);
    const glow=(isF?1:(isM?.7:.30))*(.35+.65*care[k]);
    ctx.fillStyle=s.heart?`rgba(224,120,80,${.35+.6*glow*tw})`:rgbCss(mix3(tcol,acc,.3),(.25+.6*tw)*glow);
    if(isF||s.heart){ ctx.shadowColor=s.heart?"rgba(224,120,80,.9)":rgbCss(acc,.9); ctx.shadowBlur=8+6*tw; }
    ctx.beginPath(); ctx.arc(x1,y1,(s.heart?2.6:2.0)+1.6*tw*glow,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }

  /* --- 感覚の名（放射方向・外周から内へ）＋宮の記号 --- */
  const nameSize=Math.max(12,R*.056);
  for(let k=0;k<12;k++){
    const s=SENSES[k];
    const isF=(k===focus);
    const isM=(fs.mirror===k);
    const tcol=TIERS[s.tier].col;
    const chars=(s.tan+"覚").length<=3?(s.tan+"覚"):s.tan;   // 短名
    const label=s.n.length<=2? s.n : s.tan;
    const cs=(s.n.length<=3? s.n : s.tan+"感覚").split("");
    const a=senA(k);
    ctx.save(); ctx.rotate(a);
    const alpha=(.30+.62*care[k]);
    ctx.fillStyle=isF?rgbCss(acc,1):(isM?rgbCss(acc,.75):rgbCss(tcol,alpha));
    if(isF){ ctx.shadowColor=rgbCss(acc,.85); ctx.shadowBlur=10; }
    ctx.font=`${isF?600:400} ${nameSize*(isF?1.1:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    for(let c2=0;c2<cs.length;c2++){
      const rr=R*1.05+nameSize*(.5+(cs.length-1-c2)*1.10);
      ctx.save(); ctx.translate(rr,0); ctx.rotate(Math.PI/2);
      ctx.fillText(cs[c2],0,0);
      ctx.restore();
    }
    ctx.restore();
    ctx.shadowBlur=0;
  }

  /* --- ことば --- */
  const FT=(s2)=>`${s2}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  ctx.fillStyle=ink(.96);
  ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=16;
  ctx.font=`500 ${FT(R*.082)}`;
  ctx.fillText(fs.n,0,R*.46);
  ctx.shadowBlur=0;
  ctx.font=`400 ${FT(R*.036)}`;
  ctx.fillStyle=ink(.56);
  ctx.fillText(`${fs.yomi}${fs.n.endsWith("感覚")?"かんかく":"かく"}　—　${fs.sign}　｜　すみか ${fs.part}`,0,R*.535);
  ctx.font=`400 ${FT(R*.036)}`;
  ctx.fillStyle=rgbCss(TIERS[fs.tier].col,.9);
  ctx.fillText(`${TIERS[fs.tier].n}（${TIERS[fs.tier].age}にひらく）`,0,R*.595);
  ctx.font=`400 ${FT(R*.038)}`;
  ctx.fillStyle=ink(.78);
  ctx.fillText(fs.desc,0,R*.665);
  {
    const slot=Math.floor(nowSec/9)%2;
    const ph2=(nowSec%9)/9;
    const fade=Math.min(1,Math.min(ph2,1-ph2)*9);
    ctx.font=`400 ${FT(R*.030)}`;
    let line;
    if(slot===0){
      if(fs.mirror>=0 && fs.tier===2) line=MIRROR_SAYS[focus];
      else if(fs.mirror>=0) line=MIRROR_SAYS[fs.mirror];
      else if(fs.heart) line="熱感覚だけは、対をもたない——関心そのものだから、変容のまんなかに立つ";
      else line="中位の感覚は、下と上をつなぐ橋——世界の表情をうけとる";
      ctx.fillStyle=rgbCss(acc,.55*fade+.06);
    }else{
      const minC=Math.min(...care);
      const minK=care.indexOf(minC);
      line=minC<.75?`いちばん眠っている感覚——${SENSES[minK].n}。ふれて、ともし直す`
                   :"つかわない感覚は、しずかに眠る——環はひとりでにはとじない";
      ctx.fillStyle=ink(.36*fade+.05);
    }
    ctx.fillText(line,0,R*.735);
  }

  ctx.restore();
}

/* ============================================================
   メインループ
============================================================ */
window.__kan={
  set(p){ phase=((p%1)+1)%1; },
  get(){ return {phase,focus:SENSES[Math.floor(phase*12)%12].n,care:care.map(c=>+c.toFixed(2))}; },
};

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  if(!dragging && now-lastInteract>3000){
    phase=((phase+FLOWS[flowIdx].v*dt)%1+1)%1;
  }
  /* 感覚のともしび — 見つめられている感覚はよみがえり、ほかはゆっくり眠る */
  const focus=Math.floor(((phase%1)+1)%1*12)%12;
  for(let k=0;k<12;k++){
    if(k===focus) care[k]=Math.min(1,care[k]+dt*.25);
    else care[k]=Math.max(.30,care[k]-dt*.006);
  }

  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uTop,TOPC[0],TOPC[1],TOPC[2]);
  gl.uniform3f(U.uBot,BOTC[0],BOTC[1],BOTC[2]);
  const acc=hex2rgb(V.accent);
  gl.uniform3f(U.uAcc,acc[0],acc[1],acc[2]);
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawRing(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
