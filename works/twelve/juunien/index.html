<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>十二縁 | 「12」第六作</title>
<style>
  :root{ --ink:#ece5d8; --ink-dim:rgba(236,229,216,.55); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0b0a10; }
  body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;

    touch-action:none;
  }
  canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }

  #title{
    position:fixed; top:28px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.55em;
    font-size:clamp(14px,1.6vmin,19px); font-weight:500;

  }
  #title b{ font-weight:600; color:var(--ink); font-size:1.35em; letter-spacing:.4em; }
  #series{

    font-size:11px; color:rgba(236,229,216,.30); pointer-events:none;
  }

    display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .btn{
    font-family:inherit; font-size:12px; letter-spacing:.3em; text-indent:.3em;
    color:var(--ink-dim); background:transparent;
    border:1px solid rgba(236,229,216,.26); border-radius:999px;
    padding:8px 16px 7px 16px; cursor:pointer;
    transition:color .4s, border-color .4s, background .4s; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); border-color:rgba(236,229,216,.6); background:rgba(236,229,216,.06); }
  .btn.on{ color:var(--ink); border-color:rgba(236,229,216,.7); background:rgba(236,229,216,.08); }
  .seg{ display:flex; gap:8px; }
  .btn.small{ padding:7px 13px 6px 13px; font-size:11px; letter-spacing:.22em; text-indent:.22em; }
  #hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:11px; letter-spacing:.3em; color:rgba(236,229,216,.34);
    white-space:nowrap; pointer-events:none; transition:opacity 1.2s;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ring"></canvas>

 {k:"有",   yomi:"う",         sym:"身ごもった女",                 mean:"生存の、確定",                 band:2},
 {k:"生",   yomi:"しょう",     sym:"産まれおちる子",               mean:"出現の瞬間",                   band:3},
 {k:"老死", yomi:"ろうし",     sym:"亡骸を担いでゆく人",           mean:"崩壊と別れ——そして再び無明へ", band:3},

09 413.78787,336.25372 C 457.55139,346.20987 496.33307,370.5258 523.9449,405.32165 C 556.13062,445.88143 571.88147,503.67008 564.01116,552.32165 C 559.46161,580.44547 549.35599,609.67226 540.79615,619.46258 C 538.94042,621.58507 535.74485,625.42532 533.69487,627.99647 C 527.77115,635.42621 513.29454,646.91937 503.97833,651.58882 C 499.30333,653.93201 491.87833,656.76123 487.47833,657.87596 C 478.46181,660.16029 463.4579,661.07684 454.47833,659.89185 z M 191.28216,596.23796 C 189.00117,592.26457 183.01163,570.79136 180.91925,559.0857 C 171.62761,507.10432 185.45378,450.75781 218.05213,407.75616 C 253.28879,361.27421 310.13306,332.49951 368.47833,331.61009 C 380.32936,331.42943 380.6211,331.47999 391.97833,335.6822 C 404.34831,340.25914 408.98125,342.66425 418.72596,349.56777 C 431.3927,358.54136 445.27283,376.68421 450.51037,391.11348 C 451.78818,394.63379 453.6201,402.34072 454.58132,408.24 C 456.0706,417.38015 456.16081,420.39678 455.19148,428.6438 C 453.69516,441.37437 449.01272,456.85385 444.06567,465.42409 C 436.99934,477.66576 417.62754,494.1925 403.3983,500.1188 C 396.15152,503.13699 381.88607,506.47981 372.47833,507.36426 C 360.17775,508.52068 339.59472,503.53615 326.47833,496.22459 C 307.0294,485.38303 290.08864,464.07906 285.84792,445.12953 C 285.17456,442.12061 283.90318,439.31661 282.99087,438.82836 C 279.67454,437.05351 250.09326,453.20237 241.05372,461.72247 C 239.17019,463.49778 235.41904,466.93734 232.71785,469.36595 C 223.30475,477.82913 210.05205,496.05171 204.37668,508.3353 C 200.84261,515.98435 196.53939,528.42411 194.87862,535.79236 C 191.60723,550.30636 190.062,576.29689 192.01043,584.0348 C 192.61286,586.42729 192.96459,590.62057 192.79205,593.35321 C 192.51309,597.77122 192.34582,598.09081 191.28216,596.23796 z";
let _tomoePath=null;
function getTomoePath(){ if(!_tomoePath) _tomoePath=new Path2D(TOMOE_D); return _tomoePath; }
const CUT_AT=7;                       // 愛のindex＝切れ目は受(6)と愛(7)のあいだ
function segA(i){ return (-105+i*30)*Math.PI/180; }        // 因縁iの弧のはじまり（無明が真上中心）
function segC(i){ return (-90+i*30)*Math.PI/180; }         // 中心角
const GAP_DEG=-105+CUT_AT*30;                              // 受|愛の境界角（度・画面系）

/* ============================================================
   見た目3案
============================================================ */
const VORDER=["A","B","C"];
const VARIANTS={
  A:{ name:"夜輪", bg:["#0b0a10","#1c1626"], accent:"#d9b56a", moon:"#dfe4ea", shaft:.5 },
  B:{ name:"蘇芳", bg:["#140a08","#2e1410"], accent:"#d98a5a", moon:"#e8dcc8", shaft:.4 },
  C:{ name:"月白", bg:["#0b0d10","#181d22"], accent:"#ccd4dc", moon:"#e8ecf2", shaft:.55 },
};
const q0=new URLSearchParams(location.search);
let vKey=VARIANTS[(q0.get("v")||"A").toUpperCase()]?(q0.get("v")||"A").toUpperCase():"A";
let V=VARIANTS[vKey];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function rgbCss(c,a=1){ return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`; }
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
function smooth(t){ return t*t*(3-2*t); }
function bandCol(i){ return BANDS[NID[i].band].col; }

/* ============================================================
   WebGL2 — 香煙の夜
============================================================ */
const glCanvas=document.getElementById("gl");
const gl=glCanvas.getContext("webgl2",{antialias:false,alpha:false});
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position=vec4(aPos,0.,1.); }`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uBgA,uBgB,uAcc;
uniform float uEnergy;      // 環のいのち 0..1（滅ぶと闇へ）
uniform vec2 uMoon;         // 出口の月（uv座標）
uniform float uMoonGlow;
out vec4 fragColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; } return v; }
void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;
  float t=uTime;
  float rr=length(uv);
  /* 香煙 — たちのぼる */
  vec2 p=uv*2.0; p.y+=t*.03;
  vec2 q=vec2(fbm(p+t*.012), fbm(p+vec2(5.2,1.3)-t*.009));
  float f=fbm(p+2.3*q);
  vec3 col=mix(uBgA,uBgB,clamp(f*f*2.2,0.,1.));
  col=mix(col,uAcc*.42,clamp(length(q)*.7,0.,1.)*.24*uEnergy);
  /* 環のともしび */
  col+=uAcc*exp(-abs(rr-.40)*9.)*.10*uEnergy;
  /* 中心の熾 */
  col+=uAcc*exp(-rr*7.)*.16*(.3+.7*uEnergy);
  /* 出口の月 */
  {
    float d=length(uv-uMoon);
    col+=vec3(.85,.88,.92)*exp(-d*16.)*uMoonGlow*.8;
    col+=vec3(.85,.88,.92)*exp(-d*4.5)*uMoonGlow*.18;
  }
  /* 光塵 */
  {
    vec2 pp=uv*9.; pp.y-=t*.04;
    vec2 id=floor(pp), gv=fract(pp)-.5;
    float n=hash21(id);
    if(n<.25){
      vec2 off=(vec2(hash21(id+3.1),hash21(id+7.7))-.5)*.7;
      float d=length(gv-off);
      float tw=.5+.5*sin(t*(1.+n*2.)+n*40.);
      col+=uAcc*smoothstep(.045,.0,d)*tw*.20*(.3+.7*uEnergy);
    }
  }
  col*=1.-.44*pow(rr*1.24,2.2);
  col+=(hash21(frag+fract(t)*61.7)-.5)*.03;
  col=col/(1.+col*.12);
  col=pow(max(col,0.),vec3(.96));
  fragColor=vec4(col,1.);
}`;
function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uTime","uBgA","uBgB","uAcc","uEnergy","uMoon","uMoonGlow"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
let BGA=hex2rgb(V.bg[0]), BGB=hex2rgb(V.bg[1]);

/* ============================================================
   リングキャンバス
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||1280; H=window.innerHeight||800;
  glCanvas.width=Math.max(2,W*DPR); glCanvas.height=Math.max(2,H*DPR);
  ringCanvas.width=Math.max(2,W*DPR); ringCanvas.height=Math.max(2,H*DPR);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   状態
============================================================ */
let phase=(q0.get("p")?parseFloat(q0.get("p")):0);   // 観想の位置 0..1（focus= floor(phase*12)）
let flowIdx=1;
const FLOWS=[{n:"止",v:0},{n:"ゆるり",v:1/72},{n:"刹那",v:1/14}];   // 周/秒
let gyaku=false;                     // 逆観
let mode="flow";                     // flow | cut | still | rekindle
let modeT=-1e9;                      // モード開始時刻(秒)
let gazeN=-1, gazeT=-1e9;
let lastInteract=-1e9;
let flowOff=0;                       // 流れの粒のオフセット（連続）

function cx(){ return W/2; } function cy(){ return H/2; }
function ringR(){ return Math.min(W*.315, H*.36); }

/* 因縁iのいのち（0..1）— 断つ/静寂/再燃の物語 */
function linkEnergy(i,nowSec){
  const e=nowSec-modeT;
  /* 滅びは愛(7)から順に、環をひとめぐり */
  const cutOrder=((i-CUT_AT)%12+12)%12;
  /* 再燃は無明(0)から順に */
  const rekOrder=i;
  if(mode==="cut")   return Math.max(0,1-Math.max(0,(e-cutOrder*.75))/1.1);
  if(mode==="still") return 0;
  if(mode==="rekindle") return Math.min(1,Math.max(0,(e-rekOrder*.55))/0.9);
  return 1;
}
function wheelEnergy(nowSec){
  let s=0; for(let i=0;i<12;i++) s+=linkEnergy(i,nowSec);
  return s/12;
}

/* ============================================================
   入力
============================================================ */
function angleOf(e){
  const x=(e.clientX??e.touches?.[0]?.clientX)-cx();
  const y=(e.clientY??e.touches?.[0]?.clientY)-cy();
  return Math.atan2(y,x);
}
let dragging=false,dragA=0,dragMoved=0;
ringCanvas.addEventListener("pointerdown",e=>{
  dragging=true; dragMoved=0; dragA=angleOf(e);
  lastInteract=performance.now(); ringCanvas.classList.add("dragging");
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleOf(e);
  let da=a-dragA;
  if(da>Math.PI)da-=TAU; if(da<-Math.PI)da+=TAU;
  dragA=a; dragMoved+=Math.abs(da);
  phase=((phase+da/TAU)%1+1)%1;
  flowOff+=da/TAU;
  lastInteract=performance.now();
});
ringCanvas.addEventListener("pointerup",e=>{
  dragging=false; ringCanvas.classList.remove("dragging");
  lastInteract=performance.now();
  if(dragMoved<.02 && mode==="flow"){
    const x=e.clientX-cx(), y=e.clientY-cy();
    const rr=Math.hypot(x,y), R=ringR();
    if(rr>R*.68&&rr<R*1.45){
      const aDeg=Math.atan2(y,x)*180/Math.PI;
      let dGap=Math.abs(((aDeg-GAP_DEG)%360+360)%360); dGap=Math.min(dGap,360-dGap);
      if(dGap<7){ startCut(); }
      else{
        const idx=Math.floor((((aDeg+105)%360)+360)%360/30)%12;
        gazeN=idx; gazeT=performance.now()/1000;
      }
    }
  }
  hideHint();
});
window.addEventListener("wheel",e=>{
  phase=((phase+e.deltaY*2e-4)%1+1)%1;
  flowOff+=e.deltaY*2e-4;
  lastInteract=performance.now(); hideHint();
},{passive:true});
const segBtns=[...document.querySelectorAll("#flowSeg .btn")];
function setFlow(i){
  flowIdx=i;
  segBtns.forEach((b,j)=>b.classList.toggle("on",j===i));
}
segBtns.forEach((b,i)=>b.addEventListener("click",()=>{ setFlow(i); hideHint(); }));
window.addEventListener("keydown",e=>{
  if(e.key===" "){ setFlow(flowIdx===0?1:0); e.preventDefault(); }
  hideHint();
});
const dirBtn=document.getElementById("dirBtn");
dirBtn.addEventListener("click",()=>{
  gyaku=!gyaku;
  dirBtn.textContent="観　"+(gyaku?"逆観":"順観");
  hideHint();
});
function startCut(){
  if(mode!=="flow") return;
  mode="cut"; modeT=performance.now()/1000; gazeN=-1;
}
document.getElementById("cutBtn").addEventListener("click",()=>{ startCut(); hideHint(); });
const varBtn=document.getElementById("varBtn");
varBtn.textContent="見た目　"+V.name;
varBtn.addEventListener("click",()=>{
  vKey=VORDER[(VORDER.indexOf(vKey)+1)%VORDER.length];
  V=VARIANTS[vKey];
  BGA=hex2rgb(V.bg[0]); BGB=hex2rgb(V.bg[1]);
  document.body.style.background=V.bg[0];
  varBtn.textContent="見た目　"+V.name;
});
document.body.style.background=V.bg[0];
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500); }
setTimeout(hideHint,16000);

/* ============================================================
   リング描画
============================================================ */
function drawRing(now){
  const nowSec=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=ringR();
  const ink=(a)=>`rgba(236,229,216,${a})`;
  const acc=hex2rgb(V.accent);
  const focus=Math.floor(((phase%1)+1)%1*12)%12;
  const wE=wheelEnergy(nowSec);

  ctx.save();
  ctx.translate(cx(),cy());
  ctx.textAlign="center"; ctx.textBaseline="middle";

  /* --- 外縁：十二因縁の環 --- */
  ctx.strokeStyle=ink(.10+.30*wE); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  /* 36刻み（12×3） */
  for(let i=0;i<36;i++){
    const a=(-105+i*10)*Math.PI/180;
    const major=(i%3===0);
    ctx.strokeStyle=ink((major?.45:.18)*(.25+.75*wE));
    ctx.lineWidth=major?1.1:.6;
    const r1=major?R*.945:R*.962;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*R*.985,Math.sin(a)*R*.985);
    ctx.stroke();
  }

  const nameSize=Math.max(13,R*.072);
  for(let i=0;i<12;i++){
    const en=linkEnergy(i,nowSec);
    const isF=(i===focus && mode==="flow");
    const isG=(i===gazeN && nowSec-gazeT<10);
    const bcol=bandCol(i);
    const a0=segA(i), a1=segA(i+1);
    /* 因縁の弧 — 流れる破線。いのちが尽きると消える */
    ctx.strokeStyle=rgbCss(bcol,(.14+.42*en)*(isF?1.5:1));
    ctx.lineWidth=isF?2.6:1.5;
    ctx.setLineDash([7,6]);
    ctx.lineDashOffset=(gyaku?1:-1)*nowSec*14;
    if(isF){ ctx.shadowColor=rgbCss(bcol,.9); ctx.shadowBlur=10; }
    ctx.beginPath(); ctx.arc(0,0,R*.90,a0+.02,a1-.02); ctx.stroke();
    ctx.shadowBlur=0; ctx.setLineDash([]); ctx.lineDashOffset=0;
    /* 名（放射方向・外周から内へ） */
    const chars=NID[i].k.split("");
    const aC=segC(i);
    ctx.save(); ctx.rotate(aC);
    const al=(.30+.55*en);
    ctx.fillStyle=isF?rgbCss(mix3(bcol,acc,.5),Math.min(1,al+.25)):(isG?ink(.95):ink(al*.8));
    if(isF){ ctx.shadowColor=rgbCss(acc,.8); ctx.shadowBlur=10; }
    ctx.font=`${isF?600:400} ${nameSize*(isF?1.1:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    for(let c=0;c<chars.length;c++){
      const rr=R*1.09+nameSize*(.5+(chars.length-1-c)*1.14);
      ctx.save(); ctx.translate(rr,0); ctx.rotate(Math.PI/2);
      ctx.fillText(chars[c],0,0);
      ctx.restore();
    }
    ctx.restore();
    ctx.shadowBlur=0;
  }

  /* 三世の帯じるし（4つの弧） */
  const BANDSEG=[[0,2],[2,7],[7,10],[10,12]];
  for(let b=0;b<4;b++){
    const [s,e]=BANDSEG[b];
    ctx.strokeStyle=rgbCss(BANDS[b].col,.22*(.3+.7*wE));
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,R*1.045,segA(s)+.04,segA(e)-.04); ctx.stroke();
  }

  /* --- 切れ目の門 — 受と愛のあいだ --- */
  {
    const a=GAP_DEG*Math.PI/180;
    const breath=.5+.5*Math.sin(nowSec*1.1);
    const glow=(mode==="flow")?(.35+.45*breath):.9;
    ctx.strokeStyle=rgbCss(acc,glow);
    ctx.lineWidth=1.6;
    ctx.shadowColor=rgbCss(acc,.9); ctx.shadowBlur=8+8*breath;
    for(const rr of [R*.845,R*.955]){
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
      ctx.lineTo(Math.cos(a)*(rr+R*.02),Math.sin(a)*(rr+R*.02));
      ctx.stroke();
    }
    ctx.shadowBlur=0;
  }

  /* --- 縁の川 — 粒が因から果へ流れる --- */
  {
    const N=64;
    const dir=gyaku?-1:1;
    for(let k=0;k<N;k++){
      const u=((k/N + dir*flowOff)%1+1)%1;
      const aDeg=-105+u*360;
      const i=Math.floor(u*12)%12;
      const en=linkEnergy(i,nowSec);
      if(en<=.02) continue;
      const a=aDeg*Math.PI/180;
      const wob=Math.sin(nowSec*2.2+k*2.7)*R*.012;
      const rr=R*.90+wob;
      const tw=.5+.5*Math.sin(nowSec*3+k*1.7);
      ctx.fillStyle=rgbCss(mix3(bandCol(i),acc,.35),(.20+.55*tw)*en);
      ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,1.1+1.5*tw*en,0,TAU); ctx.fill();
    }
  }

  /* --- 内輪：六道（うすく） --- */
  ctx.strokeStyle=ink(.10*(.3+.7*wE)); ctx.lineWidth=.8;
  ctx.beginPath(); ctx.arc(0,0,R*.56,0,TAU); ctx.stroke();
  ctx.font=`400 ${Math.max(9,R*.038)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  for(let i=0;i<6;i++){
    const a=(-90+i*60)*Math.PI/180;
    ctx.fillStyle=ink(.20*(.25+.75*wE));
    ctx.fillText(RIKUDO[i],Math.cos(a)*R*.485,Math.sin(a)*R*.485);
  }

  /* --- 白黒の帯 — 善業はのぼり、悪業はくだる --- */
  {
    const rot=nowSec*.05*(gyaku?-1:1);
    ctx.lineWidth=R*.030;
    ctx.strokeStyle=`rgba(240,236,226,${.10*(.2+.8*wE)})`;
    ctx.beginPath(); ctx.arc(0,0,R*.335,rot+Math.PI,rot+TAU); ctx.stroke();
    ctx.strokeStyle=`rgba(8,8,12,${.5*(.2+.8*wE)})`;
    ctx.beginPath(); ctx.arc(0,0,R*.335,rot,rot+Math.PI); ctx.stroke();
  }

  /* --- 中心：左三つ巴紋（神紋の実パス・神マップより） --- */
  {
    const spin=nowSec*(mode==="flow"?.45:.12)*(gyaku?-1:1);
    const rc=R*.135;
    /* 地の円 */
    ctx.fillStyle="rgba(6,6,10,.60)";
    ctx.beginPath(); ctx.arc(0,0,rc*1.12,0,TAU); ctx.fill();
    ctx.strokeStyle=rgbCss(acc,.40*(.3+.7*wE)); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,rc*1.14,0,TAU); ctx.stroke();
    /* 紋 */
    ctx.save();
    ctx.rotate(spin);
    const s=(rc*2)/389;
    ctx.scale(s,s);
    ctx.translate(-372.05,-526.18);
    ctx.fillStyle=rgbCss(acc,.55+.42*wE);
    ctx.fill(getTomoePath());
    ctx.restore();
  }

  /* --- 出口の月（環のそと・右上） --- */
  {
    const mx=R*1.30, my=-R*1.02;
    const g=(mode==="still")?1:(mode==="cut"?.6:(.22+.10*Math.sin(nowSec*.5)));
    ctx.fillStyle=rgbCss(hex2rgb(V.moon),.55+.45*g);
    ctx.shadowColor=rgbCss(hex2rgb(V.moon),.9); ctx.shadowBlur=10+16*g;
    ctx.beginPath(); ctx.arc(mx,my,Math.max(3.5,R*.022),0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    if(mode==="still"||mode==="cut"){
      ctx.font=`400 ${Math.max(9,R*.036)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
      ctx.fillStyle=ink(.30+.40*g);
      ctx.fillText("環のそと",mx,my+R*.07);
    }
  }

  /* --- ことば --- */
  const FT=(s)=>`${s}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  if(mode==="flow"){
    const gz=(gazeN>=0 && nowSec-gazeT<10);
    const i=gz?gazeN:focus;
    const n=NID[i];
    const prev=NID[(i+11)%12];
    ctx.fillStyle=ink(.95);
    ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=18;
    ctx.font=`500 ${FT(R*.115)}`;
    ctx.fillText(n.k,0,R*.42);
    ctx.shadowBlur=0;
    ctx.font=`400 ${FT(R*.042)}`;
    ctx.fillStyle=ink(.55);
    ctx.fillText(`${n.yomi}　—　${n.sym}`,0,R*.515);
    ctx.font=`400 ${FT(R*.040)}`;
    ctx.fillStyle=rgbCss(bandCol(i),.85);
    ctx.fillText(n.mean,0,R*.585);
    ctx.font=`400 ${FT(R*.043)}`;
    ctx.fillStyle=ink(.70);
    ctx.fillText(gyaku?`${prev.k} 滅すれば、${n.k} 滅す`:`${prev.k} に縁りて、${n.k} 生ず`,0,R*.665);
    ctx.font=`400 ${FT(R*.030)}`;
    ctx.fillStyle=rgbCss(bandCol(i),.5);
    ctx.fillText(`${BANDS[NID[i].band].n}`,0,R*.73);
  }else{
    /* 断ち切りの物語 */
    const e=nowSec-modeT;
    let big="",small="";
    if(mode==="cut"){
      const k=Math.min(11,Math.floor(e/.75));
      const dying=NID[((CUT_AT+k)%12)];
      big=`${dying.k}、滅す`;
      small="受と愛のあいだで、環は切れる——渇きが立たなければ、次は生まれない";
    }else if(mode==="still"){
      big="寂";
      small="環がとけて、外の光だけがのこる";
    }else{
      const k=Math.min(11,Math.floor(e/.55));
      big=`${NID[k].k}、ふたたび`;
      small="それでも無明は目をさまし、環はもう一度めぐりはじめる";
    }
    ctx.fillStyle=ink(.92);
    ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=18;
    ctx.font=`500 ${FT(R*.105)}`;
    ctx.fillText(big,0,R*.44);
    ctx.shadowBlur=0;
    ctx.font=`400 ${FT(R*.036)}`;
    ctx.fillStyle=ink(.48);
    ctx.fillText(small,0,R*.545);
  }

  ctx.restore();
}

/* ============================================================
   メインループ
============================================================ */
window.__en={
  cut(){ startCut(); },
  get(){ return {phase,mode,gyaku,energy:wheelEnergy(performance.now()/1000)}; },
};

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  if(mode==="flow"){
    if(!dragging && now-lastInteract>3000){
      const v=FLOWS[flowIdx].v*(gyaku?-1:1);
      phase=((phase+v*dt)%1+1)%1;
      flowOff+=Math.abs(FLOWS[flowIdx].v)*dt;
    }
  }else{
    const e=t-modeT;
    if(mode==="cut" && e>11.5){ mode="still"; modeT=t; }
    else if(mode==="still" && e>6.5){ mode="rekindle"; modeT=t; }
    else if(mode==="rekindle" && e>7.5){ mode="flow"; modeT=t; }
  }

  const wE=wheelEnergy(t);
  const R=ringR();
  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uBgA,BGA[0],BGA[1],BGA[2]);
  gl.uniform3f(U.uBgB,BGB[0],BGB[1],BGB[2]);
  const acc=hex2rgb(V.accent);
  gl.uniform3f(U.uAcc,acc[0],acc[1],acc[2]);
  gl.uniform1f(U.uEnergy,wE);
  gl.uniform2f(U.uMoon, R*1.30/H, R*1.02/H);   // 月のuv座標（xは右へ・yは上へ）
  gl.uniform1f(U.uMoonGlow,(mode==="still")?1:(mode==="cut"?.5:.15));
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawRing(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
