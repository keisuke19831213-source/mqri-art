<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>十二夜叉 | 「12」第十作</title>
<style>
  :root{ --ink:#ece5d8; --ink-dim:rgba(236,229,216,.55); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#080b14; }
  body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #gl{ z-index:0; } #ring{ z-index:1; cursor:grab; }
  #ring.dragging{ cursor:grabbing; }
  #title{
    position:fixed; top:28px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.55em;
    font-size:clamp(14px,1.6vmin,19px); font-weight:500;
    color:var(--ink-dim); text-shadow:0 0 18px rgba(0,0,0,.5); pointer-events:none;
  }
  #title b{ font-weight:600; color:var(--ink); font-size:1.35em; letter-spacing:.4em; }
  #series{
    position:fixed; bottom:24px; left:30px; z-index:2;
    writing-mode:vertical-rl; letter-spacing:.4em;
    font-size:11px; color:rgba(236,229,216,.30); pointer-events:none;
  }
  #ctrl{ position:fixed; top:26px; right:30px; z-index:2;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .btn{
    font-family:inherit; font-size:12px; letter-spacing:.3em; text-indent:.3em;
    color:var(--ink-dim); background:transparent;
    border:1px solid rgba(236,229,216,.26); border-radius:999px;
    padding:8px 16px 7px 16px; cursor:pointer;
    transition:color .4s, border-color .4s, background .4s; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); border-color:rgba(236,229,216,.6); background:rgba(236,229,216,.06); }
  .btn.on{ color:var(--ink); border-color:rgba(236,229,216,.7); background:rgba(236,229,216,.08); }
  .seg{ display:flex; gap:8px; }
  .btn.small{ padding:7px 13px 6px 13px; font-size:11px; letter-spacing:.22em; text-indent:.22em; }
  #hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:11px; letter-spacing:.3em; color:rgba(236,229,216,.34);
    white-space:nowrap; pointer-events:none; transition:opacity 1.2s;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ring"></canvas>
<div id="title"><b>十二夜叉</b>　まもりは二時間ごとに、うけつがれる</div>
<div id="series">「12」— 円環の連作　第十</div>
<div id="ctrl">
  <div class="seg" id="flowSeg">
    <button class="btn small" data-f="0">止</button>
    <button class="btn small on" data-f="1">ゆるり</button>
    <button class="btn small" data-f="2">疾く</button>
  </div>
  <button class="btn" id="nowBtn">いまへ</button>
  <button class="btn" id="varBtn">見た目　瑠璃</button>
</div>
<div id="hint">将をタップ＝解説の間がひらく / 黒い粒＝煩悩、結界でしずむ / 真達羅だけ、素手の将</div>

<script>
"use strict";

/* ============================================================
   薬師十二神将 — 支の順（子=0）。持物・本地仏は一説
============================================================ */
const YASHA=[
 {n:"宮毘羅", yomi:"くびら",     bon:"クンビーラ",     rom:"kubira",   item:"太刀",   honji:"弥勒菩薩",
  lore:"ガンジスの鰐を神格化した水の神。日本へ渡って「こんぴらさん」——金毘羅権現とおなじ名をもつ、十二将の筆頭。"},
 {n:"伐折羅", yomi:"ばさら",     bon:"ヴァジュラ",     rom:"basara",   item:"宝剣",   honji:"勢至菩薩",
  lore:"名は金剛杵そのもの。新薬師寺の伐折羅像は怒髪天を衝く天平の傑作で、切手の顔にもなった。"},
 {n:"迷企羅", yomi:"めきら",     bon:"ミヒラ",         rom:"mekira",   item:"独鈷",   honji:"阿弥陀如来",
  lore:"名は太陽神ミトラに連なるとも。独鈷をにぎり、胸をはって持ち場をにらむ。"},
 {n:"安底羅", yomi:"あんてら",   bon:"アンディーラ",   rom:"antera",   item:"宝珠",   honji:"観音菩薩",
  lore:"宝珠をささげる将。掌の珠は、願いを映す薬師の光のかけら。"},
 {n:"頞儞羅", yomi:"あにら",     bon:"アニラ",         rom:"anira",    item:"矢",     honji:"摩利支天",
  lore:"名はアニラ——「風」。矢をつがえ、風よりはやく駆ける。"},
 {n:"珊底羅", yomi:"さんてら",   bon:"シャンディリヤ", rom:"santera",  item:"法螺貝", honji:"虚空蔵菩薩",
  lore:"法螺貝の将。ひと吹きで、七千の眷属を呼びあつめる。"},
 {n:"因達羅", yomi:"いんだら",   bon:"インドラ",       rom:"indara",   item:"鉾",     honji:"地蔵菩薩",
  lore:"名はインドラ——雷霆の神、帝釈天とおなじ名。今年・丙午の総大将。"},
 {n:"波夷羅", yomi:"はいら",     bon:"パジュラ",       rom:"haira",    item:"弓矢",   honji:"文殊菩薩",
  lore:"弓矢の将。ひきしぼった弦の静けさが、そのまま守りのかたち。"},
 {n:"摩虎羅", yomi:"まこら",     bon:"マホーラガ",     rom:"makora",   item:"斧",     honji:"大威徳明王",
  lore:"名はマホーラガ——大蟒神。大蛇の身の楽神が、斧をとって将となった。"},
 {n:"真達羅", yomi:"しんだら",   bon:"キンナラ",       rom:"shindara", item:"素手",   honji:"普賢菩薩", bare:true,
  lore:"名はキンナラ——天の楽人・緊那羅。だから武器を持たない。素手と歌でまもる、ただひとりの将。"},
 {n:"招杜羅", yomi:"しょうとら", bon:"チャトゥラ",     rom:"shotora",  item:"槌",     honji:"大日如来",
  lore:"槌の将。ひと打ちで邪気を砕く、寡黙なはたらき者。"},
 {n:"毘羯羅", yomi:"びから",     bon:"ヴィカラーラ",   rom:"bikara",   item:"三鈷杵", honji:"釈迦如来",
  lore:"名は「恐ろしき者」。本地は釈迦如来——末席の将で環はひと巡りし、また筆頭へ還る。"},
];
/* 像の出典（すべてCC0＝パブリックドメイン提供） */
const TNM="旧浄瑠璃寺伝来・十二神将立像（鎌倉時代）／東京国立博物館ほか蔵　CC0";
const MET="十二神将立像のうち（鎌倉時代）／メトロポリタン美術館・バークコレクション　CC0・支は見立て";
const CRED=[TNM,TNM,MET,MET,TNM,TNM,MET,MET,TNM,TNM,TNM,TNM];
/* 像の写真 — img/01_kubira.jpg のように置くと解説の間に入る */
const IMGS=YASHA.map((y,i)=>{
  const im=new Image();
  im.src=`img/${String(i+1).padStart(2,"0")}_${y.rom}.jpg`;
  im.onload=()=>{ im.ok=true; };
  return im;
});
const SHI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const KOKU_LABEL=(k)=>`${SHI[k]}の刻　${(k*2+23)%24}時〜${(k*2+1)%24}時`;
const TAU=Math.PI*2;
function shiA(k){ return (-90+k*30)*Math.PI/180; }   // 子＝真上（十二支の盤とおなじ向き）

/* 今年の総大将（2026=丙午→午の因達羅） */
function taishoOf(y){ return ((y-1984)%12+12)%12; }

/* ============================================================
   見た目3案
============================================================ */
const VORDER=["A","B","C"];
const VARIANTS={
  A:{ name:"瑠璃", bg:["#080b14","#101a30"], accent:"#d9b56a", ruri:[.16,.34,.68] },
  B:{ name:"護摩", bg:["#120b06","#2a180c"], accent:"#e0a050", ruri:[.20,.30,.55] },
  C:{ name:"月白", bg:["#0b0d10","#181e26"], accent:"#c9d2dc", ruri:[.22,.36,.60] },
};
const q0=new URLSearchParams(location.search);
let vKey=VARIANTS[(q0.get("v")||"A").toUpperCase()]?(q0.get("v")||"A").toUpperCase():"A";
let V=VARIANTS[vKey];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function rgbCss(c,a=1){ return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`; }
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }

/* ============================================================
   WebGL2 — 瑠璃光の夜
============================================================ */
const glCanvas=document.getElementById("gl");
const gl=glCanvas.getContext("webgl2",{antialias:false,alpha:false});
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position=vec4(aPos,0.,1.); }`;
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uBgA,uBgB,uRuri,uAcc;
uniform float uDuty;        // 当番の角（ラジアン・GL系）
out vec4 fragColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=rot(.5);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p*2.02+11.3; a*=.5; } return v; }
void main(){
  vec2 frag=gl_FragCoord.xy;
  vec2 uv=(frag-.5*uRes)/uRes.y;
  float t=uTime;
  float rr=length(uv), th=atan(uv.y,uv.x);
  vec2 p=uv*2.0;
  vec2 q=vec2(fbm(p+t*.010), fbm(p+vec2(5.2,1.3)-t*.008));
  float f=fbm(p+2.3*q);
  vec3 col=mix(uBgA,uBgB,clamp(f*f*2.2,0.,1.));
  /* 瑠璃のひかりが中心からにじむ */
  float pulse=.85+.15*sin(t*.7);
  col+=uRuri*exp(-rr*4.2)*.28*pulse;
  col+=uRuri*exp(-rr*11.)*.30*pulse;
  /* 当番の空がほのかにあたたまる */
  float w=cos(th-uDuty)*.5+.5;
  col+=uAcc*w*w*exp(-abs(rr-.40)*9.)*.10;
  /* 香煙 */
  col=mix(col,uRuri*.6,clamp(length(q)*.7,0.,1.)*.16);
  /* 遠い星 */
  {
    vec2 sp=uv*26.;
    vec2 id=floor(sp), gv=fract(sp)-.5;
    float n=hash21(id);
    if(n<.12){
      vec2 off=(vec2(hash21(id+3.1),hash21(id+7.7))-.5)*.8;
      float d=length(gv-off);
      col+=vec3(.9,.92,.95)*smoothstep(.05,.0,d)*(.5+.5*sin(t*(1.+n*3.)+n*40.))*.30;
    }
  }
  col*=1.-.44*pow(rr*1.24,2.2);
  col+=(hash21(frag+fract(t)*61.7)-.5)*.03;
  col=col/(1.+col*.12);
  col=pow(max(col,0.),vec3(.96));
  fragColor=vec4(col,1.);
}`;
function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uTime","uBgA","uBgB","uRuri","uAcc","uDuty"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
let BGA=hex2rgb(V.bg[0]), BGB=hex2rgb(V.bg[1]);

/* ============================================================
   リングキャンバス
============================================================ */
const ringCanvas=document.getElementById("ring");
const ctx=ringCanvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||1280; H=window.innerHeight||800;
  glCanvas.width=Math.max(2,W*DPR); glCanvas.height=Math.max(2,H*DPR);
  ringCanvas.width=Math.max(2,W*DPR); ringCanvas.height=Math.max(2,H*DPR);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
}
window.addEventListener("resize",resize); resize();

/* ============================================================
   状態 — 主変数は「時」（現地時刻・連続）
============================================================ */
function nowHour(){
  const d=new Date();
  return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600 + Math.floor(Date.now()/864e5)*24;
}
let tHour=(q0.get("hour")?parseFloat(q0.get("hour")):nowHour());
let targetHour=null;
let flowIdx=1;
const FLOWS=[{n:"止",v:0},{n:"ゆるり",v:.25},{n:"疾く",v:1.5}];   // 時間/秒
let hostA=null;               // 眷属の陣の角（rate-limited chase）
const CHASE_A=1.6;            // rad/s
let subdued=0;                // しずめた煩悩の数（尽きない）
let panelIdx=-1, panelA=0;    // 解説の間
let lastInteract=-1e9;

function cx(){ return W/2; } function cy(){ return H/2; }
function ringR(){ return Math.min(W*.30, H*.34); }
function kokuOf(h){ return Math.floor((((h%24)+24)%24+1)/2)%12; }

/* ============================================================
   入力
============================================================ */
function angleOf(e){
  const x=(e.clientX??e.touches?.[0]?.clientX)-cx();
  const y=(e.clientY??e.touches?.[0]?.clientY)-cy();
  return Math.atan2(y,x);
}
let dragging=false,dragA=0,dragMoved=0;
ringCanvas.addEventListener("pointerdown",e=>{
  dragging=true; dragMoved=0; dragA=angleOf(e); targetHour=null;
  lastInteract=performance.now(); ringCanvas.classList.add("dragging");
  ringCanvas.setPointerCapture(e.pointerId);
});
ringCanvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleOf(e);
  let da=a-dragA;
  if(da>Math.PI)da-=TAU; if(da<-Math.PI)da+=TAU;
  dragA=a; dragMoved+=Math.abs(da);
  tHour += da/TAU*24;                     // 一周＝一日
  lastInteract=performance.now();
});
ringCanvas.addEventListener("pointerup",e=>{
  dragging=false; ringCanvas.classList.remove("dragging");
  lastInteract=performance.now();
  if(dragMoved<.02){
    if(panelIdx>=0){ panelIdx=-1; hideHint(); return; }   // 解説の間をとじる
    const x=e.clientX-cx(), y=e.clientY-cy();
    const rr=Math.hypot(x,y), R=ringR();
    if(rr>R*.55&&rr<R*1.45){
      const aDeg=Math.atan2(y,x)*180/Math.PI;
      panelIdx=Math.floor(((aDeg+90+15)%360+360)%360/30)%12;   // 解説の間をひらく
    }
  }
  hideHint();
});
window.addEventListener("wheel",e=>{
  tHour+=e.deltaY*3e-3; targetHour=null;
  lastInteract=performance.now(); hideHint();
},{passive:true});
const segBtns=[...document.querySelectorAll("#flowSeg .btn")];
function setFlow(i){
  flowIdx=i;
  segBtns.forEach((b,j)=>b.classList.toggle("on",j===i));
}
segBtns.forEach((b,i)=>b.addEventListener("click",()=>{ setFlow(i); hideHint(); }));
window.addEventListener("keydown",e=>{
  if(e.key===" "){ setFlow(flowIdx===0?1:0); e.preventDefault(); }
  hideHint();
});
document.getElementById("nowBtn").addEventListener("click",()=>{
  targetHour=nowHour(); lastInteract=performance.now(); hideHint();
});
const varBtn=document.getElementById("varBtn");
varBtn.textContent="見た目　"+V.name;
varBtn.addEventListener("click",()=>{
  vKey=VORDER[(VORDER.indexOf(vKey)+1)%VORDER.length];
  V=VARIANTS[vKey];
  BGA=hex2rgb(V.bg[0]); BGB=hex2rgb(V.bg[1]);
  document.body.style.background=V.bg[0];
  varBtn.textContent="見た目　"+V.name;
});
document.body.style.background=V.bg[0];
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true;
  setTimeout(()=>document.getElementById("hint").classList.add("hide"),2500); }
setTimeout(hideHint,16000);

/* ============================================================
   煩悩の粒と、しずめの閃き
============================================================ */
let bonnou=[], flashes=[];
function spawnBonnou(R){
  const a=Math.random()*TAU;
  bonnou.push({a, r:R*1.38, sp:R*(.05+.05*Math.random()), wob:Math.random()*TAU, sz:1.6+2.2*Math.random()});
}

/* ============================================================
   描画
============================================================ */
function drawRing(now,dt){
  const nowSec=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const R=ringR();
  const ink=(a)=>`rgba(236,229,216,${a})`;
  const acc=hex2rgb(V.accent);
  const koku=kokuOf(tHour);
  const dutyA=shiA(koku);   // 総大将は2026＝丙午の因達羅（k=6）で据えおき

  /* 眷属の陣 — 追いつけない速さでは歩調を落として次の持ち場へ */
  if(hostA===null || !isFinite(hostA)) hostA=dutyA;
  {
    const dts=(isFinite(dt)&&dt>0)?dt:1/60;
    let d=dutyA-hostA;
    while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
    const step=Math.max(-CHASE_A*dts,Math.min(CHASE_A*dts,d));
    hostA+=step;
    /* -π..π にたたむ（走り去り防止） */
    hostA=Math.atan2(Math.sin(hostA),Math.cos(hostA));
  }

  ctx.save();
  ctx.translate(cx(),cy());
  ctx.textAlign="center"; ctx.textBaseline="middle";

  /* --- 環と目盛 --- */
  ctx.strokeStyle=ink(.36); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  ctx.strokeStyle=ink(.13);
  ctx.beginPath(); ctx.arc(0,0,R*.985,0,TAU); ctx.stroke();
  for(let i=0;i<48;i++){
    const a=(-90+i*7.5-15)*Math.PI/180;
    const major=(i%4===0);
    ctx.strokeStyle=ink(major?.42:.16);
    ctx.lineWidth=major?1.1:.6;
    const r1=major?R*.948:R*.963;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*R*.985,Math.sin(a)*R*.985);
    ctx.stroke();
  }
  /* 方位（三将ずつ四方をまもる）— 環の内がわに */
  ctx.font=`400 ${Math.max(9,R*.034)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  for(const [nm,deg] of [["北",0],["東",90],["南",180],["西",270]]){
    const a=(-90+deg-15)*Math.PI/180;
    ctx.fillStyle=ink(deg===0?.34:.20);
    ctx.fillText(nm,Math.cos(a)*R*.62,Math.sin(a)*R*.62);
  }

  /* --- 結界のまく（当番の弧があつい） --- */
  {
    for(let i=0;i<60;i++){
      const a=i/60*TAU;
      let d=a-hostA;
      while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
      const s=Math.max(0,Math.min(1,1-Math.abs(d)/2.2));
      if(s<=.03) continue;
      ctx.strokeStyle=rgbCss(acc,.05+.16*s);
      ctx.lineWidth=1+2.2*s;
      ctx.beginPath(); ctx.arc(0,0,R*.945,a-.055,a+.055); ctx.stroke();
    }
  }

  /* --- 十二将 --- */
  const nameSize=Math.max(12,R*.056);
  for(let k=0;k<12;k++){
    const y=YASHA[k];
    const a=shiA(k);
    const isDuty=(k===koku);
    const isTaisho=(k===6);   // 2026＝午の因達羅
    /* 頭上の支（新様）— 名のすぐ内がわ、環の上に */
    ctx.fillStyle=isDuty?rgbCss(acc,.85):ink(.26);
    ctx.font=`400 ${nameSize*.58}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillText(SHI[k],Math.cos(a)*R*.80,Math.sin(a)*R*.80);
    /* 名（放射方向・外周から内へ） */
    const chars=y.n.split("");
    ctx.save(); ctx.rotate(a);
    ctx.fillStyle=isDuty?rgbCss(acc,1):ink(isTaisho?.66:.50);
    if(isDuty){ ctx.shadowColor=rgbCss(acc,.85); ctx.shadowBlur=10; }
    ctx.font=`${isDuty?600:400} ${nameSize*(isDuty?1.12:1)}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
    for(let c2=0;c2<chars.length;c2++){
      const rr=R*1.05+nameSize*(.5+(chars.length-1-c2)*1.10);
      ctx.save(); ctx.translate(rr,0); ctx.rotate(Math.PI/2);
      ctx.fillText(chars[c2],0,0);
      ctx.restore();
    }
    ctx.restore();
    ctx.shadowBlur=0;
    /* 総大将の座 — 小さな冠 */
    if(isTaisho){
      const x=Math.cos(a)*R*.905, yy=Math.sin(a)*R*.905;
      ctx.strokeStyle=rgbCss(acc,.75);
      ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(x,yy,3.8,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
    }
    /* ひかえの眷属 */
    if(!isDuty){
      for(let d2=0;d2<3;d2++){
        const aa=a+(d2-1)*.05;
        const tw=.4+.4*Math.sin(nowSec*(0.8+d2*.3)+k*2.1);
        ctx.fillStyle=ink(.14+.14*tw);
        ctx.beginPath(); ctx.arc(Math.cos(aa)*R*.885,Math.sin(aa)*R*.885,1.1,0,TAU); ctx.fill();
      }
    }
  }

  /* --- 七千の眷属 — 当番の陣 --- */
  {
    const N=110;
    for(let k=0;k<N;k++){
      const hs=Math.sin(k*127.1)*43758.545;
      const spread=((hs-Math.floor(hs))-.5)*1.15;
      const flow=Math.sin(nowSec*(0.5+((k*7)%10)*.06)+k*1.7)*.10;
      const a=hostA+spread+flow;
      const rr=R*(.865+.035*Math.sin(nowSec*1.3+k*2.3));
      const tw=.5+.5*Math.sin(nowSec*(1.2+(k%7)*.21)+k*2.9);
      ctx.fillStyle=rgbCss(mix3(acc,[1,1,.92],.3),(.16+.5*tw)*(1-Math.abs(spread)/.62));
      ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,.8+1.3*tw,0,TAU); ctx.fill();
    }
  }

  /* --- 煩悩 — 闇から漂いより、結界でしずむ --- */
  {
    if(bonnou.length<12 && Math.random()<dt*1.6) spawnBonnou(R);
    for(let i=bonnou.length-1;i>=0;i--){
      const b=bonnou[i];
      b.r-=b.sp*dt*10;
      b.a+=Math.sin(nowSec*.9+b.wob)*.0035;
      if(b.r<=R*.955){
        flashes.push({a:b.a,r:R*.95,t:nowSec});
        subdued++;
        bonnou.splice(i,1);
        continue;
      }
      const x=Math.cos(b.a)*b.r, y=Math.sin(b.a)*b.r;
      ctx.fillStyle=`rgba(18,14,22,.78)`;
      ctx.strokeStyle=`rgba(90,70,110,.35)`;
      ctx.lineWidth=.8;
      ctx.beginPath(); ctx.arc(x,y,b.sz,0,TAU); ctx.fill(); ctx.stroke();
    }
    for(let i=flashes.length-1;i>=0;i--){
      const f2=flashes[i];
      const e=nowSec-f2.t;
      if(e>.7){ flashes.splice(i,1); continue; }
      const x=Math.cos(f2.a)*f2.r, y=Math.sin(f2.a)*f2.r;
      ctx.strokeStyle=rgbCss(acc,.8*(1-e/.7));
      ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(x,y,2+e*22,0,TAU); ctx.stroke();
    }
  }

  /* --- 中心：薬師瑠璃光 — 日光と月光をしたがえて --- */
  {
    const rc=R*.13;
    const pulse=.85+.15*Math.sin(nowSec*.7);
    const g=ctx.createRadialGradient(0,0,0,0,0,rc*1.6);
    g.addColorStop(0,rgbCss(mix3(V.ruri,[1,1,1],.45),.85*pulse));
    g.addColorStop(.45,rgbCss(V.ruri,.55*pulse));
    g.addColorStop(1,rgbCss(V.ruri,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,0,rc*1.6,0,TAU); ctx.fill();
    ctx.strokeStyle=rgbCss(mix3(V.ruri,[1,1,1],.5),.5);
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,rc,0,TAU); ctx.stroke();
    /* 日光・月光 */
    const oa=nowSec*.20;
    for(const [ph,col2,r2] of [[0,[1,.85,.45],2.6],[Math.PI,[.85,.90,1],2.2]]){
      const x=Math.cos(oa+ph)*rc*1.95, y=Math.sin(oa+ph)*rc*1.95*.38;
      ctx.fillStyle=rgbCss(col2,.9);
      ctx.shadowColor=rgbCss(col2,.9); ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(x,y,r2,0,TAU); ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  /* --- ことば --- */
  const FT=(s)=>`${s}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  const y2=YASHA[koku];
  ctx.fillStyle=ink(.95);
  ctx.shadowColor="rgba(0,0,0,.55)"; ctx.shadowBlur=16;
  ctx.font=`500 ${FT(R*.088)}`;
  ctx.fillText(y2.n,0,R*.435);
  ctx.shadowBlur=0;
  ctx.font=`400 ${FT(R*.036)}`;
  ctx.fillStyle=ink(.56);
  ctx.fillText(`${y2.yomi}　${y2.bon}　—　持物 ${y2.item}　｜　本地 ${y2.honji}（一説）`,0,R*.51);
  ctx.font=`400 ${FT(R*.038)}`;
  ctx.fillStyle=ink(.66);
  ctx.fillText(`${KOKU_LABEL(koku)}　——いまの当番${koku===6?"　｜　今年の総大将（丙午）":""}`,0,R*.575);
  {
    const hh=Math.floor(((tHour%24)+24)%24), mm=Math.floor((((tHour%24)+24)%24-hh)*60);
    ctx.font=`500 ${FT(R*.042)}`;
    ctx.fillStyle=ink(.80);
    ctx.fillText(`${hh}時${String(mm).padStart(2,"0")}分`,0,R*.645);
    const slot=Math.floor(nowSec/9)%2;
    const ph=(nowSec%9)/9;
    const fade=Math.min(1,Math.min(ph,1-ph)*9);
    ctx.font=`400 ${FT(R*.030)}`;
    ctx.fillStyle=ink(.36*fade+.05);
    ctx.fillText(slot===0
      ?`一将に七千の眷属——十二将で八万四千。人の煩悩と、おなじ数`
      :`しずめた煩悩 ${subdued.toLocaleString()}——それでも尽きない。だから環は閉じずに、まもりは明日へつづく`,0,R*.71);
  }

  ctx.restore();

  /* --- 解説の間 --- */
  if(panelA>.01) drawPanel(nowSec,R);
}

/* ============================================================
   解説の間 — 将の像と物語（img/NN_name.jpg を置けば写真が入る）
============================================================ */
function wrapJP(text,maxW){
  const out=[]; let line="";
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW){ out.push(line); line=ch; }
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
/* 持物の線画 */
function drawItemGlyph(item,s){
  ctx.lineWidth=Math.max(1.6,s*.045);
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.beginPath();
  switch(item){
    case "太刀":
      ctx.moveTo(-s*.30,s*.38); ctx.quadraticCurveTo(s*.10,s*.05,-s*.02,-s*.42);
      ctx.moveTo(-s*.22,s*.26); ctx.lineTo(-s*.06,s*.34);
      break;
    case "宝剣":
      ctx.moveTo(0,-s*.46); ctx.lineTo(-s*.07,-s*.30); ctx.lineTo(-s*.07,s*.18);
      ctx.lineTo(0,s*.24); ctx.lineTo(s*.07,s*.18); ctx.lineTo(s*.07,-s*.30); ctx.closePath();
      ctx.moveTo(-s*.18,s*.24); ctx.lineTo(s*.18,s*.24);
      ctx.moveTo(0,s*.24); ctx.lineTo(0,s*.44);
      break;
    case "独鈷":
      ctx.moveTo(0,-s*.44); ctx.lineTo(0,s*.44);
      ctx.moveTo(-s*.09,-s*.28); ctx.quadraticCurveTo(0,-s*.40,s*.09,-s*.28);
      ctx.moveTo(-s*.09,s*.28); ctx.quadraticCurveTo(0,s*.40,s*.09,s*.28);
      ctx.moveTo(-s*.07,0); ctx.quadraticCurveTo(0,-s*.08,s*.07,0);
      ctx.moveTo(-s*.07,0); ctx.quadraticCurveTo(0,s*.08,s*.07,0);
      break;
    case "宝珠":
      ctx.moveTo(0,-s*.42);
      ctx.quadraticCurveTo(s*.34,-s*.10,s*.26,s*.16);
      ctx.quadraticCurveTo(s*.16,s*.38,0,s*.38);
      ctx.quadraticCurveTo(-s*.16,s*.38,-s*.26,s*.16);
      ctx.quadraticCurveTo(-s*.34,-s*.10,0,-s*.42);
      ctx.moveTo(-s*.12,-s*.30); ctx.quadraticCurveTo(-s*.22,-s*.44,-s*.10,-s*.52);
      ctx.moveTo(s*.12,-s*.30); ctx.quadraticCurveTo(s*.22,-s*.44,s*.10,-s*.52);
      break;
    case "矢":
      ctx.moveTo(0,-s*.46); ctx.lineTo(0,s*.36);
      ctx.moveTo(0,-s*.46); ctx.lineTo(-s*.09,-s*.32);
      ctx.moveTo(0,-s*.46); ctx.lineTo(s*.09,-s*.32);
      ctx.moveTo(0,s*.36); ctx.lineTo(-s*.10,s*.48);
      ctx.moveTo(0,s*.36); ctx.lineTo(s*.10,s*.48);
      ctx.moveTo(0,s*.24); ctx.lineTo(-s*.10,s*.36);
      ctx.moveTo(0,s*.24); ctx.lineTo(s*.10,s*.36);
      break;
    case "法螺貝":
      for(let i=0;i<40;i++){
        const t=i/40*TAU*1.9;
        const r=s*.06+t*s*.055;
        const x=Math.cos(t)*r, y=Math.sin(t)*r*.8;
        if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      break;
    case "鉾":
      ctx.moveTo(0,s*.48); ctx.lineTo(0,-s*.16);
      ctx.moveTo(0,-s*.46); ctx.quadraticCurveTo(-s*.13,-s*.28,0,-s*.14);
      ctx.quadraticCurveTo(s*.13,-s*.28,0,-s*.46);
      ctx.moveTo(-s*.10,-s*.12); ctx.lineTo(s*.10,-s*.12);
      break;
    case "弓矢":
      ctx.moveTo(-s*.16,-s*.44); ctx.quadraticCurveTo(s*.34,0,-s*.16,s*.44);
      ctx.moveTo(-s*.16,-s*.44); ctx.lineTo(-s*.16,s*.44);
      ctx.moveTo(-s*.16,0); ctx.lineTo(s*.30,0);
      ctx.moveTo(s*.30,0); ctx.lineTo(s*.18,-s*.07);
      ctx.moveTo(s*.30,0); ctx.lineTo(s*.18,s*.07);
      break;
    case "斧":
      ctx.moveTo(-s*.06,s*.46); ctx.lineTo(s*.10,-s*.34);
      ctx.moveTo(s*.02,-s*.38); ctx.quadraticCurveTo(-s*.30,-s*.34,-s*.26,-s*.06);
      ctx.quadraticCurveTo(-s*.06,-s*.10,s*.10,-s*.30);
      break;
    case "素手":
      ctx.moveTo(-s*.16,s*.40); ctx.lineTo(-s*.16,-s*.02);
      for(let f=0;f<4;f++){
        const x=-s*.15+f*s*.10;
        ctx.moveTo(x,-s*.02); ctx.lineTo(x,-s*(.30+((f===1||f===2)?.08:0)));
      }
      ctx.moveTo(-s*.16,s*.06); ctx.quadraticCurveTo(-s*.30,s*.02,-s*.28,-s*.12);
      ctx.moveTo(-s*.16,s*.40); ctx.quadraticCurveTo(0,s*.48,s*.16,s*.40);
      ctx.moveTo(s*.16,s*.40); ctx.lineTo(s*.16,-s*.02);
      break;
    case "槌":
      ctx.moveTo(0,s*.46); ctx.lineTo(0,-s*.10);
      ctx.rect(-s*.20,-s*.42,s*.40,s*.26);
      break;
    case "三鈷杵":
      ctx.moveTo(0,-s*.44); ctx.lineTo(0,s*.44);
      for(const sg of [-1,1]){
        ctx.moveTo(sg*s*.13,-s*.20); ctx.quadraticCurveTo(sg*s*.16,-s*.36,0,-s*.44);
        ctx.moveTo(sg*s*.13,s*.20); ctx.quadraticCurveTo(sg*s*.16,s*.36,0,s*.44);
      }
      ctx.moveTo(-s*.08,0); ctx.quadraticCurveTo(0,-s*.07,s*.08,0);
      ctx.moveTo(-s*.08,0); ctx.quadraticCurveTo(0,s*.07,s*.08,0);
      break;
  }
  ctx.stroke();
}
function drawPanel(nowSec,R){
  const y=YASHA[panelIdx<0?0:panelIdx];
  const k=panelIdx<0?0:panelIdx;
  const acc=hex2rgb(V.accent);
  const ink=(a)=>`rgba(236,229,216,${a})`;
  const FT=(s)=>`${s}px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  const ease=panelA*panelA*(3-2*panelA);
  const im=IMGS[k];
  const landscape=(W>=560 && W>H*.9);
  const pw=landscape?Math.min(W*.92,820):Math.min(W*.94,520);
  const ph=landscape?Math.min(H*.90,560):Math.min(H*.92,760);
  const pad=14;
  ctx.save();
  ctx.translate(cx(),cy());
  ctx.globalAlpha=ease;
  /* とばり */
  ctx.fillStyle="rgba(3,4,9,.78)";
  ctx.fillRect(-W/2,-H/2,W,H);
  /* 紙 */
  const px=-pw/2, py=-ph/2;
  ctx.fillStyle="rgba(13,14,22,.97)";
  ctx.strokeStyle=rgbCss(acc,.5);
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(px,py,pw,ph,10); ctx.fill(); ctx.stroke();

  /* 像のまど — 全身がまるごと入る（contain） */
  const iw=landscape?pw*.42:pw-2*pad;
  const ih=landscape?ph-2*pad:ph*.50;
  const ix=px+pad, iy=py+pad;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(ix,iy,iw,ih,7); ctx.clip();
  ctx.fillStyle="rgba(5,6,12,.95)";
  ctx.fillRect(ix,iy,iw,ih);
  if(im && im.ok){
    /* 台座のほのあかり */
    const bgc=ctx.createRadialGradient(ix+iw/2,iy+ih*.62,0,ix+iw/2,iy+ih*.62,Math.max(iw,ih)*.7);
    bgc.addColorStop(0,rgbCss(acc,.10));
    bgc.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=bgc;
    ctx.fillRect(ix,iy,iw,ih);
    /* contain＝像はぜったいに切らない */
    const sc=Math.min((iw-10)/im.width,(ih-34)/im.height);
    const dw=im.width*sc, dh=im.height*sc;
    ctx.drawImage(im, ix+(iw-dw)/2, iy+(ih-28-dh)/2+4, dw, dh);
    /* 出典のすそ */
    const sg=ctx.createLinearGradient(0,iy+ih-30,0,iy+ih);
    sg.addColorStop(0,"rgba(0,0,0,0)");
    sg.addColorStop(1,"rgba(0,0,0,.8)");
    ctx.fillStyle=sg;
    ctx.fillRect(ix,iy+ih-30,iw,30);
    ctx.fillStyle=ink(.52);
    ctx.font=`400 ${FT(Math.max(8,Math.min(11,iw*.028)))}`;
    ctx.textAlign="center";
    ctx.fillText(CRED[k],ix+iw/2,iy+ih-10,iw-12);
  }else{
    ctx.fillStyle=ink(.05);
    ctx.font=`500 ${FT(ih*.66)}`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(SHI[k],ix+iw/2,iy+ih/2);
    ctx.save();
    ctx.translate(ix+iw/2,iy+ih/2);
    ctx.strokeStyle=rgbCss(acc,.85);
    drawItemGlyph(y.item,Math.min(iw,ih)*.34);
    ctx.restore();
    ctx.fillStyle=ink(.22);
    ctx.font=`400 ${FT(10)}`;
    ctx.fillText(`img/${String(k+1).padStart(2,"0")}_${y.rom}.jpg を置くと、像の写真が入ります`,ix+iw/2,iy+ih-14,iw-10);
  }
  ctx.restore();

  /* ことば — 基準サイズは「使える高さ」から決める（あふれ防止） */
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const tx=landscape?(ix+iw+ (px+pw-(ix+iw))/2):0;
  const tw=landscape?(px+pw-(ix+iw)-pad*2):(pw-2*pad);
  const avail=landscape?(ph-2*pad):(ph-ih-2*pad);
  const base=Math.min(landscape?ph:pw, avail*1.45, tw*2.4);
  let ty=landscape?py+ph*.14:iy+ih+avail*.16;
  ctx.fillStyle=ink(.96);
  ctx.font=`500 ${FT(base*.115)}`;
  ctx.fillText(y.n,tx,ty);
  ty+=base*.095;
  ctx.fillStyle=rgbCss(acc,.85);
  ctx.font=`400 ${FT(base*.042)}`;
  ctx.fillText(`${y.yomi}　—　梵名 ${y.bon}`,tx,ty,tw);
  ty+=base*.075;
  ctx.fillStyle=ink(.60);
  ctx.font=`400 ${FT(base*.038)}`;
  ctx.fillText(`${SHI[k]}の座　${KOKU_LABEL(k)}`,tx,ty,tw);
  ty+=base*.062;
  ctx.fillText(`持物 ${y.item}　｜　本地 ${y.honji}（一説）${k===6?"　｜　今年の総大将":""}`,tx,ty,tw);
  ty+=base*.085;
  ctx.fillStyle=ink(.80);
  ctx.font=`400 ${FT(base*.043)}`;
  const lines=wrapJP(y.lore,tw*.96);
  for(const ln of lines){ ctx.fillText(ln,tx,ty); ty+=base*.066; }
  ctx.fillStyle=ink(.26);
  ctx.font=`400 ${FT(Math.max(9,base*.028))}`;
  ctx.fillText("どこかにふれると、とじる",tx,py+ph-base*.045);
  ctx.restore();
}

/* ============================================================
   メインループ
============================================================ */
window.__yasha={
  setHour(x){ tHour=x; targetHour=null; },
  get(){ return {tHour, duty:YASHA[kokuOf(tHour)].n, subdued}; },
};

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  const t=now/1000;

  if(!dragging && targetHour===null && now-lastInteract>3000){
    tHour+=FLOWS[flowIdx].v*dt;
  }
  if(targetHour!==null){
    tHour+=(targetHour-tHour)*Math.min(1,dt*3.5);
    if(Math.abs(targetHour-tHour)<.002){ tHour=targetHour; targetHour=null; }
  }
  panelA+=((panelIdx>=0?1:0)-panelA)*Math.min(1,dt*9);

  const koku=kokuOf(tHour);
  const dutyA=shiA(koku);
  gl.uniform2f(U.uRes,glCanvas.width,glCanvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uBgA,BGA[0],BGA[1],BGA[2]);
  gl.uniform3f(U.uBgB,BGB[0],BGB[1],BGB[2]);
  gl.uniform3f(U.uRuri,V.ruri[0],V.ruri[1],V.ruri[2]);
  const acc=hex2rgb(V.accent);
  gl.uniform3f(U.uAcc,acc[0],acc[1],acc[2]);
  gl.uniform1f(U.uDuty,-dutyA);
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawRing(now,dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
