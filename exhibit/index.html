<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MQRI ART 展示モード — 作品を全画面で自動巡回する投影用ページ。会場・常設展示・iPad展示に。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>MQRI ART — 展示モード（投影用）</title>
<style>
  :root{--gold:#d9b26a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;cursor:none}
  body{font-family:"Hiragino Mincho ProN","YuMincho",serif;color:#f2efe6}
  .stage{position:fixed;inset:0;background:#000}
  .layer{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity var(--fade,2400ms) ease-in-out;border:0;display:block}
  .layer.on{opacity:1}

  /* 明るい作品の上でもキャプションが読めるよう、ラベルの背後だけ落とす */
  .scrim{position:fixed;left:0;bottom:0;width:840px;max-width:72vw;height:470px;max-height:64vh;z-index:15;pointer-events:none;
    background:radial-gradient(130% 120% at 0% 100%, rgba(0,0,0,.78), rgba(0,0,0,.30) 44%, transparent 70%);
    opacity:0;transition:opacity 1.2s ease}
  .scrim.show{opacity:1}

  /* 美術館の壁ラベル（作品が変わるたびに出て、読める長さで消える） */
  .label{position:fixed;left:max(44px, env(safe-area-inset-left));bottom:max(40px, env(safe-area-inset-bottom));z-index:20;opacity:0;transform:translateY(8px);
    transition:opacity 1.1s ease,transform 1.1s ease;pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.9)}
  .label.show{opacity:1;transform:translateY(0)}
  .label .no{font-family:"Helvetica Neue",sans-serif;font-size:12px;letter-spacing:.34em;color:var(--gold)}
  .label .ttl{font-size:30px;font-weight:600;letter-spacing:.05em;margin-top:8px}
  .label .en{font-family:"Helvetica Neue",sans-serif;font-size:12px;letter-spacing:.28em;color:#b7b1c2;margin-top:6px;text-transform:uppercase}
  .label .rule{width:40px;height:1px;background:var(--gold);opacity:.55;margin:15px 0 13px;
    transform:scaleX(0);transform-origin:left;transition:transform .9s ease .35s}
  .label.show .rule{transform:scaleX(1)}
  .label .cap{max-width:560px;font-size:15px;line-height:1.95;color:#e7e2d4;font-feature-settings:"palt";
    opacity:0;transform:translateY(6px);transition:opacity 1s ease .5s,transform 1s ease .5s}
  .label.show .cap{opacity:.96;transform:translateY(0)}

  /* 開演オーバーレイ */
  .start{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(1000px 700px at 50% 40%,rgba(217,178,106,.08),transparent 60%),#000;cursor:pointer;transition:opacity 1.6s ease}
  .start.gone{opacity:0;pointer-events:none}
  .start .k{font-family:"Helvetica Neue",sans-serif;letter-spacing:.5em;font-size:12px;color:var(--gold);text-indent:.5em;margin-bottom:26px}
  .start h1{font-size:clamp(34px,7vw,64px);font-weight:600;letter-spacing:.08em}
  .start .en{font-family:"Helvetica Neue",sans-serif;font-weight:300;letter-spacing:.36em;font-size:15px;color:#9a95a8;margin-top:20px;text-indent:.36em}
  .start .go{margin-top:52px;font-family:"Helvetica Neue",sans-serif;font-size:13px;letter-spacing:.22em;color:#e9e4d6;
    border:1px solid rgba(217,178,106,.5);border-radius:99px;padding:14px 30px;animation:breathe 3.2s ease-in-out infinite}
  .start .hint{position:fixed;bottom:max(34px, env(safe-area-inset-bottom));font-family:"Helvetica Neue",sans-serif;font-size:11px;letter-spacing:.12em;color:#5a5568;text-align:center;padding:0 20px}
  @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1;border-color:var(--gold)}}

  /* 運営用（既定は非表示。時計はC、一時停止はSpace） */
  .clock{position:fixed;top:max(26px, env(safe-area-inset-top));right:max(30px, env(safe-area-inset-right));z-index:20;font-family:"Helvetica Neue",sans-serif;font-size:13px;letter-spacing:.14em;
    color:rgba(255,255,255,.32);opacity:0;transition:opacity .6s}
  .clock.show{opacity:1}
  .paused{position:fixed;top:max(26px, env(safe-area-inset-top));left:max(30px, env(safe-area-inset-left));z-index:20;font-family:"Helvetica Neue",sans-serif;font-size:11px;letter-spacing:.22em;
    color:var(--gold);opacity:0;transition:opacity .5s}
  .paused.show{opacity:1}
  .cursor-on,html.cursor-on,html.cursor-on body{cursor:default}
</style>
</head>
<body>
  <div class="stage">
    <iframe class="layer" id="lA" allow="autoplay; microphone" scrolling="no"></iframe>
    <iframe class="layer" id="lB" allow="autoplay; microphone" scrolling="no"></iframe>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="label" id="label">
    <div class="no" id="lno"></div>
    <div class="ttl" id="ltt"></div>
    <div class="en" id="len"></div>
    <div class="rule"></div>
    <div class="cap" id="lcap"></div>
  </div>

  <div class="clock" id="clock">--:--</div>
  <div class="paused" id="paused">❙❙ PAUSED</div>

  <div class="start" id="start">
    <div class="k">MQRI ART</div>
    <h1>展示モード</h1>
    <div class="en">A ROOM OF INTERACTIVE GENERATIVE ART</div>
    <div class="go">▶ クリックで開演（全画面）</div>
    <div class="hint">→ 次へ ／ ← 戻る ／ Space 一時停止 ／ F 全画面 ／ L ラベル表示 ／ C 時計 ／ Esc 終了</div>
  </div>

<script>
  // ══════════ 設定（ここだけ変えればOK） ══════════
  const DWELL_SEC = 90;    // 1作品の表示秒数（90=1分半。5作品で7.5分→30分で約4周）
                           //   ※ゆっくりにしたいなら120〜150、速くしたいなら60あたり
  let showLabel = true;    // 左下の壁ラベルの初期表示。当日は「L」キーでいつでも切替できる
  const FADE_MS   = 2400;  // クロスフェード時間

  // 上映順（無から満ちるへ・受付〜開演の弧）。REGEN DAY 2026-07-13 で組んだ順序をそのまま持ってきている。
  // works/ には現在18点あるので、ここに足せば番組を伸ばせる（slug は works/<slug>/ のフォルダ名）。
  const ORDER = [
    {"slug":"genesis-of-form","no":"MQRI ART · 01","ttl":"幾何の創世","en":"Genesis of Form","cap":"はじめに、無があった。やがて最初の円が引かれ、二つの円が重なってヴェシカ・パイシスが生まれ、シード・オブ・ライフ、フラワー・オブ・ライフ、フルーツ・オブ・ライフへと展開し、ついにメタトロン・キューブ——五つのプラトン立体をすべて内包する図形——が立ち上がる。そして形は再び無へ還る。"},
    {"slug":"infinite-geometry","no":"MQRI ART · 02","ttl":"無限幾何回廊","en":"Infinite Geometry","cap":"円のなかに円が、そのなかにまた円が——円反転が生む「アポロニウスのガスケット」は、どこまで拡大しても同じ法則が現れる無限の入れ子構造をもつ。本作では、その宇宙のなかをカメラが永遠に潜行し続ける。"},
    {"slug":"cymatic-resonance","no":"MQRI ART · 03","ttl":"共鳴譜","en":"Cymatic Resonance","cap":"振動する盤の上で、砂は音を「見る」。振幅の激しい場所から弾かれ、振動が消える節線へと静かに沈着していく——18 世紀にクラドニが発見したこの現象を、52 万粒の砂の物理シミュレーションとして再現した。"},
    {"slug":"hopf-loom","no":"MQRI ART · 04","ttl":"HOPF LOOM","en":"S³ の織物","cap":"私たちの目は三次元までしか見えない。それでも数学は、四次元の球面 S³ が無数の円で隙間なく編み上げられていること——Hopf ファイブレーション——を知っている。本作は、その見えないはずの織物をステレオ投影によって三次元へ降ろし、入れ子のトーラス群が絶えず変形しながら呼吸する様を織機(loom)のように描く。"},
    {"slug":"quantum-mandala","no":"MQRI ART · 05","ttl":"量子曼荼羅","en":"Quantum Mandala","cap":"これは絵ではなく、方程式そのものである。画面に広がる光は、時間依存シュレーディンガー方程式を GPU 上で毎秒数百ステップ実時間で解いた波動関数 |ψ|² ——量子の存在確率だ。"}
  ];
  // ════════════════════════════════════════════════

  document.documentElement.style.setProperty('--fade', FADE_MS+'ms');
  const A=document.getElementById('lA'), B=document.getElementById('lB');
  const label=document.getElementById('label'), lno=document.getElementById('lno'), ltt=document.getElementById('ltt'), len=document.getElementById('len'), lcap=document.getElementById('lcap'), scrim=document.getElementById('scrim');
  let cur=0, activeLayer=null, timer=null, labelTimer=null, paused=false, started=false;

  // 各作品が画面に出す固有UI（タイトル・操作説明など）を隠すCSS。
  // 同一オリジンなのでiframe内に注入する。※作品ごとにセレクタが違う（一括指定はcanvas誤爆の危険）
  // ⚠ hopf-loom と quantum-mandala は iPad展示版で、ccf5-gallery 時代とマークアップが違う。
  //    セレクタを変えるときは必ず各作品の index.html を見て確認すること。
  const HIDE={
    "cymatic-resonance": "#ui,#readout,#freq,#mode,#hint",
    "infinite-geometry": ".ui",
    "hopf-loom":         "#topbar,#controls",
    "quantum-mandala":   "#hud,.block,.sub",
    "genesis-of-form":   "#hud,.corner,#dots"
  };
  function base(slug){ return '../works/' + slug + '/index.html'; }
  function hideHUD(frame,slug){
    try{
      const doc=frame.contentDocument, sel=HIDE[slug];
      if(doc && sel){ const st=doc.createElement('style'); st.textContent=sel+'{display:none!important;}'; (doc.head||doc.documentElement).appendChild(st); }
    }catch(e){}
  }

  function show(i){
    cur=(i+ORDER.length)%ORDER.length;
    const w=ORDER[cur];
    const incoming=(activeLayer===A)?B:A;
    const outgoing=activeLayer;
    incoming.onload=function(){
      incoming.onload=null;            // 一度きり（about:blankでの再発火を防ぐ＝真っ暗バグの原因）
      hideHUD(incoming,w.slug);
      relayKeys(incoming);             // 作品をクリックしてもキー操作が効くよう、iframe内にも監視を差し込む
      incoming.classList.add('on');
      if(outgoing) outgoing.classList.remove('on');
      activeLayer=incoming;
      if(outgoing){                     // フェード後に前のレイヤーを解放（表示中は絶対に消さないよう保護）
        setTimeout(()=>{ if(outgoing!==activeLayer){ outgoing.onload=null; outgoing.src='about:blank'; } }, FADE_MS+400);
      }
    };
    incoming.src=base(w.slug);
    curW=w;
    showWallLabel();
  }

  let curW=null;
  function setShown(on){ label.classList.toggle('show',on); scrim.classList.toggle('show',on); }
  function showWallLabel(){
    if(!showLabel || !curW){ setShown(false); return; }
    lno.textContent=curW.no; ltt.textContent=curW.ttl; len.textContent=curW.en; lcap.textContent=curW.cap||'';
    // 一度 show を外して付け直し、フェード＆線・本文の staggered 再生を毎回起こす
    setShown(false); void label.offsetWidth;
    setShown(true);
    clearTimeout(labelTimer);
    labelTimer=setTimeout(()=>setShown(false), 15000); // キャプションを読める長さで表示→フェード
  }

  function schedule(){ clearTimeout(timer); if(!paused) timer=setTimeout(()=>{ next(); }, DWELL_SEC*1000); }
  function next(){ show(cur+1); schedule(); }
  function prev(){ show(cur-1); schedule(); }

  // ── clock ──
  const clockEl=document.getElementById('clock'); let clockOn=false;
  setInterval(()=>{ const d=new Date(); clockEl.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); },1000);

  // ── start / fullscreen ──
  const startEl=document.getElementById('start');
  function begin(){
    if(started) return; started=true;
    startEl.classList.add('gone');
    const el=document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    show(0); schedule();
  }
  startEl.addEventListener('click', begin);

  // ── controls ──
  const pausedEl=document.getElementById('paused');
  function togglePause(){ paused=!paused; pausedEl.classList.toggle('show',paused); if(paused){clearTimeout(timer);} else {schedule();} }
  function toggleFull(){ try{ (document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch?.(()=>{}); }catch(e){} }
  function toggleClock(){ clockOn=!clockOn; clockEl.classList.toggle('show',clockOn); }
  function toggleLabel(){ showLabel=!showLabel; showWallLabel(); }

  // 1つのキー処理を、親ドキュメントと各iframeの両方に付ける（作品クリック後もフォーカスに関わらず効く）
  function onKey(e){
    if(!started){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); begin(); } return; }
    let handled=true;
    switch(e.key){
      case 'ArrowRight': next(); break;
      case 'ArrowLeft': prev(); break;
      case ' ': togglePause(); break;
      case 'f': case 'F': toggleFull(); break;
      case 'c': case 'C': toggleClock(); break;
      case 'l': case 'L': toggleLabel(); break;
      default: handled=false;
    }
    if(handled){ e.preventDefault(); e.stopPropagation(); }  // 予約キーは作品側に渡さない（→←Space等の二重動作を防ぐ）
  }
  function relayKeys(frame){
    try{ frame.contentDocument.addEventListener('keydown', onKey, true); }catch(e){}
  }
  document.addEventListener('keydown', onKey, true);

  // ── auto-hide cursor ──
  let cursorTimer=null;
  window.addEventListener('mousemove', ()=>{
    document.documentElement.classList.add('cursor-on');
    clearTimeout(cursorTimer);
    cursorTimer=setTimeout(()=>document.documentElement.classList.remove('cursor-on'), 2500);
  });
  window.addEventListener('contextmenu', e=>e.preventDefault());
</script>
</body>
</html>
